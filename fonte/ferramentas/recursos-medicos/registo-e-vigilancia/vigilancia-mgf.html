<style data-mgf="ferramenta">
  :root{
    --ink:#0F1E2E; --ink2:#38495D; --ink3:#6B7C90;
    --paper:#E9EDF2; --card:#FFFFFF; --line:#D5DDE7; --line2:#E7ECF2;
    --si:#A9660B; --sm:#8A4570; --dm:#0C6F7A; --hta:#A93444; --dpoc:#5B6B7A; --asma:#2F6FB0; --obes:#5C7A2E; --dom:#6B4FA0; --ras:#2A7F73;
    --ok:#1C7355; --now:#9A6B0C; --late:#AE2B22; --future:#8593A3;
    --okbg:#E6F2ED; --nowbg:#FBF0DA; --latebg:#FBE9E7; --futurebg:#EDF1F5;
    --falha:#C25E0B; --falhabg:#FDEBD6;
    --radius:10px;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--dm)}
  ::selection{background:#D9E6F2}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:auto 1fr;height:100%;grid-template-areas:"top top" "nav main"}
  .topbar{grid-area:top;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--ink);color:#EAF0F6;border-bottom:1px solid #0A1621}
  .brand{display:flex;align-items:baseline;gap:9px;font-weight:650;letter-spacing:-.01em}
  .brand small{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8FA6BC}
  .search{flex:1;max-width:420px;position:relative}
  .search input{width:100%;padding:7px 11px 7px 30px;border-radius:8px;border:1px solid #2A3E52;background:#17293A;color:#EAF0F6}
  .search input::placeholder{color:#7C93A8}
  .search input:focus{outline:2px solid #4C7FA6;outline-offset:0}
  .search .icn{position:absolute;left:9px;top:6px;color:#7C93A8}
  .savechip{margin-left:auto;font:500 11px/1 var(--mono);color:#8FA6BC;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#4E9E7C;display:inline-block}
  .dot.warn{background:#D3A44A}

  nav.side{grid-area:nav;background:#F5F7FA;border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
  nav.side .grp{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:12px 8px 6px}
  nav.side button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 9px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink2);font-weight:520}
  nav.side button:hover{background:#E7ECF3}
  nav.side button.on{background:var(--ink);color:#fff}
  nav.side button .bar{width:3px;height:16px;border-radius:2px;background:currentColor;opacity:.85}
  nav.side .count{margin-left:auto;font:600 11px var(--mono);color:var(--late)}
  nav.side button.on .count{color:#FFB3AC}

  #vg-main{grid-area:main;overflow:auto;padding:22px 26px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;letter-spacing:-.02em;margin:0 0 2px}
  .sub{color:var(--ink3);margin:0 0 20px}
  h2{font-size:15px;margin:26px 0 10px;letter-spacing:-.01em}

  /* ---------- cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px}
  .card.click{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .card.click:hover{transform:translateY(-1px);box-shadow:0 3px 14px rgba(16,30,46,.09)}
  .card .ttl{display:flex;align-items:center;gap:8px;font-weight:640;margin-bottom:10px}
  .card .ttl .swatch{width:9px;height:9px;border-radius:2px}
  .big{font:600 30px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .card .legend{display:flex;gap:14px;margin-top:10px;font:500 11px var(--mono);color:var(--ink3)}
  .card .legend b{display:block;font:600 15px/1.2 var(--sans);color:var(--ink)}

  /* ---------- table ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  .toolbar .grow{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-weight:560;color:var(--ink2)}
  .btn:hover{border-color:#B9C5D3;background:#FBFCFD}
  .btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.pri:hover{background:#1B3049}
  .btn.sm{padding:4px 8px;font-size:12px}
  .btn.danger{color:var(--late);border-color:#E7C7C4}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:560;color:var(--ink3)}
  .seg button.on{background:var(--ink);color:#fff}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:11px 12px;background:#F7F9FB;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#F8FAFC}
  .nm{font-weight:600}
  .meta{color:var(--ink3);font:500 12px var(--mono)}
  .ig,.age{color:var(--ink2);font:650 15px var(--mono);letter-spacing:.01em}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font:600 11px var(--mono);white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.now{background:var(--nowbg);color:var(--now)}
  .pill.late{background:var(--latebg);color:var(--late)}
  .pill.future{background:var(--futurebg);color:var(--future)}
  .pill.falha{background:var(--falhabg);color:var(--falha)}
  .chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:99px;background:var(--ink);color:#fff;font:700 12px var(--mono)}
  .tag{display:inline-block;padding:1px 7px;border-radius:5px;font:600 10.5px var(--mono);border:1px solid;margin-right:4px}
  .tag.si{color:var(--si);border-color:#E8D3B4;background:#FBF4E9}
  .tag.sm{color:var(--sm);border-color:#E3CBDA;background:#FAF1F6}
  .tag.dm{color:var(--dm);border-color:#BCDCE0;background:#EDF7F8}
  .tag.hta{color:var(--hta);border-color:#E7C5CA;background:#FBEEF0}
  .tag.dpoc{color:var(--dpoc);border-color:#CBD3DB;background:#EFF1F4}
  .tag.asma{color:var(--asma);border-color:#BCD7EE;background:#EAF3FB}
  .tag.obes{color:var(--obes);border-color:#D0DAB8;background:#F3F6EC}
  .tag.dom{color:var(--dom);border-color:#D6C7E8;background:#F5EFFA}
  .tag.ras{color:var(--ras);border-color:#BFDDD8;background:#EBF6F4}
  .mobhint{display:none;font-size:11px;color:var(--ink3);margin:2px 0}
  @media (max-width:760px){.mobhint{display:block}}
  .histgrid{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:6px 24px;margin-top:4px}
  @media (max-width:600px){.histgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:34px;text-align:center;color:var(--ink3)}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(15,30,46,.36);opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:var(--paper);box-shadow:-8px 0 34px rgba(15,30,46,.18);transform:translateX(102%);transition:transform .22s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;z-index:5}
  .drawer.on{transform:none}
  .dhead{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px 0}
  .dhead .row1{display:flex;align-items:flex-start;gap:12px}
  .dhead h3{margin:0;font-size:19px;letter-spacing:-.02em}
  .dtabs{display:flex;gap:2px;margin-top:14px}
  .dtabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;font-weight:580;color:var(--ink3)}
  .dtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  .dbody{flex:1;overflow:auto;padding:18px 20px 40px}

  /* signature: faixa de vigilância */
  .track{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 4px 10px;overflow-x:auto;margin-bottom:16px}
  .rail{display:flex;align-items:flex-start;min-width:min-content;position:relative;padding:0 14px}
  .rail::before{content:"";position:absolute;left:26px;right:26px;top:13px;height:2px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2))}
  .node{position:relative;flex:0 0 auto;width:62px;text-align:center;background:none;border:0;padding:0 2px}
  .node .knob{width:26px;height:26px;border-radius:50%;margin:0 auto;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font:700 11px var(--mono);position:relative;z-index:1;transition:transform .1s}
  .node:hover .knob{transform:scale(1.09)}
  .node .lb{display:block;margin-top:6px;font:600 10px/1.25 var(--mono);color:var(--ink3);letter-spacing:.01em}
  .node.ok .knob{background:var(--ok);border-color:var(--ok);color:#fff}
  .node.ok .lb{color:var(--ok)}
  .node.now .knob{background:#fff;border-color:var(--now);color:var(--now);box-shadow:0 0 0 4px var(--nowbg)}
  .node.now .lb{color:var(--now)}
  .node.late .knob{background:var(--latebg);border-color:var(--late);color:var(--late)}
  .node.late .lb{color:var(--late)}
  .node.falha .knob{background:var(--falhabg);border-color:var(--falha);color:var(--falha)}
  .node.falha .lb{color:var(--falha)}
  .node.future .knob{border-style:dashed;color:var(--future)}
  .node.na .knob{border-style:dotted;background:#F3F5F8;color:var(--future)}
  .node.na .lb{color:var(--future);text-decoration:line-through}

  .block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .block > h4{margin:0;padding:11px 14px;font:600 10.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);background:#F7F9FB;border-bottom:1px solid var(--line)}
  .item{display:flex;gap:11px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:0}
  .item.iclick{cursor:pointer}
  .item.iclick:hover{background:#F8FAFC}
  .item .chk{margin-top:2px;width:17px;height:17px;accent-color:var(--ok);flex:0 0 auto}
  .item .txt{flex:1;min-width:0}
  .item .txt b{font-weight:600}
  .item .txt span{display:block;color:var(--ink3);font-size:12.5px}
  .item .din{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:500 12px var(--mono);color:var(--ink2);background:#fff;width:100px}
  .item .val{width:78px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:500 12px var(--mono)}
  .din{font-family:var(--mono);letter-spacing:.02em;width:118px}
  .din.err{border-color:var(--late)!important;background:#FFF4F3}
  .field{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .field label{width:150px;color:var(--ink2);font-weight:560}
  .field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
  .field textarea{flex:1;min-height:66px;resize:vertical;font-family:var(--sans)}
  .hint{padding:9px 14px;color:var(--ink3);font-size:12.5px;background:#FAFBFD}

  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(15,30,46,.42);z-index:9;padding:20px}
  .modal.on{display:grid}
  .sheet{background:#fff;border-radius:14px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sheet h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
  .sheet .body{padding:16px 20px}
  .sheet .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
  .note{background:#FBF4E9;border:1px solid #E8D3B4;color:#7A4E08;border-radius:8px;padding:11px 13px;font-size:12.8px;margin-bottom:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 15px;border-radius:9px;font-weight:560;opacity:0;transition:.2s;z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  :focus-visible{outline:2px solid #4C7FA6;outline-offset:2px;border-radius:4px}
  @media (max-width:840px){
    .app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
    nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:4;display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line);border-right:0;padding:6px}
    nav.side .grp{display:none}
    nav.side button{width:auto;white-space:nowrap;font-size:12.5px}
    #vg-main{padding:16px 14px 90px}
    .field label{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- impressão ---------- */
  .print-only{display:none}
  @media print{
    body > *:not(#printArea):not(.mgf-ferramenta), .mgf-ferramenta > *:not(#printArea){display:none !important}
    #printArea{display:block !important;color:#000;font-family:var(--sans)}
    #printArea h1{font-size:16pt;margin:0 0 3pt}
    #printArea .sub{font-size:9.5pt;color:#555;margin:0 0 14pt}
    #printArea h2{font-size:12.5pt;margin:16pt 0 5pt;padding-bottom:3pt;border-bottom:1px solid #999}
    #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:8pt}
    #printArea th{text-align:left;padding:5pt 7pt;border-bottom:1.5px solid #333;font-weight:700}
    #printArea td{padding:5pt 7pt;border-bottom:0.5px solid #ccc}
    #printArea tr{break-inside:avoid}
    @page{margin:14mm}
  }

/* ===== MGF no Plural ===== */
.brand{font-family:'Bricolage Grotesque',var(--sans);font-weight:800}
h1{font-family:'Bricolage Grotesque',var(--sans);font-weight:800}
/* v6: títulos que ordenam (Utentes) e combinação de rastreios */
.tb-rolar{overflow-x:auto;border-radius:var(--radius)}
table.tb-ordenar th{padding:0}
table.tb-ordenar td.meta{white-space:nowrap}
table.tb-ordenar td:first-child{min-width:190px}
.age{white-space:nowrap}
.th-ord{all:unset;box-sizing:border-box;display:flex;gap:6px;align-items:center;width:100%;padding:11px 12px;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
.th-ord:hover{color:var(--ink)}
.th-ord:focus-visible{outline:2px solid var(--verde,#0F6E64);outline-offset:-2px}
.th-ord .seta{font-size:10px;opacity:.35}
.th-ord[data-ativo] .seta{opacity:1;color:var(--ink)}
.comb-ras{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px}
.comb-ras label{display:flex;gap:7px;align-items:center;width:auto;font-weight:500}
.comb-ras label small{color:var(--ink3)}
.comb-op{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:4px 14px 12px}
.comb-op > span{color:var(--ink3);font-size:12.5px}
.cel-ras .meta{display:block;margin-top:3px}
/* v7: painéis de Custos, Utilização e População; ligações entre fichas do agregado */
.tb-v7 td.num,.tb-v7 th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-v7 th.num .th-ord{justify-content:flex-end}
.tb-v7 tfoot td{border-top:2px solid var(--line);background:#FAFBFD;padding:10px 12px}
.lk{all:unset;cursor:pointer;color:var(--dm);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lk:hover{color:var(--ink)}
.lk:focus-visible{outline:2px solid var(--verde,#0F6E64);outline-offset:2px}
.bi-imp{background:#F3F8F6}
/* página completa: o <main> do site não pode partir a grelha da aplicação */
.pagina-completa .mgf-ferramenta{display:contents}
.search .icn{top:8px}
.search .icn svg{width:15px;height:15px;display:block}
.demo-faixa{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--nowbg);border:1px solid #E8D3B4;color:#6B4405;border-radius:var(--radius);padding:9px 12px;margin:0 0 16px}
.demo-convite{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--radius);padding:14px 16px;margin:0 0 18px}
.demo-convite > div{flex:1;min-width:240px;color:var(--ink2)}
.demo-convite b{display:block;color:var(--ink);margin-bottom:2px}
.sdm-imp{margin:8px 0 4px;border:1px solid var(--line);border-radius:8px;background:#FAFBFD}
.sdm-imp summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--ink2)}
.sdm-imp .hint{background:none}
.tb-simples tbody tr{cursor:default}
.tb-simples tbody tr:hover{background:none}
.rel .tabw{overflow-x:auto;margin-bottom:12px}
.rel table tbody tr{cursor:default}
.rel table tbody tr:hover{background:none}
.rel th.num,.rel td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rel .cards{margin-bottom:12px}
.rel .card .ttl{font-size:13px;margin-bottom:6px}
.rel .big{font-size:24px}
.rel .card .meta{margin-top:6px}
.rel .field .big{font-size:22px}
.rel-explica{color:var(--ink3);font-size:12.5px;margin:-4px 0 10px}

<script data-mgf="ferramenta">
/* =======================================================================
   Vigilância — acompanhamento de utentes em MGF
   Dados guardados só neste computador: num ficheiro .json ligado (Chrome/Edge)
   ou na base de dados do browser (IndexedDB). Adaptado para o MGF no Plural.
   ======================================================================= */

const KEY = 'mgf:vigilancia:v1';
let S = { patients: [], settings:{ retinaMeses:12 }, crossSets:[], v:1 };
/* -------------------------------------------------------------------------
   POLÍTICA DE COMPATIBILIDADE DE DADOS — para qualquer alteração futura:
   um ficheiro .json criado numa versão anterior deste programa TEM de
   continuar a abrir sem perder dados. Qualquer campo novo introduzido tem de
   ter um valor por omissão em newPatient()/ensure(), nunca assumir que o
   campo já existe. Toda a leitura de dados (ficheiro, este computador,
   restauro de cópia) passa por applyLoadedData() abaixo —
   é o único sítio onde a estrutura de dados é reconciliada, para nunca
   haver um ponto de carregamento esquecido. Se uma alteração alguma vez
   exigir mudar a estrutura de forma que não dê para reconciliar em
   silêncio, isso tem de ser assinalado ao médico antes de avançar, para
   que decida — nunca deve acontecer sem aviso.
   ------------------------------------------------------------------------- */
const SCHEMA_VERSION = 7; // v7: agregado (p.agregado) e ficha do BI-CSP/RNU (p.bi: residência, nacionalidade, utilização, custos de 12 meses) · v6: email do utente (p.email) e combinação de rastreios nas definições (S.settings.rasComb) · v5: dados do SDM (p.sdm: última consulta e gastos por ano) · v4: telefone, módulos Obesidade e Domicílios, cruzamentos personalizados (S.crossSets) — tudo aditivo
function applyLoadedData(d){
  if(!d) return;
  S.settings = Object.assign({retinaMeses:12}, d.settings||{});
  S.patients = (d.patients||[]).map(ensure);
  S.crossSets = Array.isArray(d.crossSets) ? d.crossSets : [];
  S.v = SCHEMA_VERSION;
}
let ui = { view:'painel', q:'', open:null, tab:null, filter:'todos', group:false, sort:'prioridade', crossSel:['dm','hta'], relSel:['dm','hta'], relModo:'e', relAno:null };

/* ---------------- datas e idades ---------------- */
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function toDate(iso){ if(!iso) return null; const p=String(iso).slice(0,10).split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function fmtPT(iso){ if(!iso) return '—'; const d=toDate(iso); return d? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}` : '—'; }
function addDays(iso,n){ const d=toDate(iso); if(!d) return null; d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ageMonths(dob){ const d=toDate(dob); if(!d) return null; const n=new Date();
  let m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate()) m-=1; return m; }
function ageYears(dob){ const m=ageMonths(dob); return m==null?null:Math.floor(m/12); }
function fmtAge(dob){ const m=ageMonths(dob); if(m==null) return '—';
  if(m<24) return m+' m'; return Math.floor(m/12)+'a '+(m%12)+'m'; }
function daysBetween(a,b){ const x=toDate(a),y=toDate(b); if(!x||!y) return null; return Math.round((y-x)/DAY); }

/* campo de data mascarado dd/mm/aaaa — evita o bug do <input type=date> nativo
   que confirma a alteração assim que o valor fica "válido" (por vezes já com 1
   dígito no ano), interrompendo a escrita a meio. */
function ptForInput(iso){ if(!iso) return ''; const d=toDate(iso); if(!d) return ''; return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function maskDate(raw){
  const digits=(raw||'').replace(/\D/g,'').slice(0,8);
  if(digits.length>4) return digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
  if(digits.length>2) return digits.slice(0,2)+'/'+digits.slice(2);
  return digits;
}
function maskCursor(el){
  const digitsBefore = el.value.slice(0, el.selectionStart).replace(/\D/g,'').length;
  el.value = maskDate(el.value);
  el.classList.remove('err');
  let pos=0,count=0;
  while(pos<el.value.length && count<digitsBefore){ if(/\d/.test(el.value[pos])) count++; pos++; }
  el.setSelectionRange(pos,pos);
}
function parsePT2ISO(s){
  s=(s||'').trim();
  if(!s) return '';
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12) return null;
  const bis = (y%4===0&&(y%100!==0||y%400===0));
  const dim=[31,bis?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  if(d<1||d>dim) return null;
  if(y<1900||y>2100) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
/** Aplica ao campo `el` o novo valor, ou reverte e avisa se a data for inválida.
 *  onValid(iso) só é chamado quando iso === '' (limpo) ou uma data válida. */
function commitDin(el, previousIso, onValid){
  const iso = parsePT2ISO(el.value);
  if(iso===null){ el.classList.add('err'); toast('Data inválida — usa dd/mm/aaaa'); el.value=ptForInput(previousIso); return; }
  if(iso){
    const p0 = ui.open ? S.patients.find(x=>x.id===ui.open) : null;
    if(p0 && p0.dob && el.dataset.f!=='dob' && iso < p0.dob){
      el.classList.add('err'); toast('Data anterior ao nascimento do utente — não aceite'); el.value=ptForInput(previousIso); return; }
    if(p0 && ui.tab==='si' && /^cons:/.test(el.dataset.date||'') && iso > todayISO()){
      el.classList.add('err'); toast('Data posterior a hoje — não aceite'); el.value=ptForInput(previousIso); return; }
  }
  onValid(iso);
}


/* Idade gestacional em dias, a partir da DUM (ou da DPP corrigida) */
function igDias(sm){
  if(!sm) return null;
  let base = sm.dum;
  if(sm.dppc) base = addDays(sm.dppc,-280);
  if(!base) return null;
  const ref = sm.parto || todayISO();
  return daysBetween(base, ref);
}
function fmtIG(d){ if(d==null) return '—'; return Math.floor(d/7)+'s '+(d%7)+'d'; }
function dpp(sm){ if(sm.dppc) return sm.dppc; return sm.dum? addDays(sm.dum,280): null; }

/* ---------------- estados ---------------- */
/* ok = feito · now = janela aberta · late = em atraso · future = ainda não devido */
const RANK = { late:3, now:2, ok:1, future:0, na:0, falha:0, falta:0, naplic:0, cfuturo:0 };
function winStatus(rec, cur, from, to){
  if(rec && rec.na) return 'na';
  if(rec && rec.done) return 'ok';
  if(cur==null) return 'future';
  if(cur < from) return 'future';
  if(cur <= to) return 'now';
  return 'late';
}

function newPatient(o={}){
  return {
    id: o.id || 'p'+Math.random().toString(36).slice(2,10),
    nome: o.nome||'', dob: o.dob||'', sns: o.sns||'', sexo: o.sexo||'', telefone: o.telefone||'', email: o.email||'', agregado: o.agregado||'', bi: o.bi||null, notas: o.notas||'',
    prog: Object.assign({si:false,sm:false,dm:false,hta:false,dpoc:false,asma:false,obesidade:false,dom:false,ras:false}, o.prog||{}),
    si:{cons:{},aval:{},marcada:{date:''},obs:''},
    sm:{ativa:true,dum:'',dppc:'',rh:'',parto:'',cons:{},eco:{},lab:{},vac:{},antid:{},puerp:{},marcada:{date:''},obs:''},
    dm:{cons:{},a1c:{},retina:{},pe:{},lab:{},ultimoA1c:{valor:'',data:''},marcada:{date:''},obs:''},
    hta:{cons:{},lab:{},ta:{data:'',sis:'',dia:''},marcada:{date:''},obs:''},
    dpoc:{cons:{},espiro:{},vacGripe:{},vacCovid:{},vacPneumo:{},marcada:{date:''},obs:''},
    asma:{cons:{},espiro:{},vacGripe:{},vacCovid:{},vacPneumo:{},marcada:{date:''},obs:''},
    obesidade:{cons:{},lab:{},marcada:{date:''},obs:''},
    dom:{periodicidade:'trimestral',visita:{date:''},marcada:{date:''},obs:''},
    ras:{manual:false,off:false,prompted:false,fumador:false,sel:{},rec:{},marcada:{date:''},obs:''},
    hist:{fi:false,pa:false,pi:false,af:false,al:false,hc:false},
    med:{txt:'',orig:'',saved:''},
    vac:{pnv:false,extra:false,extraTxt:''},
    sdm:{ultConsulta:'',gastos:{}}
  };
}
function ensure(p){ const t=newPatient({id:p.id});
  for(const k of ['si','sm','dm','hta','dpoc','asma','obesidade','dom','ras','hist','med','vac','sdm']) p[k]=Object.assign(t[k],p[k]||{});
  if(!p.sdm.gastos || typeof p.sdm.gastos!=='object') p.sdm.gastos={};
  p.prog=Object.assign({si:false,sm:false,dm:false,hta:false,dpoc:false,asma:false,obesidade:false,dom:false,ras:false},p.prog||{});
  p.telefone = p.telefone || '';
  p.email = typeof p.email==='string' ? p.email : '';
  p.agregado = p.agregado==null ? '' : String(p.agregado);
  p.bi = p.bi && typeof p.bi==='object' && !Array.isArray(p.bi) ? p.bi : null;
  p.notas = p.notas || '';
  return p; }

   ======================================================================= */
/* Janelas por idade chave, em dias de vida: meses de vida de 30 dias até aos 18 meses
   (ponto médio nos saltos), anos completos a partir dos 2 anos.
   s/e = primeiro/último dia da janela · pt = fim de "a fazer" (depois, até e, "em atraso").
   sy/ey/py = o mesmo em aniversários (ey: a janela acaba na véspera; py: "a fazer" acaba na véspera). */
const SI_WIN = {
  c00:{s:0,  e:15,  pt:15},  c01:{s:16, e:30,  pt:30},  c02:{s:31, e:75,  pt:60},
  c04:{s:76, e:135, pt:120}, c06:{s:136,e:210, pt:180}, c09:{s:211,e:300, pt:270},
  c12:{s:301,e:390, pt:360}, c15:{s:391,e:480, pt:450}, c18:{s:481,e:615, pt:540},

  c144:{sy:12,ey:15,py:13}, c180:{sy:15,ey:18,py:16}
};
function bdayISO(dob,n){ const d=toDate(dob); if(!d) return null;
  let r=new Date(d.getFullYear()+n,d.getMonth(),d.getDate());
  if(r.getMonth()!==d.getMonth()) r=new Date(d.getFullYear()+n,d.getMonth()+1,0);
  return `${r.getFullYear()}-${pad(r.getMonth()+1)}-${pad(r.getDate())}`; }
function siWin(id,dob){ const w=SI_WIN[id]; if(!w||!toDate(dob)) return null;
  return {
    start: w.s!=null ? addDays(dob,w.s) : bdayISO(dob,w.sy),
    pt:    w.pt!=null ? addDays(dob,w.pt) : addDays(bdayISO(dob,w.py),-1),
    end:   w.e!=null ? addDays(dob,w.e) : addDays(bdayISO(dob,w.ey),-1)
  }; }
function siKeyForDate(dob,iso){ if(!iso||!toDate(dob)) return null;
  for(const c of SI_CONS){ const w=siWin(c.id,dob); if(w && iso>=w.start && iso<=w.end) return c.id; }
  return null; }
function siState(p,c){
  const rec=p.si.cons[c.id], w=siWin(c.id,p.dob);
  if(!w) return winStatus(rec, ageMonths(p.dob), c.from, c.to);
  if(rec && rec.na) return 'na';
  if(rec && rec.done){ if(rec.date && !(rec.date>=w.start && rec.date<=w.end)) return 'falha'; return 'ok'; }
  const t=todayISO();
  if(t<w.start) return 'future';
  if(t<=w.pt) return 'now';
  if(t<=w.end) return 'late';
  return 'falha';
}
const siFull = id => (SI_CONS.find(c=>c.id===id)||{}).full||id;

/* Reatribuição de datas às idades chave corretas */
function siPlanRealloc(p){
  const cons=p.si.cons, ign=p.si.ignoraRealoc||{}, mis=[];
  SI_CONS.forEach(c=>{ const r=cons[c.id]; if(!(r&&r.done&&r.date)) return;
    const t=siKeyForDate(p.dob,r.date); if(t&&t!==c.id) mis.push({from:c.id,to:t,date:r.date}); });
  const byTo={}; mis.forEach(m=>{ (byTo[m.to]=byTo[m.to]||[]).push(m); });
  const moves=[], conflicts=[];
  Object.keys(byTo).forEach(t=>{
    const best=byTo[t].slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)[0];
    const ex=cons[t], vacating=mis.some(m=>m.from===t);
    if(ex && ex.done && ex.date && !vacating && ex.date!==best.date){
      if(ign[best.from]!==best.date) conflicts.push({from:best.from,to:t,date:best.date,existing:ex.date});
    } else moves.push({from:best.from,to:t,date:best.date});
  });
  return {moves,conflicts};
}
function siApplyMoves(p,list){
  const cons=p.si.cons;
  list.forEach(m=>{ cons[m.from]={}; });
  list.forEach(m=>{ const ex=cons[m.to];
    if(!m.replace && ex && ex.done && ex.date && ex.date!==m.date){ cons[m.from]={done:true,date:m.date}; return; }
    cons[m.to]={done:true,date:m.date}; });
}
function siConflictModal(title,intro,items,onApply){

    <label style="display:block;margin-top:6px"><input type="radio" name="cf${i}" value="a"${it.def==='a'?' checked':''}> ${it.a}</label>
    <label style="display:block;margin-top:4px"><input type="radio" name="cf${i}" value="b"${it.def==='b'?' checked':''}> ${it.b}</label></div>`).join('');
  openModal(title, html, [{lb:'Cancelar'},{lb:'Aplicar escolhas',pri:true,fn:()=>{
    const ch=items.map((it,i)=>{ const r=document.querySelector(`#sheet input[name="cf${i}"]:checked`); return r?r.value:it.def; });
    onApply(ch); }}]);
}
function siAutoRealloc(p){
  if(!p.prog || !p.prog.si || !toDate(p.dob)) return;
  const plan=siPlanRealloc(p);
  if(plan.moves.length){
    siApplyMoves(p,plan.moves); markDirty();
    toast(plan.moves.length===1 ? `Data ${fmtPT(plan.moves[0].date)} movida para ${siFull(plan.moves[0].to)}`
                               : `${plan.moves.length} datas movidas para as idades chave correspondentes`);
  }
  if(plan.conflicts.length){
    const items=plan.conflicts.map(c=>({
      label: siFull(c.to),
      a: `Manter ${fmtPT(c.existing)} em ${esc(siFull(c.to))} e deixar ${fmtPT(c.date)} em ${esc(siFull(c.from))} (falha de idade chave)`,
      b: `Reatribuir ${fmtPT(c.date)} de ${esc(siFull(c.from))} para ${esc(siFull(c.to))} (substitui ${fmtPT(c.existing)})`,
      def: c.date<c.existing?'b':'a'}));
    setTimeout(()=>siConflictModal('Datas fora da idade chave',
      'Foram encontradas datas colocadas fora da idade chave correspondente à idade que a criança tinha. Escolhe o que fazer em cada caso:',
      items, ch=>{
        p.si.ignoraRealoc=p.si.ignoraRealoc||{};
        const mv=[];
        plan.conflicts.forEach((c,i)=>{ if(ch[i]==='b') mv.push({from:c.from,to:c.to,date:c.date,replace:true}); else p.si.ignoraRealoc[c.from]=c.date; });
        if(mv.length) siApplyMoves(p,mv);
        markDirty(); renderDrawer();
      }),0);
  }
}
/* data editada à mão: se corresponder a outra idade chave, passa para ela (se estiver livre) */
function siRelocateEdited(p,key,iso){
  const t=siKeyForDate(p.dob,iso); if(!t||t===key) return;
  const ex=p.si.cons[t];
  if(ex && ex.done && ex.date && ex.date!==iso) return;
  p.si.cons[key]={}; p.si.cons[t]={done:true,date:iso};
  toast('Data movida para '+siFull(t));
}
/* campo "Inserir datas de consultas realizadas" */
function siParseDatas(text,dob){
  const valid=[], ignored=[], hoje=todayISO();
  const reF=/(?<!\d)(?<!\d[-\/.])(\d{1,2})([-\/.])(\d{1,2})\2(\d{4})(?!\d)(?![-\/.]\d)/g;
  const re8=/(?<!\d)(?<!\d[-\/.])(\d{8})(?!\d)(?![-\/.]\d)/g;
  const parecData=/\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|(?<!\d)\d{8}(?!\d)/;
  const aceitar=(tok,dd,mm,yyyy)=>{
    const iso=parsePT2ISO(`${dd}/${mm}/${yyyy}`);
    if(!iso){ ignored.push({tok,why:'data inexistente'}); return; }
    if(dob && iso<dob){ ignored.push({tok,why:'anterior ao nascimento'}); return; }
    if(iso>hoje){ ignored.push({tok,why:'posterior à data atual'}); return; }
    const key=siKeyForDate(dob,iso);
    if(!key){ ignored.push({tok,why:'não corresponde a nenhuma idade chave'}); return; }
    valid.push({iso,key});
  };
  (text||'').split(/[\s,;]+/).forEach(raw=>{
    if(!raw) return;
    const found=[]; let m;
    reF.lastIndex=0; while((m=reF.exec(raw))) found.push({i:m.index,tok:m[0],dd:m[1],mm:m[3],yyyy:m[4]});
    re8.lastIndex=0; while((m=re8.exec(raw))) found.push({i:m.index,tok:m[0],dd:m[1].slice(0,2),mm:m[1].slice(2,4),yyyy:m[1].slice(4)});
    if(found.length){ found.sort((x,y)=>x.i-y.i).forEach(x=>aceitar(x.tok,x.dd,x.mm,x.yyyy)); return; }
    if(parecData.test(raw)) ignored.push({tok:raw.replace(/^[^0-9A-Za-z]+|[^0-9A-Za-z]+$/g,''),why:'formato não reconhecido'});
  });
  return {valid,ignored};
}
function siAssumir(p,text){
  const r=siParseDatas(text,p.dob);
  const best={}; r.valid.forEach(v=>{ if(!best[v.key]||v.iso<best[v.key]) best[v.key]=v.iso; });
  const sets=[], conf=[];
  Object.keys(best).forEach(k=>{ const d=best[k], ex=p.si.cons[k];
    if(ex && ex.done && ex.date && ex.date!==d) conf.push({key:k,ex:ex.date,nw:d});
    else if(!(ex && ex.done && ex.date===d)) sets.push({key:k,date:d}); });
  const ignHtml = r.ignored.length
    ? `<p><b>${r.ignored.length} data(s) ignorada(s):</b></p><ul style="margin:4px 0 8px 18px">${r.ignored.map(x=>`<li>${esc(x.tok)} — ${esc(x.why)}</li>`).join('')}</ul>` : '';
  if(!sets.length && !conf.length){
    if(r.ignored.length) openModal('Nenhuma data assumida', ignHtml, [{lb:'Fechar',pri:true}]);
    else toast('Nenhuma data reconhecida');
    return;
  }
  const put=(k,d)=>{ SI_CONS.forEach(c=>{ const x=p.si.cons[c.id]; if(c.id!==k && x && x.done && x.date===d) p.si.cons[c.id]={}; });
    p.si.cons[k]={done:true,date:d}; };
  const finish=ch=>{
    let n=0;
    sets.forEach(s=>{ put(s.key,s.date); n++; });
    conf.forEach((c,i)=>{ if(ch[i]==='b'){ put(c.key,c.nw); n++; } });
    ui.siDatas=''; markDirty(); renderDrawer();
    toast(n+' consulta(s) preenchida(s) pelas datas inseridas');
    if(r.ignored.length && !conf.length) setTimeout(()=>openModal('Datas ignoradas', ignHtml, [{lb:'Fechar',pri:true}]),0);
  };
  if(!conf.length){ finish([]); return; }
  siConflictModal('Idade chave já tem data',
    (ignHtml||'') + 'As idades chave abaixo já têm uma data diferente. Escolhe qual manter em cada uma:',
    conf.map(c=>({label:siFull(c.key),
      a:`Manter ${fmtPT(c.ex)} (já registada)`, b:`Usar ${fmtPT(c.nw)} (inserida agora)`,
      def:c.nw<c.ex?'b':'a'})),
    finish);
}

/* ---- PNV: idades vacinais (mês/ano de vida) ---- */
const SI_VAC = [ {s:0,e:15}, {s:31,e:60}, {s:91,e:120}, {s:151,e:180}, {s:331,e:360}, {s:511,e:540}, {sy:5,ey:6}, {sy:10,ey:11} ];
function siVacWins(dob){ return SI_VAC.map(v=>({
  s: v.s!=null ? addDays(dob,v.s) : bdayISO(dob,v.sy),
  e: v.e!=null ? addDays(dob,v.e) : addDays(bdayISO(dob,v.ey),-1) })); }
/* referência da última consulta-chave assinalada como realizada (data, ou início da janela se não tiver data) */
function siLastConsRef(p,fim){ let ref=null;
  SI_CONS.forEach(c=>{ const r=p.si.cons[c.id]; if(!(r&&r.done)) return;
    const w=siWin(c.id,p.dob); const d=r.date||(w&&(fim?w.end:w.start))||null; if(d && (!ref||d>ref)) ref=d; });
  return ref; }
function siPnvState(p){
  const rec=p.si.aval.pnv, base=winStatus(rec, ageMonths(p.dob), 0, 215);
  if(base==='na') return 'na';
  if(!(rec && rec.done)) return base==='late' ? 'now' : base;      /* sem registo: como até aqui */
  if(!toDate(p.dob)) return 'ok';
  const cref=siLastConsRef(p), ref=rec.date||siLastConsRef(p,true);
  if(!ref) return 'ok';
  const t=todayISO(), pend=siVacWins(p.dob).filter(v=>v.s<=t && v.s>ref);
  if(!pend.length) return 'ok';
  if(rec.date && cref && rec.date<cref) return 'late';
  return pend.some(v=>v.e<t) ? 'late' : 'now';
}
function monthsISO(dob,n){ const d=toDate(dob); if(!d) return null;
  let r=new Date(d.getFullYear(),d.getMonth()+n,d.getDate());
  if(r.getDate()!==d.getDate()) r=new Date(d.getFullYear(),d.getMonth()+n+1,0);
  return `${r.getFullYear()}-${pad(r.getMonth()+1)}-${pad(r.getDate())}`; }
function siParamState(p,c,m,cons){
  const st=winStatus(p.si.aval[c.id], m, c.from, c.to);
  if(st!=='now' && st!=='late') return st;
  const end=addDays(monthsISO(p.dob,c.to+1),-1), t=todayISO();
  const nx=cons.find(i=>i.st==='late'||i.st==='now'||i.st==='future');
  const w=nx?siWin(nx.key,p.dob):null;
  const ref=(w && w.start>t) ? w.start : t;
  return ref>end ? 'falta' : 'now';
}
function siTaState(p,c,m){ const st=winStatus(p.si.aval[c.id], m, c.from, c.to);
  return st==='future' ? 'naplic' : st==='late' ? 'now' : st; }
/* cheques-dentista */
function chequeOn(p,q){
  if(p.si.cheques && q.id in p.si.cheques) return !!p.si.cheques[q.id];
  if(q.old){ const r=p.si.aval[q.old]; return !!(r && r.done); }
  return false; }
function chequeState(p,q){
  if(chequeOn(p,q)) return 'ok';
  const t=todayISO(), a=bdayISO(p.dob,q.n), b=bdayISO(p.dob,q.n+1);
  if(!a) return 'future';
  if(t<a) return 'cfuturo';
  if(t<b) return 'now';
  return 'late';
}

function siItems(p){
  const m = ageMonths(p.dob);
  const out=[];
  SI_CONS.forEach(c=> out.push({key:c.id, kind:'cons', lb:c.full, short:c.lb, from:c.from, to:c.to,
    rec:p.si.cons[c.id]||{}, st:siState(p,c)}));
  /* Avaliações e rastreios são opcionais: nunca escalam a "em atraso" — ficam
     no máximo como "a fazer", para não gerar alertas de atraso indevidos. */
  const consIt=out.slice();
  SI_AVAL.forEach(c=>{ let st;
    if(c.id==='pnv') st=siPnvState(p);
    else if(c.id==='ta36') st=siTaState(p,c,m);
    else st=siParamState(p,c,m,consIt);
    out.push({key:c.id, kind:'aval', lb:c.lb, hint:c.hint, from:c.from, to:c.to,
      rec:p.si.aval[c.id]||{}, st}); });
  return out;
}
function smItems(p){
  const d = igDias(p.sm); const w = d==null?null:Math.floor(d/7);
  const out=[];
  SM_CONS.forEach(c=> out.push({key:c.id,kind:'cons',lb:c.full,short:c.lb,rec:p.sm.cons[c.id]||{},
    st:winStatus(p.sm.cons[c.id], w, c.from, c.to)}));
  SM_ECO.forEach(c=> out.push({key:c.id,kind:'eco',lb:c.lb,hint:c.hint,rec:p.sm.eco[c.id]||{},
    st:winStatus(p.sm.eco[c.id], w, c.from, c.to)}));
  SM_LAB.forEach(c=> out.push({key:c.id,kind:'lab',lb:c.lb,hint:c.hint,rec:p.sm.lab[c.id]||{},
    st:winStatus(p.sm.lab[c.id], w, c.from, c.to)}));
  SM_VAC.forEach(c=> out.push({key:c.id,kind:'vac',lb:c.lb,hint:c.hint,rec:p.sm.vac[c.id]||{},
    st:winStatus(p.sm.vac[c.id], w, c.from, c.to)}));
  if(p.sm.rh==='neg') out.push({key:'antid',kind:'antid',lb:'Imunoglobulina anti-D',hint:'Administrar às 28 semanas (Rh negativo)',
    rec:p.sm.antid||{}, st:winStatus(p.sm.antid, w, 28, 30)});
  /* Revisão de parto/puerpério — dois gatilhos:
     a) sem data de parto registada, mas já com 42 semanas ou mais: alerta a confirmar o parto;
     b) com data de parto registada: janela habitual até aos 42 dias pós-parto. */
  if(p.sm.parto){
    const dias = daysBetween(p.sm.parto, todayISO());
    out.push({key:'puerp',kind:'puerp',lb:'Revisão de parto',hint:'Até aos 42 dias pós-parto',

  } else if(w!=null && w>=42){
    out.push({key:'puerp',kind:'puerp',lb:'Revisão de parto',hint:'Gravidez com 42 semanas ou mais — confirma o parto e regista a data',
      rec:p.sm.puerp||{}, st: w>=43?'late':'now'});
  }
  return out;
}
function dmItems(p){

function htaItems(p){

/* DPOC e Asma partilham a mesma estrutura de vigilância: 1 consulta/ano,
   espirometria válida 3 anos, e três vacinas de registo livre. As vacinas
   nunca escalam a "em atraso" — a periodicidade real depende do risco e da

function respItems(p,k){

  out.push({key:'vacPneumo',kind:'vac',lb:'Vacina pneumocócica',hint:'Esquema depende do risco — confirma a indicação',rec:rec.vacPneumo||{},st:vacSt(rec.vacPneumo)});

/* Obesidade: 1 consulta/ano + análises anuais (glicose/HbA1c e perfil

function obesItems(p){

/* Domicílios: em vez de uma periodicidade fixa (que não existe de forma
   universal para visitas domiciliárias — depende do plano de cada utente),
   o médico define a frequência desejada por utente e o programa calcula o
   atraso a partir disso. */
const DOM_PERIODOS = {mensal:1, trimestral:3, semestral:6, anual:12};
const DOM_PERIODOS_LB = {mensal:'mensal', trimestral:'trimestral', semestral:'semestral', anual:'anual'};
function domItems(p){
  const meses = DOM_PERIODOS[p.dom.periodicidade] || 3;
  return [{key:'visita',kind:'single',lb:'Visita domiciliária',
    hint:`Periodicidade definida: ${DOM_PERIODOS_LB[p.dom.periodicidade]||'trimestral'} (a cada ${meses} meses)`,
    rec:p.dom.visita||{}, st:validade(p.dom.visita, meses)}];
}
function validade(rec, meses){
  if(!rec||!rec.date) return 'now';
  const d = daysBetween(rec.date, todayISO());
  if(d==null) return 'now';
  if(d <= meses*30.5) return 'ok';
  if(d <= meses*30.5+61) return 'now';
  return 'late';
}

  {id:'osteo',lb:'Rastreio de Osteoporose', short:'Osteoporose', once:true, fromBySex:{F:65,M:70}, to:74, tip:'Autoexclusão'},
  {id:'oral', lb:'Rastreio de Neoplasia da Cavidade Oral', short:'Cavidade oral', smoker:true, once:true, from:40, to:74, tip:'Autoexclusão'},
  {id:'pulm', lb:'Rastreio de Cancro do Pulmão', short:'Pulmão', smoker:true, once:true, from:55, to:74, tip:'Autoexclusão'},
  {id:'aorta',lb:'Rastreio de Aneurisma da Aorta', short:'Aneurisma da aorta', smoker:true, once:true, sex:'M', from:65, to:75, tip:'Autoexclusão'}
];
const RAS_FRAX = 'https://www.fraxplus.org/calculation-tool?country=53';
const rasFrom = (d,p)=> d.fromBySex ? d.fromBySex[p.sexo] : d.from;
function fmtMY(iso){ const d=toDate(iso); return d? pad(d.getMonth()+1)+'/'+d.getFullYear() : ''; }
function rasRange(d,p){
  const a=ageYears(p.dob); if(a==null) return 'x';
  if(p.sexo!=='F' && p.sexo!=='M') return 'x';
  if(d.sex && d.sex!==p.sexo) return 'x';
  const f=rasFrom(d,p);
  return a<f ? 'pre' : (a<=d.to ? 'in' : 'post');
}
function rasGeneral(p){ const a=ageYears(p.dob); if(a==null) return false;
  return (p.sexo==='F' && a>=30 && a<=74) || (p.sexo==='M' && a>=50 && a<=74); }
function rasList(p){
  const out=[], sel=(p.ras&&p.ras.sel)||{};
  RAS_DEFS.forEach(d=>{
    const man=!!sel[d.id];
    if(d.smoker && !(p.ras.fumador||man)) return;
    if(man){ out.push({d,active:true}); return; }
    const r=rasRange(d,p);
    if(r==='x'||r==='pre') return;
    out.push({d,active:r==='in'});
  });
  return out;
}
/* mantém-se no programa depois dos 74 enquanto algum rastreio ainda estiver dentro da idade */
function rasKeep(p){ const a=ageYears(p.dob); if(a==null) return false;
  const min = p.sexo==='F' ? 30 : p.sexo==='M' ? 50 : 999;
  return a>=min && rasList(p).some(i=>i.active); }
function rasSync(p){
  if(!p.ras) return false;
  let want;
  if(p.ras.off) want=false;
  else if(p.ras.manual) want=true;
  else want = rasGeneral(p) || rasKeep(p);
  if(!!p.prog.ras!==want){ p.prog.ras=want; return true; }
  return false;
}
function rasSyncAll(){ let ch=false; S.patients.forEach(p=>{ if(rasSync(p)) ch=true; }); if(ch) markDirty(); }
function rasToggle(p,on){
  if(on){ p.ras.off=false; p.prog.ras=true; if(!(rasGeneral(p)||rasKeep(p))) p.ras.manual=true; }
  else { p.prog.ras=false; p.ras.off=true; p.ras.manual=false; }
}
function rasHasData(p){
  if(!p.ras) return false;
  const rec=p.ras.rec||{};
  return !!p.ras.fumador || Object.keys(p.ras.sel||{}).length>0 ||
    Object.keys(rec).some(k=>{ const r=rec[k]; return r && (r.date||r.excl||r.alto||r.tipo||r.res||r.psa); });
}
/* intervalos: meses (m) ou dias (d) */
const RAS_IMP_VAL = {rccu:60, rcm:24, rccr:24};   /* validade (meses) da marca importada "em dia" */
const RAS_RCCU = {neg:{m:60}, hpv:{m:12}, outro:{hosp:true}};
const RAS_COLO = {prep:{m:12,alto:{d:90}}, normal:{m:120,alto:{m:60}}, adenomas:{m:36}, fragm:{m:3,note:'3 a 6 meses'}, neo:{hosp:true}};
const RAS_PSA  = {lt1:{m:60}, p13:{m:24}, gt10:{hosp:true}};
function rasEval(p,it){
  const d=it.d, r=((p.ras.rec||{})[d.id])||{}, t=todayISO();
  const o={d,r,active:it.active,st:'now',next:null,msg:'',note:''};
  if(r.excl){ o.st='na'; o.msg='Utente não elegível'; return o; }
  if(r.imp && !r.date && (d.id==='rccu'||d.id==='rcm'||d.id==='rccr')){
    /* marca "em dia" expira à periodicidade do rastreio, a contar da data da importação; depois fica "em atraso" sem data */
    if(r.imp.v==='ok' && todayISO()>monthsISO(r.imp.d,RAS_IMP_VAL[d.id])){ o.st='late'; return o; }
    o.st=r.imp.v==='ok'?'ok':'late'; o.imp=true; o.msg='Importado do Excel em '+fmtPT(r.imp.d); return o; }
  if(d.once){
    if(r.date){ o.st='ok'; return o; }
    if(d.id==='osteo'){ o.st='now'; return o; }
    o.st='now'; return o;
  }
  let iv=null, hosp=false, need='', alto=false;
  if(d.id==='rccu'){
    if(!r.date) return o;
    const x=RAS_RCCU[r.res]; if(!x) need='Falta escolher o resultado'; else if(x.hosp) hosp=true; else iv=x;
  } else if(d.id==='rcm'){
    if(!r.date) return o; iv={m:24};
  } else if(d.id==='rccr'){
    alto=!!r.alto; const tipo = alto ? 'colo' : r.tipo;
    if(alto && !r.date){ o.st='late'; o.msg='Realizar agora'; if(r.custom){ o.next=r.custom; o.st = t>r.custom?'late':'now'; o.msg=''; } return o; }
    if(!r.date) return o;
    if(!tipo) need='Falta escolher o tipo de exame';
    else if(tipo==='psof') iv={m:24};
    else { const x=RAS_COLO[r.res2]; if(!x) need='Falta escolher o resultado';
      else if(x.hosp) hosp=true; else { iv = (alto && x.alto) ? x.alto : x; o.note=x.note||''; } }
  } else if(d.id==='rcp'){
    if(!r.date) return o;
    if(r.psa==='p310'){ if(r.sub==='gt') iv={m:12}; else if(r.sub==='le') hosp=true; else need='Falta escolher PSA L/T'; }
    else { const x=RAS_PSA[r.psa]; if(!x) need='Falta escolher o valor do PSA'; else if(x.hosp) hosp=true; else iv=x; }
  }
  if(need){ o.st='now'; o.msg=need; return o; }
  if(hosp){ o.st='ok'; o.msg='Seguimento hospitalar'; return o; }
  if(iv){
    o.next = iv.m!=null ? monthsISO(r.date,iv.m) : addDays(r.date,iv.d);
    const days = iv.m!=null ? iv.m*30.44 : iv.d;
    o.win = Math.min(182, Math.round(days/3));
  }
  o.auto=o.next;
  if(alto && r.custom){ o.next=r.custom; if(o.win==null) o.win=30; }
  if(o.next){
    if(t>o.next) o.st='late';
    else if(t>=addDays(o.next,-o.win)) o.st='now';
    else o.st='ok';
  }
  return o;
}
function rasStatus(p){
  const items=rasList(p).map(i=>rasEval(p,i)).filter(o=>o.active && o.st!=='na');
  let st='ok'; items.forEach(o=>{ if(RANK[o.st]>RANK[st]) st=o.st; });
  const late=items.filter(o=>o.st==='late'), now=items.filter(o=>o.st==='now');
  let next='Em dia';
  /* "Próximo passo" mostra só os rastreios gerais; os do fumador só quando são os únicos pendentes */
  const gen=a=>{ const g=a.filter(o=>!o.d.smoker); return g.length?g:a; };
  if(late.length){
    const L=gen(late), ds=L.map(o=>o.next).filter(Boolean).sort();
    next=L.map(o=>o.d.short).join(', ')+(ds.length?' — desde '+fmtMY(ds[0]):'');
  } else if(now.length){
    const N=gen(now), ds=N.map(o=>o.next).filter(Boolean).sort();
    next='A fazer: '+N.map(o=>o.d.short).join(', ')+(ds.length?' — até '+fmtMY(ds[0]):'');
  }
  return {st,next,items};
}

/* ---- separador Rastreios na ficha ---- */
function rasRec(p,id){ p.ras.rec=p.ras.rec||{}; return (p.ras.rec[id]=p.ras.rec[id]||{}); }
function rasImpLabel(r){ return (r.imp.v==='ok'?'Em dia':'Em atraso')+' (importado)'; }
function rasBlock(p,o){
  const d=o.d, r=o.r, id=d.id, on=o.active;

  const nxBox = nxEdit

  const dt=(lb,withNext)=>`<div class="field"><label>${lb||'Data da última realização'}</label><input type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" class="din" data-rasd="${id}"${o.imp?' data-impmark="1" style="width:240px;color:var(--ink3);background:#f3f3f1;font-style:italic"':''} value="${o.imp?esc(rasImpLabel(r)):ptForInput(r.date)}">${withNext?`<label style="width:auto;margin-left:14px">Próxima realização</label>${nxBox}`:''}</div>`;
  const cards=(field,arr,cur)=>`<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">${arr.map(([v,l])=>`<label style="display:flex;gap:8px;align-items:flex-start;width:auto;padding:7px 10px;border:1px solid ${cur===v?'var(--ras)':'var(--line)'};border-radius:8px;cursor:pointer;font:400 12.5px/1.35 var(--sans);color:var(--ink);background:${cur===v?'#EBF6F4':'#fff'}"><input type="radio" name="${id}-${field}" data-rasf="${id}:${field}" value="${v}" ${cur===v?'checked':''} style="margin-top:2px;accent-color:var(--ras);flex:0 0 auto"><span>${esc(l)}</span></label>`).join('')}${cur?`<button type="button" class="btn sm" data-rasclr="${id}:${field}" style="align-self:flex-start">Limpar escolha</button>`:''}</div>`;
  const exclRow=`<label title="${esc(d.tip)}" style="display:flex;gap:6px;align-items:center;font:500 12.5px var(--sans);text-transform:none;letter-spacing:0;cursor:pointer;width:auto"><input type="checkbox" class="chk" data-rasx="${id}" ${r.excl?'checked':''}> Excluir utente do rastreio</label>`;
  const pill = !on ? `<span class="pill future">inativo</span>` : o.imp ? `<span class="pill future">${rasImpLabel(r).toLowerCase()}</span>` : statusPill(o.st);
  let body='';
  if(r.excl){
    body=`<div class="note">Utente não elegível</div>`;
  } else {
    if(id==='rccu'){
      body=`<div class="field"><label>Resultado</label>${sel('res',[['neg','HPV negativo'],['hpv','HPV HR não 16/18 positivo'],['outro','Outro']],r.res)}</div>${dt('',true)}`;
    } else if(id==='rcm'){
      body=dt('',true);
    } else if(id==='rccr'){
      const alto=!!r.alto;
      body=`<label title="AF 1º grau <50 anos, 2 familiares 1º grau" style="display:flex;gap:6px;align-items:center;cursor:pointer;width:auto;margin:2px 0"><input type="checkbox" class="chk" data-rasalto="${id}" ${alto?'checked':''}> Alto risco</label>
        <span class="mobhint">AF 1º grau &lt;50 anos, 2 familiares 1º grau</span>
        <div class="field"><label>Exame</label>${alto
          ? `<select data-rasf="${id}:tipo" style="flex:1"><option value="colo" selected>Colonoscopia</option></select>`
          : sel('tipo',[['psof','PSOF'],['colo','Colonoscopia']],r.tipo)}</div>
        ${(alto||r.tipo==='colo')?`<div class="field" style="align-items:flex-start"><label>Resultado</label>${cards('res2',[
          ['prep','Preparação inadequada'],
          ['normal','Sem alterações, pólipos hiperplásicos <10mm, 1-4 adenomas <10mm com displasia baixo grau, ou pólipo serreado <10mm sem displasia'],
          ['adenomas','5-10 adenomas <10mm com displasia baixo grau, 1 ou mais adenomas >10mm com displasia baixo grau, 1 ou mais adenomas com displasia de alto grau, pólipo serreado >10mm sem displasia, pólipo serreado com displasia, ou adenoma serreado tradicional'],
          ['fragm','Pólipo fragmentado >20mm'],['neo','Neoplasia']],r.res2)}</div>`:''}
        ${dt('',true)}`;
    } else if(id==='rcp'){
      body=`<div class="field"><label>Último PSA</label>${sel('psa',[['lt1','<1'],['p13','1-3'],['p310','3-10'],['gt10','>10']],r.psa)}
        ${r.psa==='p310'?sel('sub',[['gt','PSA L/T >0.25'],['le','PSA L/T ≤0.25']],r.sub):''}</div>${dt('',true)}`;
    } else if(id==='osteo'){
      body=`<div class="field"><button class="btn sm" data-frax="1" type="button">Calcular o risco de fratura (FRAX)</button></div>${dt('Data de realização')}`;

  }
  return `<fieldset${on?'':' disabled'} style="border:0;padding:0;margin:0;min-width:0;${on?'':'opacity:.55'}"><div class="block">
    <h4 style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>${esc(d.lb)}</span><span style="display:flex;gap:10px;align-items:center">${exclRow}${pill}</span></h4>
    <span class="mobhint">${esc(d.tip)}</span>
    ${on?'':'<div class="hint">Fora da faixa etária deste rastreio — apenas para consulta.</div>'}
    ${body}</div></fieldset>`;
}
function tabRas(p){
  if(ageYears(p.dob)==null || (p.sexo!=='F' && p.sexo!=='M'))
    return `<div class="empty"><b>Faltam dados</b>Preenche o sexo e a data de nascimento na Ficha para calcular os rastreios.</div>`;
  const inact=!p.prog.ras;
  const items=rasList(p).map(i=>rasEval(p,i));
  return `<fieldset${inact?' disabled':''} style="border:0;padding:0;margin:0;min-width:0;${inact?'opacity:.55;filter:grayscale(.6)':''}">
    <div class="meta" style="margin-bottom:8px">Idade ${fmtAge(p.dob)} · ${p.sexo==='F'?'sexo feminino':'sexo masculino'}${inact?' · <b>programa inativo</b>':''}</div>
    ${inact?`<div class="note">Este utente já não reúne as condições do programa Rastreios. A informação registada mantém-se para consulta, mas não pode ser alterada.</div>`:''}
    <div class="block"><label style="display:flex;gap:8px;align-items:center;cursor:pointer;width:auto;margin:10px 14px 4px"><input type="checkbox" class="chk" data-rasfum="1" ${p.ras.fumador?'checked':''}> Fumador (ou ex-fumador)</label>
      <div class="hint">Ao assinalar, surgem os rastreios da cavidade oral, do pulmão e do aneurisma da aorta, consoante a idade e o sexo.</div></div>
    ${items.length? items.map(o=>rasBlock(p,o)).join('') : `<div class="empty"><b>Sem rastreios ativos</b>Os rastreios surgem aqui quando o utente atingir a idade de cada um.</div>`}
    <div class="block"><h4>Notas</h4><div class="field"><textarea data-obs="ras">${esc(p.ras.obs||'')}</textarea></div></div></fieldset>`;
}
function wireRas(p){
  const q=s=>document.querySelectorAll('#dBody '+s);
  const upd=()=>{ markDirty(); renderDrawer(); };
  q('[data-rasfum]').forEach(c=>c.onchange=()=>{ p.ras.fumador=c.checked; upd(); });
  q('[data-rasx]').forEach(c=>c.onchange=()=>{ rasRec(p,c.dataset.rasx).excl=c.checked; upd(); });
  q('[data-rasalto]').forEach(c=>c.onchange=()=>{
    const r=rasRec(p,c.dataset.rasalto); r.alto=c.checked;
    if(c.checked){ if(r.tipo==='psof'){ r.psof={date:r.date}; r.date=''; r.tipo=''; r.res2=''; } }
    else if(r.psof && !r.tipo && !r.date){ r.tipo='psof'; r.date=r.psof.date||''; delete r.psof; }
    upd(); });
  q('[data-rasf]').forEach(s=>s.onchange=()=>{
    const [id,f]=s.dataset.rasf.split(':'), r=rasRec(p,id); r[f]=s.value;
    if(f==='tipo' && s.value!=='colo') r.res2='';
    if(f==='psa' && s.value!=='p310') r.sub='';
    upd(); });
  q('[data-impmark]').forEach(el=>el.onfocus=()=>el.select());
  q('[data-rasd]').forEach(el=>el.onchange=()=>{ const r=rasRec(p,el.dataset.rasd);
    if(r.imp && !r.date){ const v=el.value.trim();
      if(v===rasImpLabel(r)) return;
      if(v===''){ if(r.imp.old) r.date=r.imp.old; delete r.imp; upd(); return; } }
    commitDin(el, r.date, iso=>{
      if(iso && iso>todayISO()){ el.classList.add('err'); toast('Data posterior à data atual — não aceite'); el.value=ptForInput(r.date); return; }
      r.date=iso; if(r.imp) delete r.imp; upd(); });
    if(r.imp && !r.date) renderDrawer(); });
  q('[data-rasc]').forEach(el=>el.onchange=()=>{ const id=el.dataset.rasc, r=rasRec(p,id);
    commitDin(el, r.custom, iso=>{
      const auto=rasEval(p,{d:RAS_DEFS.find(x=>x.id===id),active:true}).auto;
      r.custom = (iso && iso!==auto) ? iso : ''; upd(); }); });
  q('[data-rasclr]').forEach(b=>b.onclick=()=>{ const [id,f]=b.dataset.rasclr.split(':'); rasRec(p,id)[f]=''; upd(); });
  q('[data-frax]').forEach(b=>b.onclick=()=>{ window.open(RAS_FRAX,'_blank','noopener');
    const r=rasRec(p,'osteo'); if(!r.date){ r.date=todayISO(); upd(); } });
}
function rasPromptModal(p){
  const html=`<p>Este utente não reúne as condições habituais para rastreios. Em quais dos seguintes rastreios pretende incluir o utente atualmente? (os restantes serão automaticamente abertos quando o utente reúna as suas condições)</p>`+
    RAS_DEFS.map(d=>`<label style="display:flex;gap:8px;align-items:center;margin:5px 0;width:auto"><input type="checkbox" class="chk" data-rasp="${d.id}"> ${esc(d.lb)}${d.smoker?' <span class="meta">(fumador)</span>':''}</label>`).join('');
  openModal('Rastreios', html, [
    {lb:'Cancelar', fn:()=>{ p.ras.manual=false; p.prog.ras=false; markDirty(); ui.tab='ficha'; renderDrawer(); }},
    {lb:'Confirmar', pri:true, fn:()=>{
      const sel={}; document.querySelectorAll('#sheet [data-rasp]:checked').forEach(c=>{ sel[c.dataset.rasp]=true; });
      p.ras.sel=Object.assign(p.ras.sel||{}, sel);
      if(RAS_DEFS.some(d=>d.smoker && sel[d.id])) p.ras.fumador=true;
      p.ras.prompted=true; markDirty(); renderDrawer(); }}]);
}

function progStatus(p,prog){
  if(prog==='ras') return rasStatus(p);
  let items=[];
  if(prog==='si') items=siItems(p);
  if(prog==='sm'){ if(!p.sm.dum) return {st:'now',next:'Registar DUM'}; items=smItems(p); }
  if(prog==='dm') items=dmItems(p);
  if(prog==='hta') items=htaItems(p);
  if(prog==='dpoc'||prog==='asma') items=respItems(p,prog);
  if(prog==='obesidade') items=obesItems(p);
  if(prog==='dom') items=domItems(p);
  let st='ok', next='';
  items.forEach(i=>{ if(RANK[i.st]>RANK[st]) st=i.st; });
  const late = items.find(i=>i.st==='late'), now = items.find(i=>i.st==='now');
  next = late? late.lb : (now? now.lb : 'Em dia');
  if(prog==='si'){ const pn=items.find(i=>i.key==='pnv'&&i.st==='late');
    if(pn){ const lc=items.find(i=>i.kind==='cons'&&i.st==='late'); next = lc ? lc.lb+' + atualizar PNV' : 'Atualizar PNV'; } }
  if(st==='future'||st==='na') { st='ok'; next='Em dia'; }
  return {st,next,items};
}

/* =======================================================================
   Armazenamento — dois modos, por ordem de preferência
   1. ficheiro   : grava direto num .json do seu computador/drive (Chrome/Edge, ficheiro local)
   2. computador : base de dados do navegador (IndexedDB), fica só nesta máquina
   ======================================================================= */
const DBN='mgf-vigilancia';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DBN,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{
  const q=db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); return await new Promise((res,rej)=>{
  const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k); q.onsuccess=()=>res(1); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }

const Mem={ mode:'none', handle:null, pending:null, name:'', lastSaved:null };
const MEM_LB={ file:'ficheiro', idb:'este computador', pending:'a confirmar', none:'sem memória' };
const canPick = ()=> typeof window.showSaveFilePicker==='function';
const BK = KEY+':autobackup';

/* Determina só o MODO (não lê nem grava nada). Se existir um ficheiro ligado
   de uma sessão anterior mas o navegador já não tiver autorização de escrita
   (o normal depois de fechar o navegador — é uma medida de segurança do
   próprio browser, não um erro nosso), fica em 'pending': nunca cai
   silenciosamente para outro tipo de memória sem avisar, porque isso é
   exatamente o que apagava o trabalho — o programa escrevia por cima do
   ficheiro certo com um estado vazio, sem se dar conta. */
async function memInit(){
  const h = await idbGet('fileHandle');
  if(h && h.queryPermission){
    try{
      const perm = await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){ Mem.handle=h; Mem.mode='file'; Mem.name=h.name; return; }
      Mem.pending=h; Mem.name=h.name; Mem.mode='pending'; return;
    }catch(e){ /* segue para o modo de reserva */ }
  }
  if(window.indexedDB && location.protocol==='file:') Mem.mode='idb';
  else if(window.indexedDB) Mem.mode='idb';
  else Mem.mode='none';
}
async function memRead(){
  if(Mem.mode==='file'){ try{ const f=await Mem.handle.getFile(); const t=await f.text(); return t?JSON.parse(t):null; }catch(e){ return null; } }
  if(Mem.mode==='idb'){ const v=await idbGet(KEY); return v?JSON.parse(v):null; }
  return null;
}
async function memWrite(txt){
  if(Mem.mode==='file'){ const w=await Mem.handle.createWritable(); await w.write(txt); await w.close();
    idbSet(KEY,txt); return; }
  if(Mem.mode==='idb'){ await idbSet(KEY,txt); return; }
  throw new Error('sem memória');
}

let saveTimer=null, dirty=false;
function markDirty(){ if(DEMO.on){ setSave('demonstração · nada é guardado',true); return; } dirty=true; setSave('a guardar…',true); clearTimeout(saveTimer); saveTimer=setTimeout(save,600); }
function setSave(t,warn){ document.getElementById('savetxt').textContent=t;
  document.getElementById('savedot').className='dot'+(warn?' warn':''); }
function hhmm(d){ return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }
function savedLabel(){ const t=Mem.lastSaved?hhmm(Mem.lastSaved)+' · ':'';
  return 'guardado '+t+(Mem.mode==='file'?Mem.name:MEM_LB[Mem.mode]); }
async function save(){
  if(DEMO.on){ dirty=false; setSave('demonstração · nada é guardado',true); return; }
  if(Mem.mode==='none'){ setSave('sem memória — exporta uma cópia',true); return; }
  if(Mem.mode==='pending'){ setSave('ligação por confirmar',true); return; }
  try{
    const txt=JSON.stringify(S);
    await memWrite(txt);
    idbSet(BK, JSON.stringify({t:Date.now(), s:txt})).catch(()=>{});   // rede de segurança silenciosa
    dirty=false; Mem.lastSaved=new Date(); setSave(savedLabel());
  }catch(e){ setSave('erro ao guardar',true); }
}
async function finishLoad(){
  if(Mem.mode==='idb' && navigator.storage && navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
  const d = await memRead();
  applyLoadedData(d);
  setSave(Mem.mode==='none'?'sem memória':savedLabel(), Mem.mode==='none');
  render();
}

/* Ecrã de confirmação obrigatório quando há um ficheiro ligado de uma sessão
   anterior mas ainda sem autorização — nunca se avança silenciosamente para
   outro tipo de memória enquanto isto não for resolvido pelo utilizador. */
function renderGate(){
  const el=document.createElement('div');
  el.id='gate';
  el.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:50;display:grid;place-items:center;padding:24px';
  el.innerHTML=`<div style="max-width:460px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12)">
    <div style="font-size:16px;font-weight:650;margin-bottom:8px">Ligação ao ficheiro por confirmar</div>
    <p style="color:var(--ink3);margin:0 0 20px;line-height:1.5">Este programa estava ligado a <b>${esc(Mem.name)}</b>. Por segurança, o navegador pede sempre esta confirmação depois de reabrir — sem ela, não se arrisca a escrever no ficheiro errado.</p>
    <button class="btn pri" id="gateOk" style="width:100%;margin-bottom:9px;padding:11px">Confirmar e continuar em ${esc(Mem.name)}</button>
    <button class="btn" id="gateSkip" style="width:100%;padding:11px">Abrir sem ligar a este ficheiro</button>
  </div>`;
  document.body.appendChild(el);
  document.getElementById('gateOk').onclick=async()=>{
    try{
      const perm=await Mem.pending.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){ toast('Autorização recusada'); return; }
      Mem.handle=Mem.pending; Mem.mode='file'; Mem.name=Mem.pending.name; Mem.pending=null;
      await idbSet('fileHandle', Mem.handle);
      el.remove(); await finishLoad();
    }catch(e){ toast('Não foi possível confirmar'); }
  };
  document.getElementById('gateSkip').onclick=async()=>{
    if(window.indexedDB && location.protocol==='file:') Mem.mode='idb';
    else if(window.indexedDB) Mem.mode='idb';
    else Mem.mode='none';
    el.remove(); await finishLoad();
  };
}

/* ligar a um ficheiro do computador — verifica sempre se já tem dados antes
   de escrever nele, para nunca substituir um ficheiro com trabalho por engano */
async function linkFile(){
  if(!canPick()) return toast('Este navegador não grava direto em ficheiro. Usa o Chrome ou o Edge, no computador.');
  try{
    const h=await window.showSaveFilePicker({ suggestedName:'vigilancia-dados.json',
      types:[{description:'Dados de vigilância',accept:{'application/json':['.json']}}] });
    let existing=null;
    try{ const f=await h.getFile(); const t=await f.text();
      if(t && t.trim()){ const parsed=JSON.parse(t); if(parsed && Array.isArray(parsed.patients)) existing=parsed; } }catch(e){}
    if(existing && existing.patients.length){
      openModal('Este ficheiro já tem dados',
        `<p>O ficheiro <b>${esc(h.name)}</b> já contém ${existing.patients.length} utente(s) guardados.</p><p>O que queres fazer?</p>`,
        [{lb:'Cancelar'},
         {lb:'Substituir pelo que está no ecrã', fn:async()=>{
            Mem.handle=h; Mem.mode='file'; Mem.name=h.name; Mem.pending=null;
            await idbSet('fileHandle',h); await save(); render(); toast('Ficheiro ligado e substituído');
         }},
         {lb:'Carregar os dados do ficheiro', pri:true, fn:async()=>{
            Mem.handle=h; Mem.mode='file'; Mem.name=h.name; Mem.pending=null;
            await idbSet('fileHandle',h);
            applyLoadedData(existing);
            markDirty(); render(); toast('Dados do ficheiro carregados');
         }}]);
      return;
    }
    Mem.handle=h; Mem.mode='file'; Mem.name=h.name; Mem.pending=null;
    await idbSet('fileHandle',h);
    await save(); render(); toast('Ligado a '+h.name+' — grava automaticamente');
  }catch(e){}
}
async function openExisting(){
  if(!canPick()) return toast('Este navegador não abre ficheiros deste modo. Usa o Chrome ou o Edge.');
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:'Dados de vigilância',accept:{'application/json':['.json']}}]});
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return toast('Sem permissão de escrita no ficheiro');
    Mem.handle=h; Mem.mode='file'; Mem.name=h.name; Mem.pending=null;
    await idbSet('fileHandle',h);
    applyLoadedData(await memRead());
    Mem.lastSaved=new Date(); setSave(savedLabel()); render(); toast('A trabalhar sobre '+h.name);
  }catch(e){}
}
async function reauthFile(){
  if(!Mem.pending) return;
  try{ const perm=await Mem.pending.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return toast('Autorização recusada');
    Mem.handle=Mem.pending; Mem.mode='file'; Mem.name=Mem.pending.name; Mem.pending=null;
    applyLoadedData(await memRead());
    Mem.lastSaved=new Date(); setSave(savedLabel()); render(); toast('Ficheiro reautorizado');
  }catch(e){}
}
async function unlinkFile(){
  Mem.handle=null; Mem.pending=null; Mem.name='';
  await idbSet('fileHandle',null);
  await memInit();
  if(Mem.mode==='idb' && navigator.storage && navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
  await save(); render(); toast('Ficheiro desligado');
}
async function recoverBackup(){
  let raw; try{ raw=await idbGet(BK); }catch(e){ raw=null; }
  if(!raw) return toast('Sem cópia de segurança automática disponível neste navegador');
  let obj, data;
  try{ obj=JSON.parse(raw); data=JSON.parse(obj.s); }catch(e){ return toast('Cópia de segurança inválida'); }
  const when=new Date(obj.t).toLocaleString('pt-PT');
  openModal('Recuperar cópia de segurança automática',
    `<p>Encontrei uma cópia automática guardada neste navegador, de <b>${esc(when)}</b>, com ${data.patients?data.patients.length:0} utente(s).</p>
     <p>Isto substitui os dados atualmente no ecrã.</p>`,
    [{lb:'Cancelar'},{lb:'Recuperar',pri:true,fn:()=>{
      applyLoadedData(data);
      markDirty(); render(); toast('Cópia recuperada — confere e volta a ligar o ficheiro em Definições');
    }}]);
}

   limpam-se sozinhas — corre a cada desenho do ecrã, é barato e mantém tudo
   correto mesmo que o programa fique aberto vários dias seguidos. */
function sweepMarcadas(){
  const t=todayISO(); let changed=false;
  S.patients.forEach(p=>{ ['si','sm','dm','hta','dpoc','asma','obesidade','dom','ras'].forEach(k=>{
    const m=p[k] && p[k].marcada;
    if(m && m.date && m.date < t){ p[k].marcada={date:''}; changed=true; }

function viewPainel(){

    return `<div class="card click" data-go="${k}">

      <div class="big">${l.length}</div>

      <div>a fazer<b style="color:var(--now)">${now}</b></div>
      <div>em dia<b style="color:var(--ok)">${l.length-late-now}</b></div>${k==='si'?`<div>falha id. chave<b style="color:var(--falha)">${falha}</b></div>`:''}</div></div>`;
  }).join('');

   : `<div class="empty"><b>Nada em atraso</b>Assim que importares ou criares utentes, as pendências aparecem aqui.</div>`}`;

function filterList(list){
  const q=ui.q.trim().toLowerCase();
  if(!q) return list;
  const sa=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');   /* nome sem acentos */
  const qa=sa(q);
  return list.filter(p=>sa(p.nome).includes(qa) || (p.sns||'').toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q) || (!!p.agregado && String(p.agregado).toLowerCase()===q) || (q.replace(/\D/g,'').length>=3 && (p.telefone||'').replace(/\D/g,'').includes(q.replace(/\D/g,''))));
}
/* Ordenação das tabelas gerais. 'idade' usa meses de vida, exceto em Saúde
   Materna, onde usa a idade gestacional em dias — quem não tem idade
   calculável (sem data de nascimento, ou sem DUM em SM) vai sempre para o
   fim, seja qual for a direção escolhida. */
function sortList(list, k, mode){
  const byName=(a,b)=>a.p.nome.localeCompare(b.p.nome,'pt');
  const ageOf=(p)=> k==='sm' ? igDias(p.sm) : ageMonths(p.dob);
  const out=list.slice();
  if(mode==='nome'){ out.sort(byName); return out; }
  if(mode==='anos_asc'||mode==='anos_desc'){
    const dir = mode==='anos_asc' ? 1 : -1;
    out.sort((a,b)=>{ const av=ageMonths(a.p.dob), bv=ageMonths(b.p.dob);
      if(av==null && bv==null) return byName(a,b); if(av==null) return 1; if(bv==null) return -1;
      return dir*(av-bv) || byName(a,b); });
    return out;
  }
  if(mode==='idade_asc'||mode==='idade_desc'){
    const dir = mode==='idade_asc' ? 1 : -1;
    out.sort((a,b)=>{
      const av=ageOf(a.p), bv=ageOf(b.p);
      if(av==null && bv==null) return byName(a,b);
      if(av==null) return 1;
      if(bv==null) return -1;
      return dir*(av-bv) || byName(a,b);
    });
    return out;
  }
  out.sort((a,b)=> RANK[b.s.st]-RANK[a.s.st] || byName(a,b));
  return out;
}

function viewProg(k){
  let list = filterList(listOf(k)).map(p=>({p,s:progStatus(p,k)}));
  if(ui.filter!=='todos') list=list.filter(x=>x.s.st===ui.filter);
  list = sortList(list, k, ui.sort);
  const extra = (k==='si'||k==='ras') ? 'Idade' : k==='sm' ? 'Idade gestacional' : k==='dm' ? 'Última HbA1c' : (k==='dpoc'||k==='asma') ? 'Última espirometria' : k==='obesidade' ? 'Última análise' : k==='dom' ? 'Última visita' : 'Última TA';
  const cell = (p)=>{
    if(k==='si'||k==='ras') return `<span class="age">${fmtAge(p.dob)}</span>`;
    if(k==='sm'){ const d=igDias(p.sm); return p.sm.parto? `<span class="meta">pós-parto</span>` : `<span class="ig">${fmtIG(d)}</span>`; }
    if(k==='dm'){ const a=p.dm.ultimoA1c||{}; return a.valor?`<span class="meta">${esc(a.valor)}% · ${fmtPT(a.data)}</span>`:'<span class="meta">—</span>'; }
    if(k==='dpoc'||k==='asma'){ const e=p[k].espiro||{}; return e.date?`<span class="meta">${fmtPT(e.date)}</span>`:'<span class="meta">—</span>'; }
    if(k==='obesidade'){ const l=p.obesidade.lab||{}; return l.date?`<span class="meta">${fmtPT(l.date)}</span>`:'<span class="meta">—</span>'; }
    if(k==='dom'){ const v=p.dom.visita||{}; return v.date?`<span class="meta">${fmtPT(v.date)} · ${esc(DOM_PERIODOS_LB[p.dom.periodicidade]||'')}</span>`:'<span class="meta">—</span>'; }
    const t=p.hta.ta||{}; return t.sis?`<span class="meta">${esc(t.sis)}/${esc(t.dia)} · ${fmtPT(t.data)}</span>`:'<span class="meta">—</span>';
  };
  const mkCell = (p)=>`<td onclick="event.stopPropagation()"><input type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" class="din" style="width:104px" data-mk="${k}:${p.id}" value="${ptForInput((p[k].marcada||{}).date)}"></td>`;
  const comIdade = !(k==='si'||k==='ras');   /* em SI e Rastreios a idade já é a coluna própria */
  const rows=list.map(({p,s})=>`<tr data-open="${p.id}" data-tab="${k}">
      <td><div class="nm">${esc(p.nome)}</div><div class="meta">${contactosTxt(p)}</div></td>
      ${comIdade?`<td><span class="age">${idadeLista(k,p)}</span></td>`:''}<td>${cell(p)}</td><td>${esc(s.next)}</td><td>${statusPill(s.st)}</td>
      ${mkCell(p)}
      <td style="text-align:right">${tags(p)}</td></tr>`).join('');
  const segs=['todos','late','now','ok'].map(f=>`<button data-f="${f}" class="${ui.filter===f?'on':''}">${
    f==='todos'?'Todos':f==='late'?'Em atraso':f==='now'?'A fazer':'Em dia'}</button>`).join('');

  const canGroup = k==='si'||k==='sm';
  if(k==='ras' && ui.group) return viewRasComb();
  const modeSeg = (canGroup||k==='ras') ? `<div class="seg">
      <button data-mode="lista" class="${!ui.group?'on':''}">Lista</button>
      <button data-mode="grupo" class="${ui.group?'on':''}">${k==='si'?'Por idade':k==='sm'?'Por trimestre':'Combinar rastreios'}</button>
    </div>` : '';
  const isTable = !(canGroup && ui.group);
  const idadeLb = k==='sm' ? 'Idade gestacional' : 'Idade';
  const sortSel = isTable ? `<select class="btn" data-sort style="padding:6px 26px 6px 11px">
      <option value="prioridade"${ui.sort==='prioridade'?' selected':''}>Ordenar: Prioridade</option>
      <option value="nome"${ui.sort==='nome'?' selected':''}>Ordenar: Nome (A–Z)</option>
      <option value="idade_asc"${ui.sort==='idade_asc'?' selected':''}>Ordenar: ${idadeLb} crescente</option>
      <option value="idade_desc"${ui.sort==='idade_desc'?' selected':''}>Ordenar: ${idadeLb} decrescente</option>${k==='sm'?`
      <option value="anos_asc"${ui.sort==='anos_asc'?' selected':''}>Ordenar: Idade crescente</option>
      <option value="anos_desc"${ui.sort==='anos_desc'?' selected':''}>Ordenar: Idade decrescente</option>`:''}
    </select>` : '';

  const body = (canGroup && ui.group)
    ? (k==='si' ? renderGroupSI(list) : renderGroupSM(list))
    : (list.length? `<table><thead><tr><th>Utente</th>${comIdade?'<th>Idade</th>':''}<th>${extra}</th><th>Próximo passo</th><th>Estado</th><th>Consulta marcada</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
       : `<div class="empty"><b>Sem utentes aqui</b>Importa a tua lista em Utentes ou associa utentes a este programa.</div>`);

  return `<h1>${PROGS[k].lb}</h1><p class="sub">${listOf(k).length} utentes neste programa</p>
   <div class="toolbar"><div class="seg">${segs}</div>${modeSeg}${sortSel}<div class="grow"></div>

/* -------- agrupar Saúde Infantil por idade -------- */
function siAgeBucket(p){
  const m=ageMonths(p.dob); if(m==null) return null;
  return SI_AGE_BANDS.find(c=>m>=c.from && m<=c.to) || null;
}
function groupSIBuckets(list){
  const buckets = SI_AGE_BANDS.map(c=>({title:c.lb, items:[]}));
  const outros=[];
  list.forEach(x=>{ const b=siAgeBucket(x.p); const slot=b&&buckets.find(bb=>bb.title===b.lb);
    if(slot) slot.items.push(x); else outros.push(x); });
  const used = buckets.filter(b=>b.items.length);
  if(outros.length) used.push({title:'Fora do intervalo (18 anos ou mais)', items:outros});
  return used;
}
function renderGroupSI(list){
  const groups = groupSIBuckets(list);
  if(!groups.length) return `<div class="empty"><b>Sem utentes para agrupar</b></div>`;
  const summary = groups.map(g=>`<div class="card"><div class="ttl" style="margin-bottom:2px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)">${esc(g.title)}</div><div class="big">${g.items.length}</div></div>`).join('');
  const blocks = groups.map(g=>groupBlock(g.title, g.items,'si')).join('');
  return `<div class="cards" style="margin-bottom:20px">${summary}</div>${blocks}`;
}

/* -------- agrupar Saúde Materna por trimestre -------- */
function smBucket(p){
  if(p.sm.parto) return 'pp';
  const d=igDias(p.sm); if(d==null) return 'nd';
  const w=Math.floor(d/7); if(w<0) return 'nd';
  if(w<=13) return 't1'; if(w<=27) return 't2'; return 't3';
}
const SM_BUCKET_LB={t1:'1º trimestre (até 13 semanas)',t2:'2º trimestre (14–27 semanas)',t3:'3º trimestre (28 semanas ou mais)',pp:'Pós-parto',nd:'Sem DUM registada'};
function groupSMBuckets(list){
  const order=['t1','t2','t3','pp','nd'];
  const groups={t1:[],t2:[],t3:[],pp:[],nd:[]};
  list.forEach(x=>groups[smBucket(x.p)].push(x));
  return order.filter(k=>groups[k].length).map(k=>({title:SM_BUCKET_LB[k], items:groups[k]}));
}
function renderGroupSM(list){
  const groups = groupSMBuckets(list);
  if(!groups.length) return `<div class="empty"><b>Sem utentes para agrupar</b></div>`;
  const summary = groups.map(g=>`<div class="card"><div class="ttl" style="margin-bottom:2px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)">${esc(g.title)}</div><div class="big">${g.items.length}</div></div>`).join('');
  const blocks = groups.map(g=>groupBlock(g.title, g.items,'sm')).join('');
  return `<div class="cards" style="margin-bottom:20px">${summary}</div>${blocks}`;
}

function groupBlock(title, items, k){
  const sub = k==='si'
    ? (x)=>fmtAge(x.p.dob)
    : (x)=>{ const d=igDias(x.p.sm); return [idadeLista('sm',x.p), x.p.sm.parto?'pós-parto':fmtIG(d)].filter(Boolean).join(' · '); };
  return `<div class="block"><h4 style="display:flex;justify-content:space-between;align-items:center">
      <span>${esc(title)}</span><span class="chip">${items.length}</span></h4>
    ${items.map(x=>`<div class="item iclick" data-open="${x.p.id}" data-tab="${k}">
        <div class="txt"><b>${esc(x.p.nome)}</b><span>${esc(sub(x))} · ${esc(x.s.next)}</span></div>
        ${statusPill(x.s.st)}</div>`).join('')}
  </div>`;
}

/* Interseção de datas de consulta comuns entre os programas selecionados —
   só entre os que têm estrutura de "cons" (todos exceto Domicílios). */
function consultasComuns(p, progs){
  const comCons = progs.filter(k=>p[k] && p[k].cons);
  if(comCons.length<2) return [];
  const listas = comCons.map(k=>Object.values(p[k].cons).filter(c=>c.done).map(c=>c.date));
  return listas.reduce((acc,cur)=>acc.filter(d=>cur.includes(d)));
}
