/* ---------------- 9. demonstração: ficha do BI fictícia ---------------- */
function demoBiGerar(lista, hoje){
  const R=demoRng(20261125), sim=pr=>R()<pr, um=a=>a[Math.floor(R()*a.length)], entre=(a,b)=>a+Math.floor(R()*(b-a+1));
  const FREG=[['111512',3],['111513',4],['111514',5],['111515',4],['111516',5],['111517',4],['111133',1],['110608',1]];
  const pesoF=FREG.reduce((s,f)=>s+f[1],0), fr=()=>{ let x=R()*pesoF; for(const [c,w] of FREG){ x-=w; if(x<=0) return c; } return FREG[0][0]; };
  const NAC=[['PT',82],['BR',6],['CV',4],['AO',2],['GW',2],['ST',1],['UA',1],['IN',1],['NP',1]];
  const pesoN=NAC.reduce((s,f)=>s+f[1],0), nac=()=>{ let x=R()*pesoN; for(const [c,w] of NAC){ x-=w; if(x<=0) return c; } return 'PT'; };
  const DENS={'111512':7200,'111513':12800,'111514':10900,'111515':9600,'111516':5300,'111517':6400,'111133':2100,'110608':8900};
  const CP={'111512':'2610','111513':'2700','111514':'2650','111515':'2700','111516':'2700','111517':'2700','111133':'2745','110608':'1500'};
  const RUAS=['Rua das Flores','Avenida da Liberdade','Rua do Comércio','Travessa da Escola','Rua da Fonte','Praceta do Sol','Rua Nova','Largo da Igreja'];
  /* agregados: grupos de 1 a 5 pessoas da lista, por ordem; algumas pessoas do agregado não estão nesta lista */
  const apelido=p=>p.nome.split(' ').pop();
  const pool=lista.slice().sort((a,b)=>apelido(a).localeCompare(apelido(b),'pt') || a.nome.localeCompare(b.nome,'pt')); let cod=500100;
  while(pool.length){ const tam=Math.min(pool.length, um([1,1,1,2,2,2,2,3,3,4,5])); const membros=pool.splice(0, tam);
    const fora=sim(.25)? entre(1,2) : 0, n=membros.length+fora, freg=fr(), na=nac(), morada=um(RUAS)+', '+entre(1,180), cp=CP[freg]+'-'+String(entre(1,999)).padStart(3,'0');
    const famNao=sim(.05); cod+=entre(3,41);
    membros.forEach(p=>{ const a=ageYears(p.dob)||0, cr=nCron(p), idoso=a>=65;
      const base=(a<2?6:a<6?3:a<18?1.2:1.5)+cr*1.8+(idoso?1.5:0), naoUt=famNao||sim(a>=18&&a<65&&!cr?.18:.04);
      const med12=naoUt?0:Math.max(0,Math.round(base+(R()-.4)*3)), enf12=naoUt?0:Math.max(0,Math.round((a<2?7:cr?2.5:.8)+(R()-.4)*3));
      const med36=med12+Math.max(0,Math.round(base*2*R())), enf36=enf12+Math.max(0,Math.round(enf12*1.5*R()));
      const ultMed=med12? addDays(hoje,-entre(3,360)) : med36? addDays(hoje,-entre(370,1090)) : (sim(.5)? addDays(hoje,-entre(1100,2500)) : '');
      const ultEnf=enf12? addDays(hoje,-entre(3,360)) : enf36? addDays(hoje,-entre(370,1090)) : '';
      const ultCont=[ultMed,ultEnf].filter(Boolean).sort().pop()||'';
      const g=p.sdm.gastos[String(YEAR-1)]||{}, f=.85+R()*.3;
      const urg12=sim(idoso?.35:.2)? (sim(.12)? entre(4,7) : entre(1,3)) : 0, intern=sim(idoso?.08:.02);
      p.agregado=String(cod);
      p.bi={data:hoje, nElemFam:n, up:a<7?1.5:a<65?1:a<75?2:2.5, nac:na==='PT'||sim(.7)?na:'PT', paisRes:'PT', morada, cp, freg, densPop:DENS[freg],
        insufEcon:sim(.12), isencao:sim(a<18||a>=65?.5:.2), recm:idoso&&sim(.3), osecp:false, subsistema:sim(.08), medFam:'66933', enfFam:sim(.07)?'-1':'71'+entre(100,199), uf:'3110800', tipoUF:'USF',
        inscrCspM:Math.min(a*12+entre(0,11), entre(12,400)), inscrMfM:entre(1,180),
        med12, med12min:med12*entre(15,22), med36, med60:med36+entre(0,4), medNP12:Math.round(med12*.25*R()), medDom12:idoso&&cr>=2&&sim(.2)?entre(1,3):0, medPres12:med12, medVig12:Math.round(med12*.5), medUF12:med12, medAg:sim(.25),
        enf12, enf12min:enf12*entre(12,25), enf36, enf60:enf36+entre(0,3), enfNP12:0, enfDom12:idoso&&sim(.15)?entre(1,6):0, enfPres12:enf12, enfVig12:Math.round(enf12*.6), enfUF12:enf12, enfAg:sim(.15),
        out12:sim(.15)?entre(1,4):0, out36:sim(.25)?entre(1,6):0, cont12:med12+enf12+entre(0,3), ultMed, ultEnf, ultCont, diasSemCont:ultCont?daysBetween(ultCont,hoje):null,
        naoUtil:naoUt, famNaoUtil:famNao, urg12, ultUrg:urg12?addDays(hoje,-entre(5,360)):'', consHosp12:cr&&sim(.4)?entre(1,5):0, intern12dias:intern?entre(2,14):0, intern12:intern?Math.round(entre(1800,9000)*100)/100:0,
        mcdtHosp12:sim(.2)?Math.round(entre(20,600)*R()*100)/100:0, medic12:Math.round((g.med||0)*f*100)/100, mcdt12:Math.round((g.mcdt||0)*f*100)/100,
        vacinas12:sim(.4)?entre(1,3):0, sns24_12:sim(.2)?entre(1,3):0, naoUtilSist:naoUt&&sim(.4)};
      if(ultMed && (!p.sdm.ultConsulta || ultMed>p.sdm.ultConsulta)) p.sdm.ultConsulta=ultMed;
    });
  }
}
