/* ---- Histórico e Medicação Crónica (Ficha) ---- */
/* =======================================================================
   MEDICAÇÃO CRÓNICA — reorganização por regras fixas (sem inteligência artificial).
   Formato final: "Nome dose posologia" separados por "; ".
   Posologia: Jejum+Pequeno-almoço+Almoço+Lanche+Jantar+Antes de deitar, ou nº de tomas (1id, 2id, 0.5cp 2id).
   O que não se consegue interpretar com certeza fica exatamente como foi escrito.
   ======================================================================= */
function medNorm(s){ return String(s).toLowerCase().replace(/[áàâãä]/g,'a').replace(/[éèêë]/g,'e').replace(/[íìîï]/g,'i').replace(/[óòôõö]/g,'o').replace(/[úùûü]/g,'u').replace(/ç/g,'c'); }
const MED_U='(?:mg|mcg|ug|µg|g|ui|ml|meq|mmol)';
const MED_N='\\d+(?:[.,]\\d+)?';
const MED_QU='(?:comprimidos?|comp|cp|capsulas?|caps?|gotas?|puffs?|saquetas?|saq|ampolas?|amp)';
const MED_RX=[
  ['grid',     new RegExp(`${MED_N}(?:\\s*\\+\\s*${MED_N}){2,}(?![a-z])`,'y')],
  ['interval', new RegExp(`\\d+\\s*\\/\\s*\\d+\\s*h(?:oras?)?(?![a-z])|\\d+\\s*em\\s*\\d+\\s*h(?:oras?)?(?![a-z])`,'y')],
  ['dose',     new RegExp(`(?:${MED_N}\\s*(?:${MED_U})?\\s*\\/\\s*)*${MED_N}\\s*${MED_U}(?![a-z])(?:\\s*\\/\\s*(?:ml|g|dose|h)(?![a-z]))?`,'y')],
  ['qty',      new RegExp(`(?:${MED_N}\\s*\\/\\s*\\d+|${MED_N}|meio|meia|um|uma|dois|duas|tres|quatro|½|¼)\\s*${MED_QU}(?![a-z])`,'y')],
  ['freq',     new RegExp(`\\d+\\s*(?:x|vezes?)\\s*(?:\\/|por|ao)?\\s*dia(?![a-z])|\\d+\\s*id(?![a-z])|\\d+\\s*\\/\\s*dia(?![a-z])|(?:uma|duas|tres|quatro)\\s+vez(?:es)?\\s+(?:por|ao|\\/)\\s*dia(?![a-z])|\\d+\\s*x(?![a-z])|(?:bid|tid|qid)(?![a-z])|id(?![a-z])`,'y')],
  ['pordia',   new RegExp(`(?:por|ao)\\s+dia(?![a-z])|diari(?:o|amente)(?![a-z])`,'y')],
  ['sos',      new RegExp(`sos(?![a-z])|se\\s+necessario(?![a-z])|s\\s*\\/\\s*n(?![a-z])`,'y')],
  ['meal',     new RegExp(`pequeno[\\s-]*almoco(?![a-z])|peq\\.?\\s*almoco(?![a-z])|manha(?![a-z])|jejum(?![a-z])|almoco(?![a-z])|lanche(?![a-z])|merenda(?![a-z])|deitar(?![a-z])|jantar(?![a-z])|noite(?![a-z])`,'y')],
  ['num',      new RegExp(`${MED_N}`,'y')],
  ['word',     new RegExp(`[a-z][a-z'’-]*\\d*(?:\\s*[+\\/]\\s*[a-z][a-z'’-]*\\d*)*`,'y')]

const MED_STOP=new Set(['ao','a','as','os','o','no','na','nos','nas','de','do','da','dos','das','em','por','com','antes','depois','pela','pelo','apos','cada','para','as','ate']);
const MED_CONJ=new Set(['e','ou']);
const MED_NONDRUG=new Set(['acordar','durante','dias','dia','semanas','semana','meses','mes','mensal','semanal','suspender','manter','aumentar','reduzir','refeicao','refeicoes','prandial','tomar','toma','sempre','habitual','cronica','cronico','medicacao','dose','doses','tomas','vez','vezes','total','uso','via','oral','lp','ap','xr','retard','prolongada','libertacao','modificada','pr','sr','cr','er','flas','flash','odt','caneta','pen','inalador','adesivo','xarope','solucao','suspensao','pomada','creme','spray','nasal','cp','comp','comprimido','comprimidos','capsula','capsulas']);
const MED_NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,meio:.5,meia:.5,'½':.5,'¼':.25};
const MED_MEAL={ 'pequeno':1,'peq':1,'manha':1,'jejum':0,'almoco':2,'lanche':3,'merenda':3,'deitar':5,'jantar':4,'noite':4 };
function medMealIdx(m){ if(/almoco/.test(m)&&/(pequeno|peq)/.test(m)) return 1; for(const k of Object.keys(MED_MEAL)){ if(m.indexOf(k)===0||m===k) return MED_MEAL[k]; } return /manha/.test(m)?1:-1; }
function medQtyVal(str){ const m=str.replace(/\s+/g,'').match(/^(?:(\d+(?:[.,]\d+)?)\/(\d+)|(\d+(?:[.,]\d+)?)|([a-z½¼]+?))(comprimidos?|comp|cp|capsulas?|caps?|gotas?|puffs?|saquetas?|saq|ampolas?|amp)?$/);
  if(!m) return {v:NaN,u:''};
  let v; if(m[1]!=null) v=parseFloat(m[1].replace(',','.'))/parseFloat(m[2]); else if(m[3]!=null) v=parseFloat(m[3].replace(',','.')); else v=MED_NUMW[m[4]];
  const u=m[5]||''; let un='';
  if(/^comp|^cp/.test(u)) un='cp'; else if(/^caps/.test(u)||/^capsula/.test(u)) un='caps'; else if(/^gota/.test(u)) un='gotas'; else if(/^puff/.test(u)) un='puffs'; else if(/^saq/.test(u)) un='saq'; else if(/^amp/.test(u)) un='amp';
  return {v,u:un}; }
function medFmt(v){ return String(+(+v).toFixed(3)); }
function medTokens(orig){
  const n=medNorm(orig), toks=[]; let i=0, ls=true;
  while(i<n.length){
    const c=n[i];
    if(c==='\n'||c===';'){ toks.push({t:'hard',s:i,e:i+1}); i++; ls=true; continue; }
    if(/\s/.test(c)){ i++; continue; }
    if(ls){ const rx=/(?:\d+\s*[.)]\s+|[-•*·]\s*)(?=[a-z])/y; rx.lastIndex=i; const r=rx.exec(n); if(r){ i+=r[0].length; continue; } }
    ls=false;
    let hit=null;
    for(const [t,rx] of MED_RX){ rx.lastIndex=i; const r=rx.exec(n); if(r&&r[0].length){ hit={t,txt:r[0]}; break; } }
    if(hit){
      const tk={t:hit.t,s:i,e:i+hit.txt.length,n:hit.txt,o:orig.slice(i,i+hit.txt.length)};
      if(hit.t==='word'){ if(MED_CONJ.has(tk.n)) tk.t='conj'; else if(MED_STOP.has(tk.n)) tk.t='stop'; }
      toks.push(tk); i=tk.e; continue;
    }
    if(c===','||c==='.'||c===':'||c==='('||c===')'){ toks.push({t:'soft',s:i,e:i+1}); i++; continue; }
    if(c==='+'){ toks.push({t:'plus',s:i,e:i+1}); i++; continue; }
    i++;
  }
  return toks;
}
function medBuild(orig,toks){
  const entries=[]; let cur=null;
  const mk=()=>({name:[],toks:[],has:false,s:null,e:null,flags:[],stops:[],soft:false});
  const flush=()=>{ if(cur&&(cur.name.length||cur.has||cur.flags.length)) entries.push(cur); cur=null; };
  const span=(t)=>{ if(cur.s==null||t.s<cur.s) cur.s=t.s; if(cur.e==null||t.e>cur.e) cur.e=t.e; };
  toks.forEach(t=>{
    if(t.t==='hard'){ flush(); return; }
    if(t.t==='soft'){ if(cur){ cur.toks.push({t:'conj'}); cur.soft=true; } return; }
    if(t.t==='stop'){ if(cur&&!cur.has&&cur.name.length) cur.stops.push(t); return; }
    if(t.t==='conj'){ if(cur&&cur.has) cur.toks.push({t:'conj'}); else if(cur&&cur.name.length) cur.flags.push('duas expressões ligadas por "e"/"ou" sem dose'); return; }
    if(t.t==='plus'){ if(cur&&cur.has) cur.flags.push('sinal "+" entre fármacos com doses separadas'); return; }
    if(t.t==='word'){
      if(cur&&cur.has){ flush(); }
      else if(cur&&cur.soft&&cur.name.length){ flush(); }
      if(!cur) cur=mk();
      cur.stops.forEach(x=>cur.name.push(x)); cur.stops=[];
      cur.name.push(t); cur.soft=false; span(t); return;
    }
    if(!cur) cur=mk();
    cur.has=true; cur.toks.push(t); cur.soft=false; span(t);
  });
  flush();
  return entries;
}
function medCap(c){ return c.trim().split(/\s+/).map((x,i)=>{
  if(x===x.toUpperCase() && /[A-ZÁ-Ú]/.test(x) && x.length<=5) return x;
  const l=x.toLowerCase(); return i===0 ? l.charAt(0).toUpperCase()+l.slice(1) : l; }).join(' '); }
function medName(parts){
  const raw=parts.join(' ').replace(/\s*([+\/])\s*/g,'$1');
  return raw.split(/([+\/])/).map((c,i)=> i%2 ? c : medCap(c)).join('');

function medFinish(e,orig){
  const src=orig.slice(e.s==null?0:e.s,e.e==null?0:e.e).replace(/\s+/g,' ').trim();
  const D=why=>({src,out:null,why});
  if(e.flags.length) return D(e.flags[0]);
  if(!e.name.length) return D('sem nome de fármaco');
  const words=e.name.length;
  if(words>3) return D('nome com demasiadas palavras (pode haver mais do que um fármaco seguido)');
  const T=e.toks.filter(t=>t.t!=='conj'||true);
  const ofT=k=>T.filter(t=>t.t===k);
  const doses=ofT('dose'), grids=ofT('grid'), freqs=ofT('freq'), ints=ofT('interval'), sos=ofT('sos'), pord=ofT('pordia');
  const meals=ofT('meal'), qtys=T.filter(t=>t.t==='qty'||t.t==='num');
  if(doses.length>1) return D('mais do que uma dose');
  const name=medName(e.name.map(t=>t.o));
  let dose=''; if(doses.length){ dose=doses[0].o.replace(/\s+/g,'').toLowerCase().replace(/(\d)ui\b/g,'$1UI').replace(/^ui$/,'UI'); }
  let pos='';
  qtys.forEach(q=>{ if(q.t==='qty'){ const r=medQtyVal(q.n); q.v=r.v; q.u=r.u; } else { q.v=parseFloat(q.n.replace(',','.')); q.u=''; q.bare=true; }});
  if(qtys.some(q=>!(q.v>0)||q.v>10)) return D('quantidade não interpretável');
  if(qtys.some(q=>q.bare&&q.v>4)) return D('número sem unidade que pode ser dose ou quantidade');
  const nPos=grids.length+(meals.length?1:0)+(freqs.length+ints.length+pord.length?1:0)+(sos.length?1:0);
  if(nPos>1) return D('posologia em conflito (refeições, nº de tomas, SOS ou grelha misturados)');
  if(grids.length){
    if(grids.length>1||qtys.length) return D('posologia em conflito');
    const nums=grids[0].n.split('+').map(x=>x.trim().replace(',','.'));
    if(nums.length!==6) return D('grelha de posologia sem 6 posições');
    pos=nums.map(x=>medFmt(x)).join('+');
  } else if(meals.length){
    if(qtys.some(q=>q.u && !['cp','caps','saq','amp'].includes(q.u))) return D('unidade não compatível com a grelha de refeições');
    const items=T.filter(t=>['qty','num','meal','conj'].includes(t.t));
    for(let i=0;i<items.length;i++){ const t=items[i]; if(t.t!=='qty'&&t.t!=='num') continue;
      const prev=items[i-1], next=items[i+1];
      if(next&&next.t==='meal'){
        const prevExplicit = items[i-2] && (items[i-2].t==='qty'||items[i-2].t==='num');
        if(prev&&prev.t==='meal'&&!prevExplicit) return D('quantidade ambígua entre duas refeições');
        t.role='before';
      } else if(prev&&prev.t==='meal'){ t.role='after'; }
      else t.role='alone'; }
    const alone=items.filter(t=>t.role==='alone');
    if(new Set(alone.map(t=>t.v)).size>1) return D('várias quantidades sem refeição associada');
    const globalQ=alone.length?alone[0].v:null;
    const slots=[0,0,0,0,0,0]; let carry=null, pend=null;
    for(let i=0;i<items.length;i++){ const t=items[i];
      if(t.t==='qty'||t.t==='num'){ if(t.role==='before') pend=t.v; continue; }
      if(t.t!=='meal') continue;
      const idx=medMealIdx(medNorm(t.n)); if(idx<0) return D('refeição não reconhecida');
      const nx=items[i+1]; let amt;
      if(pend!=null){ amt=pend; carry=pend; pend=null; }
      else if(nx&&(nx.t==='qty'||nx.t==='num')&&nx.role==='after') amt=nx.v;

    const q=qtys.length?qtys:[];
    if(new Set(q.map(x=>x.v+x.u)).size>1) return D('várias quantidades diferentes');
    const qv=q.length?q[0].v:1, qu=q.length?(q[0].u||'cp'):'cp';
    let n=null;
    if(freqs.length||ints.length||pord.length){
      const vals=[];
      freqs.forEach(f=>{ const m=f.n.match(/\d+/); if(m) vals.push(+m[0]);
        else if(/^(uma|duas|tres|quatro)/.test(f.n)) vals.push(MED_NUMW[f.n.match(/^[a-z]+/)[0]]);
        else if(/^bid/.test(f.n)) vals.push(2); else if(/^tid/.test(f.n)) vals.push(3); else if(/^qid/.test(f.n)) vals.push(4); else if(/^id/.test(f.n)) vals.push(1); });
      for(const it of ints){ const m=it.n.match(/\d+/g); if(m.length<2||m[0]!==m[1]&&!/em/.test(it.n)) return D('intervalo entre tomas não interpretável'); if(/em/.test(it.n)&&m[0]!==m[1]) return D('intervalo entre tomas não interpretável');
        const h=+m[0]; if(!h||24%h!==0) return D('intervalo entre tomas não interpretável'); vals.push(24/h); }
      for(const _ of pord){ if(!(qv===1)) return D('"por dia" com quantidade pode significar toma única ou total diário'); vals.push(1); }
      if(new Set(vals).size>1) return D('nº de tomas diferentes na mesma entrada');

    }
    const qs = (qv===1 && ['cp','caps','saq','amp'].includes(qu)) ? '' : medFmt(qv)+qu;

    if(qtys.some(q=>q.bare)) return D('número sem posologia nem unidade');
    if(new Set(qtys.map(x=>x.v+x.u)).size>1) return D('várias quantidades diferentes');

}
function medProcess(text){
  const orig=String(text||'');
  const entries=medBuild(orig,medTokens(orig));
  const res=entries.map(e=>({e,r:medFinish(e,orig)}));
  /* partes que só têm palavras sem ser nomes de fármacos (durações, formulações...) juntam-se à anterior como dúvida */
  const out=[]; 
  res.forEach(x=>{
    const nm=x.e.name.map(t=>t.n||'');
    const nondrug = nm.length && nm.every(w=>MED_NONDRUG.has(w));
    if(nondrug){
      const prev=out[out.length-1];
      const why='palavras que não consigo associar a um fármaco ("'+x.r.src.slice(0,30)+'")';
      if(prev){ prev.r={src:(prev.r.src+' '+x.r.src).trim(),out:null,why}; return; }
      out.push({e:x.e,r:{src:x.r.src,out:null,why}}); return;
    }
    out.push(x);
  });
  const doubts=[], dups=[], seen={};
  const parts=out.map(x=>{
    if(x.r.out==null){ doubts.push({src:x.r.src,why:x.r.why}); return x.r.src.replace(/[,.;:\s]+$/,''); }
    if(seen[x.r.key]) dups.push(x.r.out); seen[x.r.key]=true;
    return x.r.out; });
  return {text:parts.filter(Boolean).join('; '),doubts,dups};
}

function medFit(ta){

}

/* =======================================================================

function rasWhy(p,id){

function rasImportDialog(){
  const st={}; RAS_IMP.forEach(([id])=>st[id]={mode:'cump',file:null,cols:{}}); st.act={file:null,cols:{}};
  const ALL=[['act','Utentes com rastreio oncológico ativo (opcional)']].concat(RAS_IMP);
  const draw=()=>{
    const sel=(id,key,val)=>{ const f=st[id].file; return `<select data-rc="${id}:${key}" style="flex:1"><option value="">—</option>${
      f.head.map((h,i)=>`<option value="${i}"${String(i)===String(val)?' selected':''}>${esc(h||'coluna '+(i+1))}</option>`).join('')}</select>`; };
    const rowsHtml=ALL.map(([id,lb])=>{ const s=st[id], f=s.file;
      return `<div class="block" style="margin:8px 0"><h4>${esc(lb)}</h4>
        <div class="field" style="border:0;flex-wrap:wrap;gap:10px">
          ${id==='act'?'':`<select data-rm="${id}"><option value="cump"${s.mode==='cump'?' selected':''}>Cumpridores</option><option value="nao"${s.mode==='nao'?' selected':''}>Não Cumpridores</option></select>`}
          <button class="btn sm" type="button" data-rf="${id}">${f?'Trocar ficheiro':'Escolher ficheiro Excel'}</button>
          ${f?`<span class="meta">${esc(f.name)} · ${f.body.length} linhas</span>`:'<span class="meta">sem ficheiro</span>'}</div>
        ${f?`<div class="field" style="border:0"><label>Nome</label>${sel(id,'nome',s.cols.nome)}</div>
          <div class="field" style="border:0"><label>Data de nascimento</label>${sel(id,'dob',s.cols.dob)}</div>
          <div class="field" style="border:0"><label>Nº de utente</label>${sel(id,'sns',s.cols.sns)}</div>
          <div class="field" style="border:0"><label>Sexo</label>${sel(id,'sex',s.cols.sex)}</div>`:''}</div>`; }).join('');
    openModal('Importar Excel — Rastreios',
      `<p style="margin-top:0;color:var(--ink3)">Carrega só os ficheiros que quiseres. A lista de <b>rastreio oncológico ativo</b> acrescenta os utentes em falta (com os respetivos dados) e ajuda a completar os utentes dos ficheiros abaixo. <b>Cumpridores</b>: os utentes da lista ficam “em dia” e os restantes do programa ficam “em atraso”. <b>Não Cumpridores</b>: o inverso.</p>${rowsHtml}`,
      [{lb:'Cancelar'},{lb:'Importar',pri:true,fn:()=>{
        const act=ALL.filter(([id])=>st[id].file);
        if(!act.length){ toast('Escolhe pelo menos um ficheiro'); return false; }
        if(act.some(([id])=>st[id].cols.nome==null||st[id].cols.nome==='')){ toast('Escolhe a coluna do nome em cada ficheiro'); return false; }
        const res=rasImportApply(st); setTimeout(()=>rasImportSummary(res),0);
      }}]);
    document.querySelectorAll('#sheet [data-rm]').forEach(s=>s.onchange=()=>{ st[s.dataset.rm].mode=s.value; });
    document.querySelectorAll('#sheet [data-rc]').forEach(s=>s.onchange=()=>{ const [id,k]=s.dataset.rc.split(':'); st[id].cols[k]=s.value; });
    document.querySelectorAll('#sheet [data-rf]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rf;
      pickFile('.xlsx,.xls,.csv',f=>{ const r=new FileReader(); r.onload=()=>{
        const wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
        const hi=rows.findIndex(r=>r.filter(c=>String(c).trim()).length>=2);
        if(hi<0) return toast('Não encontrei dados no ficheiro');
        const head=rows[hi].map(h=>String(h).trim());
        const body=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
        const guess=(...pats)=>{ const i=head.findIndex(h=>pats.some(p=>h.toLowerCase().includes(p))); return i<0?'':String(i); };
        st[id].file={name:f.name,head,body};
        st[id].cols={nome:guess('nome','utente','paciente','doente'),dob:guess('nascimento','nasc','dn','dob','data de nasc'),
          sns:guess('nº utente','n.º','sns','numero','número','snsutente'),sex:guess('sexo','género','genero')};
        draw(); };
        r.readAsArrayBuffer(f); }); });
  };
  draw();
}
/* ligação rigorosa: nome igual E (Nº de utente igual OU data de nascimento igual), sem dados em conflito */
function rasNN(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function rasSN(s){ return String(s==null?'':s).replace(/\D/g,'').replace(/^0+/,''); }
function rasFind(nome,dob,sns){
  const nn=rasNN(nome), sn=rasSN(sns);
  const cands=S.patients.filter(p=>rasNN(p.nome)===nn);
  if(!cands.length){
    if(sn && S.patients.some(p=>rasSN(p.sns)===sn)) return {why:'Nº de utente já existe com outro nome'};
    return {none:true};
  }
  const conflict=p=>(sn&&rasSN(p.sns)&&rasSN(p.sns)!==sn)||(dob&&p.dob&&p.dob!==dob);
  const confirm=p=>(sn&&rasSN(p.sns)===sn)||(dob&&p.dob&&p.dob===dob);
  const ok=cands.filter(p=>confirm(p)&&!conflict(p));
  if(ok.length===1) return {p:ok[0]};
  if(ok.length>1) return {why:'vários utentes correspondentes'};
  if(cands.some(conflict)) return {why:'Nº de utente ou data de nascimento não coincidem com o utente existente'};
  return {why:'sem Nº de utente nem data de nascimento que confirmem o utente'};
}
/* aplica a marca importada a um utente elegível (preserva datas manuais "em dia") */
/* procura o utente na lista de rastreio ativo (nome igual e Nº de utente ou data de nascimento iguais, sem conflitos; só aceita correspondência única) */
function rasLookupAct(rows,nome,sns){
  const nn=rasNN(nome), sn=rasSN(sns);
  const m=rows.filter(r=>rasNN(r.nome)===nn && !(sn&&rasSN(r.sns)&&rasSN(r.sns)!==sn) && (sn&&rasSN(r.sns)===sn));
  return m.length===1?m[0]:null;
}
function rasMarkApply(p,id,v,res){
  const d=RAS_DEFS.find(x=>x.id===id), lb=res.cnt[id].lb;
  let r=((p.ras.rec||{})[id])||null;
  if(r && r.date){
    const o=rasEval(p,{d,active:true});
    if(o.st==='ok'){ if(v==='late') res.inc.push({Nome:p.nome,'Nº utente':p.sns||'',Rastreio:lb,'Segundo o Excel':'Em atraso','Registo manual':'Em dia — última realização '+fmtPT(r.date)}); return; }
    r=rasRec(p,id); r.imp={v,d:todayISO(),old:r.date}; r.date='';
  } else { r=rasRec(p,id); r.imp={v,d:todayISO()}; }
  res.cnt[id][v]++;
}
function rasImportApply(st){
  const res={ok:[],inc:[],nao:[],novos:0,exist:0,cnt:{},pend:[],now:new Set()};
  /* 1) lista de rastreio ativo: acrescenta os utentes que faltam */
  const actRows=[];
  if(st.act && st.act.file){
    const c=st.act.cols, num=k=>(c[k]===''||c[k]==null)?-1:+c[k];
    const cN=num('nome'), cD=num('dob'), cS=num('sns'), cX=num('sex'), lb='Rastreio oncológico ativo';
    st.act.file.body.forEach(row=>{
      const nome=String(row[cN]||'').trim(); if(!nome) return;
      const dob=cD<0?'':parseAnyDate(row[cD]);
      const sns=cS<0?'':String(row[cS]||'').trim();
      const sexo=cX<0?'':sexNorm(row[cX]);
      actRows.push({nome,dob,sns,sexo});
      const nao=why=>res.nao.push({Nome:nome,'Nº utente':sns,Rastreio:lb,Motivo:why});
      if(!sns&&!dob) return nao('sem Nº de utente nem data de nascimento');
      const f=rasFind(nome,dob,sns);
      if(f.why) return nao(f.why);
      if(f.p){ res.exist++; return; }
      if(dob&&sexo){
        const p=newPatient({nome,dob,sns,sexo});
        if(!(rasGeneral(p)||rasKeep(p))) return nao('idade fora dos limites do programa Rastreios');
        S.patients.push(p); res.novos++; rasSync(p); res.now.add(p); return;
      }
      const key=rasNN(nome)+'|'+rasSN(sns);
      if(!res.pend.some(x=>x.key===key)) res.pend.push({key,id:null,lb,vIn:null,nome,sns,dob,sexo});
    });
  }
  RAS_IMP.forEach(([id,lb])=>{
    const s=st[id]; if(!s.file) return;
    const c=s.cols;
    const vIn = s.mode==='cump'?'ok':'late', vOut = vIn==='ok'?'late':'ok';
    const num=k=>(c[k]===''||c[k]==null)?-1:+c[k];
    const cN=num('nome'), cD=num('dob'), cS=num('sns'), cX=num('sex');
    /* nova importação substitui as marcas anteriores deste rastreio (repondo a data manual que tinha sido substituída) */
    S.patients.forEach(p=>{ const r=((p.ras&&p.ras.rec)||{})[id]; if(r&&r.imp){ if(r.imp.old&&!r.date) r.date=r.imp.old; delete r.imp; } });
    res.cnt[id]={lb,ok:0,late:0};
    const inSet=new Set(), seenPend=new Set();
    s.file.body.forEach(row=>{
      const nome=String(row[cN]||'').trim(); if(!nome) return;
      const dob=cD<0?'':parseAnyDate(row[cD]);
      const sns=cS<0?'':String(row[cS]||'').trim();
      const sexo=cX<0?'':sexNorm(row[cX]);
      const nao=why=>res.nao.push({Nome:nome,'Nº utente':sns,Rastreio:lb,Motivo:why});
      const f=rasFind(nome,dob,sns);
      if(f.why) return nao(f.why);
      let p=f.p, isNew=false;
      if(!p){
        if(!dob){ const key=rasNN(nome)+'|'+rasSN(sns);
          if(!seenPend.has(key)){ seenPend.add(key);
            const L=rasLookupAct(actRows,nome,sns);
            const ent={key,id,lb,vIn,nome,sns:sns||(L&&L.sns)||'',dob:(L&&L.dob)||'',sexo:sexo||(L&&L.sexo)||''};
            const k0=res.pend.findIndex(x=>x.key===key&&x.id===null);
            if(k0>=0) res.pend[k0]=ent; else res.pend.push(ent); }
          return; }
        p=newPatient({nome,dob,sns,sexo}); isNew=true;
      }
      const why=rasWhy(p,id);
      if(why) return nao(why);
      if(isNew){ S.patients.push(p); res.novos++; }
      rasSync(p);
      inSet.add(p);
    });
    inSet.forEach(p=>rasMarkApply(p,id,vIn,res));
    S.patients.forEach(p=>{ if(!p.prog.ras||inSet.has(p)) return; if(rasWhy(p,id)) return;
      const it=rasList(p).find(i=>i.d.id===id); if(!it||!it.active) return; rasMarkApply(p,id,vOut,res); });
  });
  markDirty(); render();
  return res;
}
function rasImportSummary(res){
  const list=(arr,cols)=>arr.length?`<div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px">${arr.map(x=>'<div>'+cols.map(k=>esc(x[k])).join(' · ')+'</div>').join('')}</div>`:'';
  const cnt=Object.values(res.cnt).map(c=>`<div><b>${esc(c.lb)}</b>: ${c.ok} em dia · ${c.late} em atraso</div>`).join('');
  const pend=res.pend.length?`<h4 style="margin:12px 0 4px">Novo utente detetado — pretende adicioná-lo? (${res.pend.length})</h4>
    <div class="hint">Sem data de nascimento no Excel e sem correspondência na lista. Preenche os campos em falta para os poderes adicionar.</div>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0;width:auto"><input type="checkbox" class="chk" id="rpAll" checked> Selecionar todos</label>
    <div style="max-height:260px;overflow:auto">${res.pend.map((x,k)=>`<div class="rp" data-k="${k}" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0;padding:6px;border:1px solid var(--line);border-radius:7px">
      <input type="checkbox" class="chk rpc" checked>
      <input type="text" data-rp="nome" placeholder="Nome" value="${esc(x.nome)}" style="flex:2;min-width:140px">
      <input type="text" data-rp="sns" placeholder="Nº de utente" value="${esc(x.sns)}" style="flex:1;min-width:100px">
      <input type="text" inputmode="numeric" autocomplete="off" data-rp="dob" class="din" placeholder="dd/mm/aaaa" value="${ptForInput(x.dob)}" style="width:105px">
      <select data-rp="sexo"><option value="">Sexo</option><option value="F"${x.sexo==='F'?' selected':''}>F</option><option value="M"${x.sexo==='M'?' selected':''}>M</option></select>
      <span class="meta" style="width:100%">${esc(x.lb)}</span></div>`).join('')}</div>`:'';
  const html=`${cnt}${res.novos?`<div style="margin-top:6px">${res.novos} utente(s) novo(s) criado(s) e associado(s) ao programa Rastreios.</div>`:''}${res.exist?`<div>${res.exist} utente(s) da lista de rastreio ativo já existiam na aplicação.</div>`:''}
    <h4 style="margin:12px 0 4px">Inconformidades (${res.inc.length})</h4>
    ${res.inc.length?'<div class="hint">Registo manual em dia que contradiz o Excel — foi preservado.</div>'+list(res.inc,['Nome','Nº utente','Rastreio','Registo manual']):'<div class="hint">Nenhuma.</div>'}
    <h4 style="margin:12px 0 4px">Não aplicados (${res.nao.length})</h4>
    ${res.nao.length?list(res.nao,['Nome','Nº utente','Rastreio','Motivo']):'<div class="hint">Nenhum.</div>'}${pend}`;
  const btns=[];
  if(res.pend.length) btns.push({lb:'Adicionar selecionados',pri:true,fn:()=>{
    const rows=[...document.querySelectorAll('#sheet .rp')].filter(r=>r.querySelector('.rpc').checked);
    const todayI=todayISO(); let bad=false; const vals=[];
    rows.forEach(r=>{ const g=k=>r.querySelector('[data-rp="'+k+'"]');
      const nome=g('nome').value.trim(), sns=g('sns').value.trim(), sexo=g('sexo').value, dob=parsePT2ISO(g('dob').value);
      [['nome',!nome],['sns',!sns],['dob',!dob||dob>todayI],['sexo',!sexo]].forEach(([k,e])=>{ g(k).classList.toggle('err',e); if(e) bad=true; });
      vals.push({x:res.pend[+r.dataset.k],nome,sns,sexo,dob}); });
    if(bad){ toast('Preenche todos os campos (nome, nº de utente, data de nascimento válida e sexo) dos utentes selecionados'); return false; }
    vals.forEach(v=>{
      const id=v.x.id, lb=v.x.lb, nao=why=>res.nao.push({Nome:v.nome,'Nº utente':v.sns,Rastreio:lb,Motivo:why});
      const f=rasFind(v.nome,v.dob,v.sns);
      if(f.why) return nao(f.why);
      if(f.p){
        /* acabado de adicionar neste mesmo passo (aparece em dois rastreios): só aplica a marca */
        if(id && res.now.has(f.p) && !rasWhy(f.p,id)) return rasMarkApply(f.p,id,v.x.vIn,res);
        return nao('já existe na lista de utentes');
      }
      const p=newPatient({nome:v.nome,dob:v.dob,sns:v.sns,sexo:v.sexo});
      const why=id ? rasWhy(p,id) : ((rasGeneral(p)||rasKeep(p))?'':'idade fora dos limites do programa Rastreios');
      if(why) return nao(why);
      S.patients.push(p); res.novos++; rasSync(p); res.now.add(p);
      if(id) rasMarkApply(p,id,v.x.vIn,res);
    });
    res.pend=[]; markDirty(); render(); setTimeout(()=>rasImportSummary(res),0);
  }});
  if(res.inc.length||res.nao.length) btns.push({lb:'Exportar para Excel',fn:()=>{
    if(typeof XLSX==='undefined'){ toast('Leitor de Excel indisponível'); return false; }
    const wb=XLSX.utils.book_new();
    if(res.inc.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(res.inc),'Inconformidades');
    if(res.nao.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(res.nao),'Não aplicados');
    XLSX.writeFile(wb,'rastreios-importacao-'+todayISO()+'.xlsx'); return false; }});
  btns.push({lb:'Fechar',pri:!res.pend.length});
  openModal('Importação concluída',html,btns);
  if(res.pend.length){
    const all=document.getElementById('rpAll'), cs=[...document.querySelectorAll('#sheet .rpc')];
    all.onchange=()=>cs.forEach(c=>c.checked=all.checked);
    cs.forEach(c=>c.onchange=()=>{ all.checked=cs.every(x=>x.checked); });
    document.querySelectorAll('#sheet .din').forEach(el=>el.oninput=()=>maskCursor(el));
  }
}

function rail(items){
  return `<div class="track"><div class="rail">${items.map(i=>
    `<button class="node ${i.st}" data-toggle="${i.kind}:${i.key}" title="${esc(i.lb)}">
       <span class="knob">${i.st==='ok'?'✓':(i.st==='late'||i.st==='falha')?'!':i.st==='na'?'–':''}</span>
       <span class="lb">${esc(i.short||i.lb)}</span></button>`).join('')}</div></div>`;
}
function itemRow(i,recusa){
  recusa = (recusa===true && i.key==='pnv');   /* só o PNV do Saúde Infantil; ignora o índice passado por .map() */
  const d=i.rec.date||'';
  return `<div class="item"${i.rec.na?' style="opacity:.55"':''}>
    <input type="checkbox" class="chk" data-toggle="${i.kind}:${i.key}" ${i.rec.done?'checked':''}>
    <div class="txt"><b>${esc(i.lb)}</b>${i.hint?`<span>${esc(i.hint)}</span>`:''}</div>
    <div style="display:flex;gap:6px;align-items:center">${recusa?'<span class="pill late">Recusa</span>':statusPill(i.st)}
      <input type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" class="din"${recusa?' style="opacity:.55;filter:grayscale(.6)"':''} data-date="${i.kind}:${i.key}" value="${ptForInput(i.rec.date)}">
      <button class="btn sm ${i.rec.na?'pri':''}" data-na="${i.kind}:${i.key}" title="Não avaliada — fora do meu acompanhamento">n/a</button></div></div>`;
}

function tabSM(p){
  const d=igDias(p.sm);
  const its=smItems(p);
  const g=t=>its.filter(i=>i.kind===t);

function wire(){
  document.querySelectorAll('#view [data-go]').forEach(e=>e.onclick=()=>{ ui.view=e.dataset.go; ui.filter='todos'; render(); });
  document.querySelectorAll('#view [data-open]').forEach(el=>el.onclick=()=>openPatient(el.dataset.open,el.dataset.tab));
  document.querySelectorAll('#view .seg button[data-f]').forEach(b=>b.onclick=()=>{ ui.filter=b.dataset.f; render(); });
  document.querySelectorAll('#view .seg button[data-mode]').forEach(b=>b.onclick=()=>{ ui.group=(b.dataset.mode==='grupo'); render(); });
  document.querySelectorAll('#view [data-act]').forEach(b=>b.onclick=()=>actions(b.dataset.act,b.dataset.k));
  document.querySelectorAll('#view [data-set]').forEach(s=>s.onchange=()=>{ S.settings[s.dataset.set]=+s.value; markDirty(); render(); });
  document.querySelectorAll('#view .din').forEach(el=>{ el.oninput=()=>maskCursor(el); });
  document.querySelectorAll('#view [data-mk]').forEach(el=>el.onchange=()=>{
    const [k,pid]=el.dataset.mk.split(':');
    const p=S.patients.find(x=>x.id===pid); if(!p) return;
    const cur=p[k].marcada||{date:''};
    commitDin(el, cur.date, iso=>{ p[k].marcada={date:iso}; markDirty(); render(); });
  });
  document.querySelectorAll('#view [data-sort]').forEach(s=>s.onchange=()=>{ ui.sort=s.value; render(); });
  wireExtra();
  wireV6();
  wireV7();
  document.querySelectorAll('#view [data-crosschk]').forEach(c=>c.onchange=()=>{
    const k=c.dataset.crosschk;
    if(c.checked){ if(!ui.crossSel.includes(k)) ui.crossSel.push(k); }
    else { ui.crossSel = ui.crossSel.filter(x=>x!==k); }
    render();
  });
  document.querySelectorAll('#view [data-loadcross]').forEach(b=>b.onclick=()=>{
    const cs=(S.crossSets||[]).find(x=>x.id===b.dataset.loadcross);
    if(cs) ui.crossSel = cs.progs.slice();
    render();
  });
  document.querySelectorAll('#view [data-delcross]').forEach(b=>b.onclick=()=>{
    S.crossSets = (S.crossSets||[]).filter(x=>x.id!==b.dataset.delcross);
    markDirty(); render();
  });
}

function wireDrawer(p){
  document.querySelectorAll('#dTabs button').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.t; renderDrawer(); });

  /* campos de data mascarados: reformatam ao escrever, só gravam quando saem do campo */
  document.querySelectorAll('#dBody .din').forEach(el=>{ el.oninput=()=>maskCursor(el); });

  document.querySelectorAll('#dBody [data-f]').forEach(inp=>inp.onchange=()=>{
    if(inp.classList.contains('din')) commitDin(inp, p[inp.dataset.f], iso=>{ p[inp.dataset.f]=iso; markDirty(); renderDrawer(); });
    else { p[inp.dataset.f]=inp.value; markDirty(); renderDrawer(); }
  });
  document.querySelectorAll('#dBody [data-prog]').forEach(c=>c.onchange=()=>{ if(c.dataset.prog==='ras') rasToggle(p,c.checked); else p.prog[c.dataset.prog]=c.checked; markDirty(); renderDrawer(); });
  if(ui.tab==='ras') wireRas(p);
  if(ui.tab==='ficha') wireFicha2(p);
  document.querySelectorAll('#dBody [data-domper]').forEach(s=>s.onchange=()=>{ p.dom.periodicidade=s.value; markDirty(); renderDrawer(); });
  document.querySelectorAll('#dBody [data-sm]').forEach(i=>i.onchange=()=>{
    if(i.classList.contains('din')) commitDin(i, p.sm[i.dataset.sm], iso=>{ p.sm[i.dataset.sm]=iso; markDirty(); renderDrawer(); });
    else { p.sm[i.dataset.sm]=i.value; markDirty(); renderDrawer(); }
  });
  document.querySelectorAll('#dBody [data-a1c]').forEach(i=>i.onchange=()=>{
    p.dm.ultimoA1c=p.dm.ultimoA1c||{};
    if(i.classList.contains('din')) commitDin(i, p.dm.ultimoA1c[i.dataset.a1c], iso=>{ p.dm.ultimoA1c[i.dataset.a1c]=iso; markDirty(); });
    else { p.dm.ultimoA1c[i.dataset.a1c]=i.value; markDirty(); }
  });
  document.querySelectorAll('#dBody [data-ta]').forEach(i=>i.onchange=()=>{
    p.hta.ta=p.hta.ta||{};
    if(i.classList.contains('din')) commitDin(i, p.hta.ta[i.dataset.ta], iso=>{ p.hta.ta[i.dataset.ta]=iso; markDirty(); renderDrawer(); });
    else { p.hta.ta[i.dataset.ta]=i.value; markDirty(); renderDrawer(); }
  });
  document.querySelectorAll('#dBody [data-obs]').forEach(t=>t.onchange=()=>{ p[t.dataset.obs].obs=t.value; markDirty(); });
  document.querySelectorAll('#dBody [data-toggle]').forEach(el=>el.onclick=(ev)=>{
    const path=el.dataset.toggle, cur=getRec(p,path)||{};
    let newVal;
    if(el.tagName==='INPUT'&&el.type==='checkbox'){ newVal = el.checked?{done:true,date:recDate(p,path)||todayISO()}:{done:false}; }
    else { newVal = cur.done?{done:false}:{done:true,date:todayISO()}; }
    setRec(p, path, newVal);
    markDirty(); renderDrawer();
    if(path==='puerp:puerp' && newVal.done && !cur.done) askRemoveSM(p);
  });
  document.querySelectorAll('#dBody [data-na]').forEach(el=>el.onclick=()=>{
    const cur=getRec(p,el.dataset.na)||{}; setRec(p,el.dataset.na, cur.na?{}:{na:true});
    markDirty(); renderDrawer(); });
  document.querySelectorAll('#dBody [data-date]').forEach(el=>el.onchange=()=>{
    const cur=getRec(p,el.dataset.date)||{};
    commitDin(el, cur.date, iso=>{
      const done = iso? true : !!cur.done;
      setRec(p,el.dataset.date,{done, date: iso});
      if(ui.tab==='si' && iso && /^cons:/.test(el.dataset.date)) siRelocateEdited(p, el.dataset.date.slice(5), iso);
      markDirty(); renderDrawer();
      if(el.dataset.date==='puerp:puerp' && done && !cur.done) askRemoveSM(p);
    });
  });
  const bulk=document.querySelector('#dBody [data-bulk]');
  if(bulk) bulk.onclick=()=>{ siItems(p).forEach(i=>{ if((i.st==='late'||i.st==='falha') && !i.rec.done){ (i.kind==='cons'?p.si.cons:p.si.aval)[i.key]={na:true}; } });
    markDirty(); renderDrawer(); toast('Marcadas como não avaliadas'); };
  document.querySelectorAll('#dBody [data-seg]').forEach(c=>c.onchange=()=>{ p.si[c.dataset.seg]=c.checked; markDirty(); });
  const avDone=document.querySelector('#dBody [data-avaldone]');
  if(avDone) avDone.onclick=()=>{ const m=ageMonths(p.dob); if(m==null) return; let n=0;
    SI_AVAL.forEach(c=>{ if(c.id==='pnv'||c.from>m) return; const r=p.si.aval[c.id];
      if(r && r.done) return; p.si.aval[c.id]={done:true}; n++; });
    if(n){ markDirty(); renderDrawer(); toast(n+' avaliação(ões)/rastreio(s) marcado(s) como realizado(s)'); }
    else toast('Não há avaliações ou rastreios por marcar'); };
  document.querySelectorAll('#dBody [data-chq]').forEach(c=>c.onchange=()=>{
    p.si.cheques=p.si.cheques||{}; p.si.cheques[c.dataset.chq]=c.checked; markDirty(); renderDrawer(); });
  const chqAll=document.querySelector('#dBody [data-chqall]');
  if(chqAll) chqAll.onclick=()=>{ const t=todayISO(); p.si.cheques=p.si.cheques||{}; let n=0;
    SI_CHEQ.forEach(q=>{ const a=bdayISO(p.dob,q.n); if(a && t>=a && !chequeOn(p,q)){ p.si.cheques[q.id]=true; n++; } });
    markDirty(); renderDrawer(); toast(n? n+' cheque(s)-dentista marcado(s) como utilizado(s)' : 'Não há cheques por marcar'); };
  const bulkDone=document.querySelector('#dBody [data-bulkdone]');
  if(bulkDone) bulkDone.onclick=()=>{ const t=todayISO(); let n=0;
    SI_CONS.forEach(c=>{ const w=siWin(c.id,p.dob); if(!w||t<=w.end) return;
      const st=siState(p,c); if(st==='na'||st==='falha'){ p.si.cons[c.id]={done:true}; n++; } });
    if(n){ markDirty(); renderDrawer(); toast(n+' consulta(s) de idades prévias marcada(s) como realizada(s)'); }
    else toast('Não há consultas de idades prévias por marcar'); };
  const datasTa=document.querySelector('#dBody [data-datas]');
  if(datasTa) datasTa.oninput=()=>{ ui.siDatas=datasTa.value; };
  const assume=document.querySelector('#dBody [data-assume]');
  if(assume) assume.onclick=()=>{ const txt=datasTa?datasTa.value:''; if(!txt.trim()) return toast('Escreve primeiro as datas'); siAssumir(p,txt); };
  const del=document.querySelector('#dBody [data-act="delp"]');
  if(del) del.onclick=()=>openModal('Apagar utente', `<p>Apagar <b>${esc(p.nome||'este utente')}</b> e todos os registos? Não dá para desfazer.</p>`,
    [{lb:'Cancelar'},{lb:'Apagar',pri:true,fn:()=>{ S.patients=S.patients.filter(x=>x.id!==p.id); markDirty(); closeDrawer(); }}]);
  wireSdm(p);
  wireFichaV7();
}
function store(p,kind){
  if(ui.tab==='si') return kind==='cons'?p.si.cons:p.si.aval;
  if(ui.tab==='sm') return kind==='cons'?p.sm.cons: kind==='eco'?p.sm.eco: kind==='lab'?p.sm.lab: kind==='vac'?p.sm.vac: null;
  return null;
}
function splitPath(path){ const i=path.indexOf(':'); return [path.slice(0,i), path.slice(i+1)]; }
function getRec(p,path){
  const [kind,key]=splitPath(path);
  if(ui.tab==='si') return (kind==='cons'?p.si.cons:p.si.aval)[key];
  if(ui.tab==='sm'){ if(kind==='antid') return p.sm.antid; if(kind==='puerp') return p.sm.puerp; return store(p,kind)[key]; }
  if(ui.tab==='dm'){ if(kind==='cons') return p.dm.cons[key]; if(kind==='a1c') return p.dm.a1c[key]; return p.dm[key]; }
  if(ui.tab==='hta'){ if(kind==='cons') return p.hta.cons[key]; return p.hta[key]; }
  if(ui.tab==='dpoc'||ui.tab==='asma'){ const store=p[ui.tab]; if(kind==='cons') return store.cons[key]; return store[key]; }
  if(ui.tab==='obesidade'){ if(kind==='cons') return p.obesidade.cons[key]; return p.obesidade[key]; }
  if(ui.tab==='dom') return p.dom[key];
}
function setRec(p,path,val){
  const [kind,key]=splitPath(path);
  if(ui.tab==='si'){ (kind==='cons'?p.si.cons:p.si.aval)[key]=val; return; }
  if(ui.tab==='sm'){ if(kind==='antid'){p.sm.antid=val;return;} if(kind==='puerp'){p.sm.puerp=val;return;} store(p,kind)[key]=val; return; }
  if(ui.tab==='dm'){ if(kind==='cons'){p.dm.cons[key]=val;return;} if(kind==='a1c'){p.dm.a1c[key]=val;return;} p.dm[key]=val; return; }
  if(ui.tab==='hta'){ if(kind==='cons'){p.hta.cons[key]=val;return;} p.hta[key]=val; }
  if(ui.tab==='dpoc'||ui.tab==='asma'){ const store=p[ui.tab]; if(kind==='cons'){store.cons[key]=val;return;} store[key]=val; }
  if(ui.tab==='obesidade'){ if(kind==='cons'){p.obesidade.cons[key]=val;return;} p.obesidade[key]=val; return; }
  if(ui.tab==='dom'){ p.dom[key]=val; }
}
function recDate(p,path){ const r=getRec(p,path); return r&&r.date; }
function askRemoveSM(p){
  openModal('Revisão de parto registada',
    `<p>Quer remover <b>${esc(p.nome)}</b> do programa de Saúde Materna?</p>
     <p style="color:var(--ink3)">Os registos desta gravidez mantêm-se guardados na ficha, mesmo que remova.</p>`,
    [{lb:'Manter no programa'},
     {lb:'Remover do programa',pri:true,fn:()=>{ p.prog.sm=false; markDirty(); closeDrawer(); }}]);
}

function requestCloseDrawer(){
  const p=ui.open ? S.patients.find(x=>x.id===ui.open) : null;
  if(p && p.prog && p.prog.si && toDate(p.dob)){
    const r=(p.si.aval||{}).pnv;

function markPastSI(p){
  const m=ageMonths(p.dob); if(m==null) return;
  SI_CONS.forEach(c=>{ if(m>c.to) p.si.cons[c.id]={na:true}; });
  SI_AVAL.forEach(c=>{ if(m>c.to) p.si.aval[c.id]={na:true}; });
}
/** forceProg: quando definido (ex. 'dm'), importa a lista diretamente para esse
 *  programa. Quem já existir na lista geral (mesmo nome + data de nascimento)
 *  é apenas associado ao programa, nunca duplicado. */
/* Encontra um utente já existente para a mesma pessoa. Prioriza nome+SNS,
   depois nome+data de nascimento; com um único homónimo, aceita-o desde que
   não haja um SNS ou uma data explicitamente diferentes dos dois lados —
   exatamente o que permite complementar uma data de nascimento em falta sem
   criar duplicados. Havendo vários homónimos, só junta se o SNS ou a data
   baterem certo com um deles. */
/* sexo vindo do Excel: Mulher/Feminino/Fem/F → 'F'; Homem/Masculino/Masc/M → 'M'; outro valor → '' */
function sexNorm(v){ const s=String(v==null?'':v).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.\s]+$/,'');
  if(['f','fem','feminino','mulher'].includes(s)) return 'F';
  if(['m','masc','masculino','homem'].includes(s)) return 'M';
  return ''; }
function findExisting(nome, dob, sns){
  const nlow = nome.trim().toLowerCase();
  const candidatos = S.patients.filter(x=>x.nome.trim().toLowerCase()===nlow);
  if(!candidatos.length) return null;
  if(candidatos.length===1){
    const c=candidatos[0];
    if(sns && c.sns && sns.trim().toLowerCase()!==c.sns.trim().toLowerCase()) return null;
    if(dob && c.dob && dob!==c.dob) return null;
    return c;
  }
  return candidatos.find(c =>
    (sns && c.sns && sns.trim().toLowerCase()===c.sns.trim().toLowerCase()) ||
    (dob && c.dob && dob===c.dob)) || null;
}

function isoIfValid(y,mo,d){
  if(!y||!mo||!d) return '';
  if(mo<1||mo>12) return '';
  const bis=(y%4===0&&(y%100!==0||y%400===0));
  const dim=[31,bis?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  if(d<1||d>dim) return '';
  if(y<1900||y>2100) return '';
  return `${y}-${pad(mo)}-${pad(d)}`;
}
/* Aceita: objetos Date do Excel, número de série do Excel, AAAA-MM-DD,
   AAAA/MM/DD, AAAA.MM.DD, DD-MM-AAAA, DD/MM/AAAA, DD.MM.AAAA (ano com 2 ou 4
   dígitos), e AAAAMMDD/DDMMAAAA em 8 dígitos seguidos, sem separador —
   o caso típico de uma coluna de Excel formatada como texto/número em vez
   de data (ex. 2024-05-25 gravado como 20240525). */
function parseAnyDate0(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;

  // número de série do Excel: só é plausível dentro de um intervalo de datas
  // reais — um valor como 20240525 é grande demais para ser um serial e é,
  // na verdade, texto compacto AAAAMMDD (tratado mais abaixo).
  if(typeof v==='number' && v>0 && v<80000){
    const d=XLSX.SSF.parse_date_code(v);
    if(d){ const iso=isoIfValid(d.y,d.m,d.d); if(iso) return iso; }
  }

  const s=String(v).trim().replace(/\s+/g,'');

  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m){ const iso=isoIfValid(+m[1],+m[2],+m[3]); if(iso) return iso; }

  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+= y>30?1900:2000; const iso=isoIfValid(y,+m[2],+m[1]); if(iso) return iso; }

  m=s.match(/^(\d{8})$/);
  if(m){
    const d8=m[1];
    const asYMD=isoIfValid(+d8.slice(0,4), +d8.slice(4,6), +d8.slice(6,8));
    if(asYMD) return asYMD;
    const asDMY=isoIfValid(+d8.slice(4,8), +d8.slice(2,4), +d8.slice(0,2));
    if(asDMY) return asDMY;
  }
  return '';
}

/* -------- imprimir a lista atual (respeita filtro, ordenação e agrupamento) -------- */
function printList(k){
  const list0 = filterList(listOf(k)).map(p=>({p,s:progStatus(p,k)}));
  const filtered = ui.filter==='todos' ? list0 : list0.filter(x=>x.s.st===ui.filter);
  const sorted = sortList(filtered, k, ui.sort);

  const idadeLb = k==='sm' ? 'Idade gestacional' : (k==='dpoc'||k==='asma') ? 'Última espirometria' : k==='obesidade' ? 'Última análise' : k==='dom' ? 'Última visita' : 'Idade';
  const comIdade = idadeLb!=='Idade';   /* coluna Idade à parte quando a coluna própria do programa é outra */
  const idadeVal = (p)=> k==='sm' ? (p.sm.parto?'pós-parto':fmtIG(igDias(p.sm)))
    : (k==='dpoc'||k==='asma') ? ((p[k].espiro&&p[k].espiro.date)?fmtPT(p[k].espiro.date):'—')
    : k==='obesidade' ? ((p.obesidade.lab&&p.obesidade.lab.date)?fmtPT(p.obesidade.lab.date):'—')
    : k==='dom' ? ((p.dom.visita&&p.dom.visita.date)?fmtPT(p.dom.visita.date):'—')
    : fmtAge(p.dob);
  const thead = `<thead><tr><th>Nome</th><th>Nº utente</th>${comIdade?'<th>Idade</th>':''}<th>${idadeLb}</th><th>Próximo passo</th><th>Estado</th></tr></thead>`;
  const rowsHtml = arr => arr.map(({p,s})=>`<tr>
      <td>${esc(p.nome)}${contactosPrint(p)}${vacPrint(p)}</td><td>${esc(p.sns||'—')}</td>${comIdade?`<td>${esc(idadeLista(k,p))}</td>`:''}<td>${esc(idadeVal(p))}</td>
      <td>${esc(s.next)}</td><td>${esc(ptSt(s.st))}</td></tr>`).join('');

  const grouped = (k==='si'||k==='sm') && ui.group;
  let body;
  if(grouped){
    const groups = k==='si' ? groupSIBuckets(sorted) : groupSMBuckets(sorted);
    body = groups.length
      ? groups.map(g=>`<h2>${esc(g.title)} <span style="font-weight:400;color:#666">(${g.items.length})</span></h2><table>${thead}<tbody>${rowsHtml(g.items)}</tbody></table>`).join('')
      : '<p>Sem utentes para esta seleção.</p>';
  } else {
    body = sorted.length
      ? `<table>${thead}<tbody>${rowsHtml(sorted)}</tbody></table>`
      : '<p>Sem utentes para esta seleção.</p>';
  }

  const filtroLb = {todos:'Todos os estados', late:'Em atraso', now:'A fazer', ok:'Em dia'}[ui.filter];
  const ordLb = {prioridade:'Prioridade', nome:'Nome (A–Z)', idade_asc:idadeLb+' crescente', idade_desc:idadeLb+' decrescente', anos_asc:'Idade crescente', anos_desc:'Idade decrescente'}[ui.sort];
  const quando = new Date().toLocaleString('pt-PT');

  document.getElementById('printArea').innerHTML = `
    <h1>${esc(PROGS[k].lb)}</h1>
    <p class="sub">${esc(filtroLb)} · Ordenado por ${esc(ordLb)}${grouped?` · Agrupado por ${k==='si'?'idade':'trimestre'}`:''} · ${sorted.length} utente(s) · impresso em ${esc(quando)}</p>
    ${body}`;
  window.print();
}

/* gerador com semente fixa: a demonstração é sempre a mesma lista (as datas acompanham o dia de hoje) */
function demoRng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function gerarDemo(){
  const R=demoRng(20261112), sim=pr=>R()<pr, um=a=>a[Math.floor(R()*a.length)], entre=(a,b)=>a+Math.floor(R()*(b-a+1));
  const normal=()=>{ let u=0,v=0; while(!u) u=R(); while(!v) v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const hoje=todayISO(), atras=n=>addDays(hoje,-Math.max(0,n));
  const NF=['Ana','Maria','Joana','Inês','Sofia','Beatriz','Marta','Catarina','Rita','Teresa','Helena','Isabel','Fernanda','Rosa','Lurdes','Glória','Conceição','Patrícia','Carla','Sandra','Mariana','Leonor','Matilde','Carolina','Alice','Clara','Filipa','Raquel','Susana','Graça','Luísa','Margarida'];
  const NM=['João','José','António','Manuel','Francisco','Pedro','Rui','Paulo','Carlos','Miguel','Tiago','Nuno','Luís','Jorge','Ricardo','Bruno','Diogo','Duarte','Tomás','Rodrigo','Afonso','Gonçalo','Henrique','Joaquim','Fernando','Vítor','Armando','Daniel','André','Hugo','Mário','Sérgio'];
  const AP=['Silva','Santos','Ferreira','Pereira','Oliveira','Costa','Rodrigues','Martins','Jesus','Sousa','Fernandes','Gonçalves','Gomes','Lopes','Marques','Alves','Almeida','Ribeiro','Pinto','Carvalho','Teixeira','Moreira','Correia','Mendes','Nunes','Soares','Vieira','Monteiro','Cardoso','Rocha','Neves','Coelho','Cruz','Cunha','Pires','Ramos','Reis','Simões','Antunes','Matos'];
  /* grupos de 5 anos: [idade mínima, idade máxima, peso, proporção de mulheres] — perto da pirâmide de uma lista típica */
  const BANDAS=[[0,4,4.0,.49],[5,9,4.4,.49],[10,14,4.9,.49],[15,19,5.2,.49],[20,24,5.2,.50],[25,29,5.2,.50],[30,34,5.6,.51],[35,39,6.2,.52],[40,44,7.2,.52],[45,49,7.6,.52],[50,54,7.3,.53],[55,59,7.1,.53],[60,64,6.6,.54],[65,69,6.0,.55],[70,74,5.4,.56],[75,79,4.4,.58],[80,84,3.3,.61],[85,89,2.1,.66],[90,98,1.2,.72]];
  const peso=BANDAS.reduce((s,b)=>s+b[2],0), N=360, usados=new Set(), lista=[];
  const semData=(y,s)=>{ const ini=`${y}-${s===1?'01':'07'}-01`, fim=`${y}-${s===1?'06-30':'12-31'}`; const lim=fim<hoje?fim:hoje;
    const d=daysBetween(ini,lim); return d<0? null : addDays(ini, entre(0,d)); };
  const anoData=()=>addDays(`${YEAR}-01-01`, entre(0, Math.max(0,daysBetween(`${YEAR}-01-01`,hoje))));
  BANDAS.forEach(([a0,a1,w,pf])=>{
    const n=Math.round(N*w/peso);
    for(let i=0;i<n;i++){
      const sexo=sim(pf)?'F':'M';
      let nome, s1, s2;
      do{ s1=um(AP); do{ s2=um(AP); }while(s2===s1); nome=(sexo==='F'?um(NF):um(NM))+' '+s1+' '+s2; }while(usados.has(nome));
      usados.add(nome);
      const dias=entre(a0*365+1, a1*365+360);
      const p=newPatient({nome, sexo, dob:atras(dias)});
      const y=ageYears(p.dob), apos=n0=>atras(Math.min(n0, dias-1)), bom=sim(.4), sb=pr=>bom||sim(pr);
      /* programas, com prevalências perto das de uma lista portuguesa */
      if(y<18){ p.prog.si=true; markPastSI(p); const m=ageMonths(p.dob);
        SI_CONS.forEach(c=>{ if(m>=c.from && m<=c.to && sb(.5)) p.si.cons[c.id]={done:true,date:apos(entre(1,25))}; });
        if(sb(.85)) p.si.aval.pnv={done:true,date:apos(entre(1,200))};
        if(sim(.03)) p.vac.pnv=true; }
      if(sexo==='F' && y>=20 && y<=40 && sim(.07)){
        p.prog.sm=true; const sem=entre(6,38); p.sm.dum=atras(sem*7+entre(0,6)); p.sm.rh=sim(.85)?'pos':'neg';
        const feito=(defs,store,pr)=>defs.forEach(c=>{ if((c.to<sem && sb(pr)) || (bom && c.from<=sem && c.to>=sem)) store[c.id]={done:true,date:addDays(p.sm.dum, entre(c.from*7, c.to*7))}; });
        feito(SM_CONS,p.sm.cons,.9); feito(SM_ECO,p.sm.eco,.85); feito(SM_LAB,p.sm.lab,.85); feito(SM_VAC,p.sm.vac,.7); }
      const ob = y>=18 && sim(y<45?.13:y<65?.21:.18);
      const ht = y>=18 && sim(Math.min(.9,(y<45?.05:y<65?.30:y<75?.55:.66)*(ob?1.5:1)));
      const dm = y>=18 && sim(Math.min(.8,(y<45?.02:y<65?.11:y<75?.20:.24)*(ob?2:1)*(ht?1.4:1)));
      const dp = y>=45 && sim(y<65?.04:.09);
      const as = sim(y<18?.08:.06);
      const dom= y>=75 && sim(y<85?.08:.26);
      if(dm){ p.prog.dm=true;
        const sems = SEM===1 ? [[YEAR,1]] : [[YEAR,1],[YEAR,2]];
        sems.forEach(([a,s])=>{ const passou=!(a===YEAR&&s===SEM), d=semData(a,s);
          if(d && sb(passou?.8:.45)) p.dm.cons[semKey(a,s)]={done:true,date:d};
          const d2=semData(a,s); if(d2 && sb(passou?.75:.4)) p.dm.a1c[semKey(a,s)]={done:true,date:d2}; });
        if(sb(.85)) p.dm.retina={done:true,date:atras(bom?entre(10,300):entre(10,600))};
        if(sb(.8)) p.dm.pe={done:true,date:atras(bom?entre(10,300):entre(10,520))};
        if(sb(.9)){ p.dm.lab={done:true,date:atras(bom?entre(10,300):entre(10,480))}; p.dm.ultimoA1c={valor:(6+R()*3).toFixed(1),data:p.dm.lab.date}; } }
      if(ht){ p.prog.hta=true;
        if(sb(.6)) p.hta.cons[String(YEAR)]={done:true,date:anoData()};
        if(sb(.85)) p.hta.lab={done:true,date:atras(bom?entre(10,300):entre(10,520))};
        if(sb(.85)) p.hta.ta={data:atras(bom?entre(5,300):entre(5,500)),sis:String(entre(118,164)),dia:String(entre(66,96))}; }
      [['dpoc',dp],['asma',as]].forEach(([k,on])=>{ if(!on) return; p.prog[k]=true;
        if(sb(.55)) p[k].cons[String(YEAR)]={done:true,date:anoData()};
        if(sb(.75)) p[k].espiro={done:true,date:apos(bom?entre(30,900):entre(30,1500))};
        if(sb(.55)) p[k].vacGripe={done:true,date:apos(entre(5,70))};
        if(bom){ p[k].vacCovid={done:true,date:apos(entre(5,70))}; p[k].vacPneumo={done:true,date:apos(entre(100,1500))}; } });
      if(ob){ p.prog.obesidade=true;
        if(sb(.5)) p.obesidade.cons[String(YEAR)]={done:true,date:anoData()};
        if(sb(.7)) p.obesidade.lab={done:true,date:atras(bom?entre(10,300):entre(10,600))}; }
      if(dom){ p.prog.dom=true; p.dom.periodicidade=um(['mensal','trimestral','trimestral','semestral']); p.dom.visita={done:true,date:atras(bom?entre(5,25):entre(5,260))}; }
      /* rastreios: o programa associa sozinho pela idade e sexo; aqui só alguns registos */
      if(y>=18 && sim(.18)) p.ras.fumador=true;
      if(sexo==='F' && y>=30 && y<=69 && sim(.65)) p.ras.rec.rccu={date:atras(entre(100,2300)),res:'neg'};
      if(sexo==='F' && y>=45 && y<=74 && sim(.6)) p.ras.rec.rcm={date:atras(entre(60,1000))};
      if(y>=50 && y<=74 && sim(.45)) p.ras.rec.rccr={date:atras(entre(60,900)),tipo:'psof'};
      const cron=[dm,ht,dp,as,ob].filter(Boolean).length;
      Object.keys(p.hist).forEach(k=>{ p.hist[k]=sim(cron? .75 : .45); });
      /* dados do SDM: última consulta e gastos do ano anterior */

  demoBiGerar(lista, hoje);

}

function parseEuro(v){
  if(v==null||v==='') return null;

  if(!s||s==='-') return null;

  else if(s.includes(',')) s = /^-?\d{1,3}(,\d{3})+$/.test(s) && s.split(',').length>2 ? s.replace(/,/g,'') : s.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s); return isFinite(n)? Math.round(n*100)/100 : null;

/* ---------------- 3. datas: casos que o leitor original não reconhecia ---------------- */
const MESES_PT={jan:1,fev:2,feb:2,mar:3,abr:4,apr:4,mai:5,may:5,jun:6,jul:7,ago:8,aug:8,set:9,sep:9,out:10,oct:10,nov:11,dez:12,dec:12};
const anoDe2 = aa => 2000+aa<=YEAR ? 2000+aa : 1900+aa;   /* ano com 2 algarismos: nunca no futuro */
function parseAnyDate(v){
  const a=parseAnyDate0(v); if(a) return a;
  if(v==null||v===''||v instanceof Date) return '';
  if(typeof v==='number' && !Number.isInteger(v)) return '';
  let s=String(v).trim();
  /* hora no fim: «05/07/2012 00:00:00», «2012-07-05T10:30», «05072012 10:30h» */
  const semHora=s.replace(/(?:T|\s+)\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?\s*(?:h|Z|[+-]\d{2}:?\d{2})?$/i,'').trim();
  if(semHora!==s){ const b=parseAnyDate0(semHora); if(b) return b; s=semHora; }
  const d=s.replace(/\s+/g,'');
  /* 7 algarismos: perdeu-se o zero do dia (5072012 → 05/07/2012) */
  if(/^\d{7}$/.test(d)){ const b=parseAnyDate0('0'+d); if(b) return b; }
  /* 6 algarismos: DDMMAA (050712 → 05/07/2012) */
  let m=d.match(/^(\d{2})(\d{2})(\d{2})$/);
  if(m){ const iso=isoIfValid(anoDe2(+m[3]),+m[2],+m[1]); if(iso) return iso; }
  /* mês por extenso ou abreviado: «5 de julho de 2012», «05-jul-2012», «5 jul. 12» */
  const t=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  m=t.match(/^(\d{1,2})\s*(?:de\s+|[-\/.]\s*)?([a-z]{3,})\.?\s*(?:de\s+|[-\/.,]\s*)?(\d{4}|\d{2})$/);
  if(m && MESES_PT[m[2].slice(0,3)]){ const y=m[3].length===2?anoDe2(+m[3]):+m[3]; const iso=isoIfValid(y,MESES_PT[m[2].slice(0,3)],+m[1]); if(iso) return iso; }
  return '';
}

function contactosTxt(p){ return [p.sns,p.telefone,p.email].filter(Boolean).map(esc).join(' · '); }
function contactosPrint(p){ const c=[p.telefone,p.email].filter(Boolean); return c.length?`<br><span style="color:#666;font-size:9pt">${esc(c.join(' · '))}</span>`:''; }
function contactosXls(p){ return {'Nº utente':p.sns||'', Telefone:p.telefone||'', Email:p.email||''}; }
/* nº de utente como texto (não perde zeros nem passa a notação científica) e colunas com largura legível */
function larguras(ws){
  if(!ws || !ws['!ref']) return ws;
  const r=XLSX.utils.decode_range(ws['!ref']), w=[];
  for(let c=r.s.c;c<=r.e.c;c++){ let m=6;
    for(let l=r.s.r;l<=r.e.r;l++){ const cel=ws[XLSX.utils.encode_cell({r:l,c})]; if(cel && cel.v!=null) m=Math.max(m,String(cel.v).length); }
    w.push({wch:Math.min(60,m+2)}); }
  ws['!cols']=w;
  return ws;
}
function folha(linhas){ return larguras(XLSX.utils.json_to_sheet(linhas.length?linhas:[{'Sem utentes':''}])); }
function ficheiroXls(nome, folhas){
  if(typeof XLSX==='undefined'){ toast('Leitor de Excel indisponível'); return; }
  const wb=XLSX.utils.book_new();
  folhas.forEach(([n,ws])=>XLSX.utils.book_append_sheet(wb, ws, n.slice(0,31)));
  XLSX.writeFile(wb, nome);
  toast('Excel exportado');
}
const SLUG={si:'saude-infantil',sm:'saude-materna',dm:'diabetes',hta:'hipertensao',dpoc:'dpoc',asma:'asma',obesidade:'obesidade',dom:'domicilios',ras:'rastreios'};

/* valor da coluna própria de cada programa, em texto */
function colunaPrograma(k,p){
  if(k==='sm') return ['Idade gestacional', p.sm.parto?'pós-parto':(fmtIG(igDias(p.sm))||'')];
  if(k==='dm'){ const a=p.dm.ultimoA1c||{}; return ['Última HbA1c', a.valor?(String(a.valor).replace('.',',')+'% · '+fmtPT(a.data)):'']; }
  if(k==='dpoc'||k==='asma'){ const e=p[k].espiro||{}; return ['Última espirometria', e.date?fmtPT(e.date):'']; }
  if(k==='obesidade'){ const l=p.obesidade.lab||{}; return ['Última análise', l.date?fmtPT(l.date):'']; }
  if(k==='dom'){ const v=p.dom.visita||{}; return ['Última visita', v.date?fmtPT(v.date)+' · '+(DOM_PERIODOS_LB[p.dom.periodicidade]||''):'']; }
  if(k==='hta'){ const t=p.hta.ta||{}; return ['Última TA', t.sis?`${t.sis}/${t.dia} · ${fmtPT(t.data)}`:'']; }
  return null;
}
function linhaPrograma(k,{p,s},grupo){
  const o={Nome:p.nome, ...contactosXls(p), 'Data de nascimento':fmtPT(p.dob), Idade:k==='sm'?idadeLista('sm',p):fmtAge(p.dob), Sexo:p.sexo||''};
  if(grupo) o.Grupo=grupo;
  const c=colunaPrograma(k,p); if(c) o[c[0]]=c[1];
  o['Próximo passo']=s.next; o.Estado=ptSt(s.st);
  if(k==='ras') rasList(p).map(i=>rasEval(p,i)).forEach(e=>{ o[e.d.short+' — estado']=e.st==='na'?'Não elegível':ptSt(e.st); o[e.d.short+' — última']=e.r.date?fmtPT(e.r.date):''; o[e.d.short+' — próxima']=e.next?fmtPT(e.next):(e.msg||''); });
  o['Consulta marcada']=fmtPT((p[k].marcada||{}).date)||'';
  o['Programas']=Object.keys(PROGS).filter(x=>p.prog[x]).map(x=>PROGS[x].lb).join(', ');
  return o;
}
function folhaPrograma(k,lista,grupos){
  const linhas=[];
  if(grupos) grupos.forEach(g=>g.items.forEach(x=>linhas.push(linhaPrograma(k,x,g.title))));
  else lista.forEach(x=>linhas.push(linhaPrograma(k,x)));
  return folha(linhas);
}
/* lista atual do programa: respeita a pesquisa, o filtro de estado, a ordenação e o agrupamento */
function xlsPrograma(k){
  const list0 = filterList(listOf(k)).map(p=>({p,s:progStatus(p,k)}));

}

/* ---- Utentes: ordenar por qualquer coluna (clicar no título; outro clique inverte) ---- */
const UT_COLS = [
  ['nome','Nome'], ['sns','Nº de utente'], ['dob','Data de nascimento'], ['idade','Idade'],
  ['telefone','Telefone'], ['email','Email'], ['progs','Programas']
];
function cabecUtentes(c){
  const cols = UT_COLS.slice();
  if(c.ult) cols.push(['ult','Última consulta']);
  if(c.ano) cols.push(['gastos','Gastos '+c.ano]);
  const o = ui.uSort || {col:'nome',dir:1};
  return cols.map(([id,lb])=>{ const at=o.col===id;
    return `<th aria-sort="${at?(o.dir>0?'ascending':'descending'):'none'}"><button type="button" class="th-ord" data-usort="${id}"${at?' data-ativo':''} title="Ordenar por ${esc(lb.toLowerCase())}">${esc(lb)}<span class="seta" aria-hidden="true">${at?(o.dir>0?'▲':'▼'):'▲▼'}</span></button></th>`; }).join('');
}
function ordenarUtentes(lista, c){
  const o = ui.uSort || {col:'nome',dir:1};
  const nome=(a,b)=>(a.nome||'').localeCompare(b.nome||'','pt');
  const txt=v=>String(v||'').trim();
  const val = p => {
    switch(o.col){
      case 'nome': return txt(p.nome) || null;
      case 'sns': { const d=txt(p.sns).replace(/\D/g,''); return d ? Number(d) : (txt(p.sns)||null); }
      case 'dob': return p.dob || null;
      case 'idade': { const m=ageMonths(p.dob); return m==null?null:m; }
      case 'telefone': return txt(p.telefone).replace(/\s/g,'') || null;
      case 'email': return txt(p.email).toLowerCase() || null;
      case 'progs': { const ks=Object.keys(PROGS).filter(k=>p.prog[k]); return ks.length ? ks.map(k=>PROGS[k].lb).join(', ') : null; }
      case 'ult': return p.sdm.ultConsulta || null;
      case 'gastos': { const g=c.ano && p.sdm.gastos[c.ano]; return g&&(g.med!=null||g.mcdt!=null) ? (g.med||0)+(g.mcdt||0) : null; }
    }
    return null;
  };
  const cmp=(a,b)=> typeof a==='number' && typeof b==='number' ? a-b : String(a).localeCompare(String(b),'pt',{numeric:true});
  /* quem não tem o valor fica sempre no fim, seja qual for a direção */
  return lista.map(p=>({p,v:val(p)})).sort((x,y)=>{
    if(x.v==null && y.v==null) return nome(x.p,y.p);
    if(x.v==null) return 1; if(y.v==null) return -1;
    return o.dir*cmp(x.v,y.v) || nome(x.p,y.p);
  }).map(x=>x.p);
}

/* ---- Rastreios → Combinar rastreios: utentes com vários rastreios desatualizados ao mesmo tempo ---- */
function rasComb(){
  const c = Object.assign({sel:['rccu','rcm'], modo:'todos', est:'late'}, S.settings.rasComb||{});
  c.sel = (Array.isArray(c.sel)?c.sel:[]).filter(id=>RAS_DEFS.some(d=>d.id===id));
  if(!['todos','algum'].includes(c.modo)) c.modo='todos';
  if(!['late','pend'].includes(c.est)) c.est='late';
  return c;
}
function rasCombLista(){
  const c=rasComb(), quer = st => c.est==='late' ? st==='late' : (st==='late'||st==='now');
  if(!c.sel.length) return {c, list:[]};
  const list = filterList(listOf('ras')).map(p=>{
    const ev={}; rasList(p).map(i=>rasEval(p,i)).forEach(e=>{ if(e.active && e.st!=='na') ev[e.d.id]=e; });
    const bate=c.sel.filter(id=>ev[id] && quer(ev[id].st));
    const ok = c.modo==='todos' ? bate.length===c.sel.length : bate.length>0;
    return ok ? {p, ev, n:bate.length} : null;
  }).filter(Boolean);
  list.sort((a,b)=> b.n-a.n || (a.p.nome||'').localeCompare(b.p.nome||'','pt'));
  return {c, list};
}
function rasCombTitulo(c){
  const nomes=c.sel.map(id=>RAS_DEFS.find(d=>d.id===id).short);
  const est = c.est==='late' ? 'em atraso' : 'em atraso ou a fazer';
  if(c.sel.length===1) return nomes[0]+' '+est;
  return (c.modo==='todos' ? nomes.join(' + ')+' — todos '+est+' ao mesmo tempo' : nomes.join(' ou ')+' — pelo menos um '+est);
}
function rasCelula(e){
  if(!e) return '<span class="meta">não se aplica</span>';
  const quando = e.next ? (e.st==='late'?'desde ':'até ')+fmtPT(e.next) : (e.r && e.r.date ? 'último '+fmtPT(e.r.date) : (e.msg||'sem registo'));
  return statusPill(e.st)+`<span class="meta">${esc(quando)}</span>`;
}
function rasTexto(e){
  if(!e) return 'Não se aplica';
  return ptSt(e.st)+(e.next?(e.st==='late'?' desde ':' até ')+fmtPT(e.next):(e.r&&e.r.date?' · último '+fmtPT(e.r.date):(e.msg?' · '+e.msg:'')));
}
function viewRasComb(){
  const {c, list} = rasCombLista();
  const checks = RAS_DEFS.map(d=>`<label title="${esc(d.lb)}"><input type="checkbox" class="chk" data-combras="${d.id}" ${c.sel.includes(d.id)?'checked':''}> ${esc(d.short)}${d.smoker?' <small>(fumadores)</small>':''}</label>`).join('');
  const seg=(attr,val,lb,cur)=>`<button data-${attr}="${val}" class="${cur===val?'on':''}">${lb}</button>`;
  const cols = c.sel.map(id=>`<th>${esc(RAS_DEFS.find(d=>d.id===id).short)}</th>`).join('');
  const rows = list.map(({p,ev})=>`<tr data-open="${p.id}" data-tab="ras">
      <td><div class="nm">${esc(p.nome)}</div><div class="meta">${contactosTxt(p)}</div></td>
      <td><span class="age">${fmtAge(p.dob)||'—'}</span></td>
      ${c.sel.map(id=>`<td class="cel-ras">${rasCelula(ev[id])}</td>`).join('')}
      <td onclick="event.stopPropagation()"><input type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" class="din" style="width:104px" data-mk="ras:${p.id}" value="${ptForInput((p.ras.marcada||{}).date)}"></td></tr>`).join('');
  return `<h1>${PROGS.ras.lb}</h1><p class="sub">${listOf('ras').length} utentes neste programa · combinação de rastreios</p>
   <div class="toolbar"><div class="seg"><button data-mode="lista">Lista</button><button data-mode="grupo" class="on">Combinar rastreios</button></div><div class="grow"></div>
     <button class="btn" data-act="printcomb"${list.length?'':' disabled'}>Imprimir lista</button>
     <button class="btn" data-act="xlscomb"${list.length?'':' disabled'}>Exportar Excel</button></div>
   <div class="block"><h4>Rastreios a combinar</h4>
     <div class="comb-ras">${checks}</div>
     <div class="comb-op"><span>Utentes com</span>
       <div class="seg">${seg('combmodo','todos','todos ao mesmo tempo',c.modo)}${seg('combmodo','algum','pelo menos um',c.modo)}</div>
       <div class="seg">${seg('combest','late','em atraso',c.est)}${seg('combest','pend','em atraso ou a fazer',c.est)}</div></div>
     <div class="hint" style="padding:0 14px 12px">Conta só os rastreios que se aplicam a cada utente (idade, sexo e, nos do fumador, hábitos tabágicos). Quem não é elegível ou tem seguimento hospitalar não entra.</div>
   </div>
   ${!c.sel.length ? `<div class="empty"><b>Escolhe pelo menos um rastreio</b>Por exemplo, RCCU e RCM para as utentes com os dois rastreios em atraso.</div>`
     : list.length ? `<p class="sub" style="margin:4px 0 10px">${list.length} utente(s) · ${esc(rasCombTitulo(c))}</p>
       <table><thead><tr><th>Utente</th><th>Idade</th>${cols}<th>Consulta marcada</th></tr></thead><tbody>${rows}</tbody></table>`
     : `<div class="empty"><b>Ninguém com esta combinação</b>${esc(rasCombTitulo(c))}.</div>`}`;
}

      .concat([{id:'t', lb:'Custo total', num:true, v:l=>l.c.t, h:l=>`<b>${fmtEur(l.c.t)}</b>`}]);
    const T=tabelaOrd('custos', cols, L, {def:{col:'t',dir:-1}, totais:{nome:`<b>Total (${L.length})</b>`, mcdt:`<b>${fmtEur(A.tot.mcdt)}</b>`, med:`<b>${fmtEur(A.tot.med)}</b>`, mcdtH:hosp?`<b>${fmtEur(A.tot.mcdtH)}</b>`:null, int:hosp?`<b>${fmtEur(A.tot.int)}</b>`:null, t:`<b>${fmtEur(A.soma)}</b>`}});

  if(A.porComb.length) h+=`<h2>Por combinação de doenças crónicas</h2><p class="rel-explica">Combinação exata (cada utente conta uma vez). As 15 com mais custo total.</p>`+

  if(A.porFreg && A.porFreg.length>1) h+=`<h2>Por freguesia de residência</h2>`+

const UTIL_FILTROS = [['todos','Todos'],['sem12','Sem consulta médica há 12 meses'],['sem36','Sem consulta médica há 36 meses'],['naoutil','Não utilizadores dos CSP (ficha)'],
  ['hiper','Muitas consultas médicas (12 meses)'],['urg','Urgência frequente (4 ou mais em 12 meses)'],['cronsem','Doença crónica sem consulta médica há 12 meses'],
  ['idoso','75 e mais anos sem contacto há 12 meses'],['agendada','Com consulta médica agendada'],['domic','Com domicílios nos últimos 12 meses']];
function utilHiper(){ const n=+ui.uHiper; return n>0? n : 12; }
function passaUtil(p,f){ const b=p.bi; if(!f||f==='todos') return true;
  if(f==='sem12') return !(b.med12>0); if(f==='sem36') return !(b.med36>0); if(f==='naoutil') return b.naoUtil===true;
  if(f==='hiper') return (b.med12||0)>=utilHiper(); if(f==='urg') return (b.urg12||0)>=4; if(f==='cronsem') return nCron(p)>0 && !(b.med12>0);
  if(f==='idoso'){ const a=ageYears(p.dob); return a!=null&&a>=75 && (b.diasSemCont==null||b.diasSemCont>365); }
  if(f==='agendada') return b.medAg===true; if(f==='domic') return ((b.medDom12||0)+(b.enfDom12||0))>0; return true; }
function utilLinhas(){ return filterList(S.patients).filter(p=>p.bi && passaProg(p,ui.uProg) && passaFaixa(p,ui.uFaixa) && passaUtil(p,ui.uFil)).map(p=>({p})); }
const membrosLista = p => p.agregado ? S.patients.filter(x=>x.agregado===p.agregado).length : null;
function utilAnalise(L){
  const P=L.map(l=>l.p), n=P.length, b=p=>p.bi;
  const util=(l)=>({n:l.length, um:l.filter(p=>b(p).med12>0).length, enf:l.filter(p=>b(p).enf12>0).length, mMed:media(l.map(p=>b(p).med12||0)), mEnf:media(l.map(p=>b(p).enf12||0)),
    mMed36:media(l.map(p=>b(p).med36||0)), urg:l.filter(p=>(b(p).urg12||0)>0).length, mUrg:media(l.map(p=>b(p).urg12||0)), nao:l.filter(p=>b(p).naoUtil===true).length});
  const A={n, g:util(P)};
  A.fam=new Set(P.filter(p=>b(p).famNaoUtil===true&&p.agregado).map(p=>p.agregado)).size;
  A.minutosMed=media(P.filter(p=>b(p).med12>0&&b(p).med12min).map(p=>b(p).med12min/b(p).med12));
  A.dom=somaDe(P,p=>(b(p).medDom12||0)+(b(p).enfDom12||0)); A.domUt=P.filter(p=>((b(p).medDom12||0)+(b(p).enfDom12||0))>0).length;
  A.np=somaDe(P,p=>b(p).medNP12||0); A.medTot=somaDe(P,p=>b(p).med12||0); A.enfTot=somaDe(P,p=>b(p).enf12||0);
  A.agendada=P.filter(p=>b(p).medAg===true).length; A.urg4=P.filter(p=>(b(p).urg12||0)>=4).length; A.hiper=P.filter(p=>(b(p).med12||0)>=utilHiper()).length;
  A.sns24=P.filter(p=>(b(p).sns24_12||0)>0).length; A.semSist=P.filter(p=>b(p).naoUtilSist===true).length;
  A.porFaixa=REL_FAIXAS.map(([x,y,lb])=>Object.assign({lb}, util(P.filter(p=>faixaDe(p)===lb))));
  A.porProg=Object.keys(PROGS).map(k=>Object.assign({lb:PROGS[k].lb}, util(P.filter(p=>p.prog[k])))).concat([Object.assign({lb:'Sem programa'}, util(P.filter(p=>nProgs(p)===0)))]);
  A.porCron=[0,1,2,3].map(c=>Object.assign({lb:c<3?String(c):'3 ou mais'}, util(P.filter(p=> c<3? nCron(p)===c : nCron(p)>=3))));
  const B=[['0',0,0],['1–2',1,2],['3–5',3,5],['6–11',6,11],['12 ou mais',12,1e9]];
  A.distMed=B.map(([lb,a,c])=>({lb, n:P.filter(p=>{ const m=b(p).med12||0; return m>=a&&m<=c; }).length}));
  A.distEnf=B.map(([lb,a,c])=>({lb, n:P.filter(p=>{ const m=b(p).enf12||0; return m>=a&&m<=c; }).length}));
  A.ult=[['Nos últimos 12 meses',0,365],['Há 12 a 36 meses',366,1095],['Há mais de 36 meses',1096,1e9]].map(([lb,a,c])=>({lb, n:P.filter(p=>{ const u=b(p).ultMed; if(!u) return false; const d=daysBetween(u,todayISO()); return d>=a&&d<=c; }).length}))
    .concat([{lb:'Sem consulta médica registada', n:P.filter(p=>!b(p).ultMed).length}]);
  return A;
}

/* ---------------- 6. População e agregados ---------------- */
function agregados(lista){
  const m=new Map(); (lista||S.patients).forEach(p=>{ if(!p.agregado) return; if(!m.has(p.agregado)) m.set(p.agregado,[]); m.get(p.agregado).push(p); });
  return [...m.entries()].map(([cod,ps])=>{ const idades=ps.map(p=>ageYears(p.dob)).filter(x=>x!=null);
    const nR=Math.max(0,...ps.map(p=>(p.bi&&p.bi.nElemFam)||0)) || null;
    const fr={}; ps.forEach(p=>{ const f=p.bi&&p.bi.freg; if(f) fr[f]=(fr[f]||0)+1; });
    const freg=Object.keys(fr).sort((a,b)=>fr[b]-fr[a])[0]||'';
    return {cod, ps:ps.slice().sort((a,b)=>(ageYears(b.dob)||0)-(ageYears(a.dob)||0)), n:ps.length, nR, idades, freg,
      min:idades.length?Math.min(...idades):null, max:idades.length?Math.max(...idades):null,
      soIdosos: idades.length===ps.length && idades.every(a=>a>=65) && (nR==null||nR===ps.length),
      criancas: idades.some(a=>a<6), naoUtil: ps.some(p=>p.bi&&p.bi.famNaoUtil===true)}; });
}
function popDados(lista){
  const P=lista||S.patients, comB=P.filter(p=>p.bi), N=P.length;
  const D={N, nBi:comB.length};
  const contar=(f)=>{ const m=new Map(); comB.forEach(p=>{ const k=f(p); if(k==null||k==='') return; if(!m.has(k)) m.set(k,[]); m.get(k).push(p); }); return m; };
  const res=(lb,ps,extra)=>Object.assign({lb, n:ps.length, p:pct(ps.length,comB.length), F:ps.filter(p=>p.sexo==='F').length, M:ps.filter(p=>p.sexo==='M').length,
    idade:media(ps.map(p=>ageYears(p.dob)).filter(x=>x!=null)), men18:ps.filter(p=>{ const a=ageYears(p.dob); return a!=null&&a<18; }).length,
    i65:ps.filter(p=>{ const a=ageYears(p.dob); return a!=null&&a>=65; }).length, sos65:ps.filter(p=>{ const a=ageYears(p.dob); return a!=null&&a>=65&&p.bi.nElemFam===1; }).length,
    estr:ps.filter(p=>p.bi.nac&&p.bi.nac!=='PT').length, agr:new Set(ps.filter(p=>p.agregado).map(p=>p.agregado)).size}, extra||{});
  D.freg=[...contar(p=>p.bi.freg||null).entries()].map(([c,ps])=>{ const f=fregInfo(c)||{}; return res(fregNome(c), ps, {cod:c, conc:f.conc||'', dist:f.dist||'', dens:ps.find(p=>p.bi.densPop!=null)?ps.find(p=>p.bi.densPop!=null).bi.densPop:null}); }).sort((a,b)=>b.n-a.n);
  D.conc=[...contar(p=>{ const f=fregInfo(p.bi.freg); return f? f.cod.slice(0,4) : null; }).entries()].map(([c,ps])=>{ const C=caop(); return res((C.m[c]||{}).nome||('Concelho '+c), ps, {cod:c, dist:C.d[c.slice(0,2)]||''}); }).sort((a,b)=>b.n-a.n);
  D.nac=[...contar(p=>p.bi.nac||null).entries()].map(([c,ps])=>res(paisNome(c), ps, {cod:c})).sort((a,b)=>b.n-a.n);
  D.semFreg=comB.filter(p=>!p.bi.freg).length; D.semNac=comB.filter(p=>!p.bi.nac).length;
  D.estr=comB.filter(p=>p.bi.nac&&p.bi.nac!=='PT').length; D.resFora=comB.filter(p=>p.bi.paisRes&&p.bi.paisRes!=='PT').length;
  const AG=agregados(P); D.ag=AG; D.nAg=AG.length;
  D.agMedia=media(AG.map(a=>a.nR||a.n)); D.agLista=media(AG.map(a=>a.n));
  const dimR=[1,2,3,4,5,6]; D.dim=dimR.map(d=>{ const l=AG.filter(a=>{ const x=a.nR||a.n; return d<6? x===d : x>=6; }); return {lb:d<6?String(d):'6 ou mais', ag:l.length, pes:l.reduce((s,a)=>s+a.n,0)}; });
  D.unip=AG.filter(a=>(a.nR||a.n)===1).length;
  const sos=P.filter(p=>p.bi&&p.bi.nElemFam===1); const a65=p=>{ const a=ageYears(p.dob); return a!=null&&a>=65; }, a75=p=>{ const a=ageYears(p.dob); return a!=null&&a>=75; };
  D.sos65=sos.filter(a65).length; D.sos75=sos.filter(a75).length; D.i65=comB.filter(a65).length; D.i75=comB.filter(a75).length;
  D.soIdosos=AG.filter(a=>a.soIdosos&&a.n>=2).length; D.comCriancas=AG.filter(a=>a.criancas).length; D.agNaoUtil=AG.filter(a=>a.naoUtil).length;
  D.semAgr=P.filter(p=>!p.agregado).length;
  const b=k=>comB.filter(p=>p.bi[k]===true).length;
  D.benef=[['Insuficiência económica',b('insufEcon')],['Isenção de taxas moderadoras',b('isencao')],['Regime especial de comparticipação de medicamentos (RECM)',b('recm')],['Subsistema de saúde',b('subsistema')]];
  D.up=somaDe(comB,p=>p.bi.up); D.upN=comB.filter(p=>p.bi.up!=null).length;
  D.semEnf=comB.filter(p=>String(p.bi.enfFam)==='-1').length;
  return D;
}
const AGR_FILTROS=[['todos','Todos os agregados'],['unip','Unipessoais'],['sos65','Pessoa com 65 e mais anos que vive só'],['soidosos','Só pessoas com 65 e mais anos'],['criancas','Com crianças com menos de 6 anos'],['grandes','Com 5 ou mais pessoas'],['naoutil','Família não utilizadora dos CSP'],['incompleto','Com pessoas fora desta lista']];

function fichaV7(p){
  const b=p.bi, f=b&&fregInfo(b.freg);
  const outros=p.agregado? S.patients.filter(x=>x.agregado===p.agregado && x.id!==p.id).sort((a,c)=>(ageYears(c.dob)||0)-(ageYears(a.dob)||0)) : [];
  let h=`<div class="block"><h4>Agregado familiar e residência</h4>
    <div class="field"><label>Código do agregado</label><input data-f="agregado" value="${esc(p.agregado)}" placeholder="Prc. Famil." style="width:140px">
      <span class="meta">${b&&b.nElemFam!=null?`${b.nElemFam} pessoa(s) no agregado (RNU)`:''}${p.agregado?` · ${outros.length+1} nesta lista`:''}</span></div>
    ${p.agregado? `<div class="field" style="align-items:flex-start"><label>No mesmo agregado</label><div>${outros.length? outros.map(x=>`<button type="button" class="lk" data-abrir="${x.id}">${esc(x.nome)}</button> <span class="meta">${fmtAge(x.dob)}${x.sexo?' · '+x.sexo:''}</span>`).join('<br>') : '<span class="meta">Ninguém mais desta lista</span>'}</div></div>`:''}`;
  if(b){
    h+=`<div class="field"><label>Nacionalidade</label><span>${esc(paisNome(b.nac)||'—')}${b.paisRes&&b.paisRes!=='PT'?` <span class="meta">· reside em ${esc(paisNome(b.paisRes))}</span>`:''}</span></div>
    <div class="field"><label>Freguesia</label><span>${f? `${esc(fregNome(f.cod))} <span class="meta">· ${esc([f.conc,f.dist].filter(Boolean).join(' · '))} · ${esc(f.cod)}</span>` : '—'}</span></div>
    ${b.morada||b.cp?`<div class="field"><label>Morada</label><span>${esc([b.morada,b.cp].filter(Boolean).join(' · '))}</span></div>`:''}`;
  }
  h+=`</div>`;
  if(!b) return h;
  const lin=(lb,v)=>`<tr><td class="meta">${lb}</td><td>${v}</td></tr>`;
  const d=x=>x?fmtPT(x):'—';
  h+=`<div class="block"><h4>Utilização e custos <span class="meta" style="font-weight:400">· ficha de ${fmtPT(b.data)}</span></h4>
    <div style="padding:8px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 24px">
    <table class="tb-simples"><tbody>
      ${lin('Consultas médicas (12 · 36 meses)', `${fmtN(b.med12)} · ${fmtN(b.med36)}`)}${lin('Consultas de enfermagem (12 · 36 meses)', `${fmtN(b.enf12)} · ${fmtN(b.enf36)}`)}
      ${lin('Outros profissionais (12 meses)', fmtN(b.out12))}${lin('Domicílios (médicos · enfermagem, 12 meses)', `${fmtN(b.medDom12)} · ${fmtN(b.enfDom12)}`)}
      ${lin('Última consulta médica', d(b.ultMed))}${lin('Última consulta de enfermagem', d(b.ultEnf))}${lin('Dias sem contacto com os CSP', fmtN(b.diasSemCont))}
      ${lin('Consulta agendada (médica · enfermagem)', `${simNao(b.medAg)} · ${simNao(b.enfAg)}`)}
    </tbody></table>
    <table class="tb-simples"><tbody>
      ${lin('Urgências (12 meses)', `${fmtN(b.urg12)}${b.ultUrg?` <span class="meta">· última ${d(b.ultUrg)}</span>`:''}`)}${lin('Consultas hospitalares (12 meses)', fmtN(b.consHosp12))}
      ${lin('Internamento (12 meses)', `${fmtN(b.intern12dias)} dias · ${fmtEur(b.intern12)}`)}
      ${lin('Medicação (PVP, 12 meses)', fmtEur(b.medic12))}${lin('MCDT convencionados (12 meses)', fmtEur(b.mcdt12))}${lin('MCDT hospitalares (12 meses)', fmtEur(b.mcdtHosp12))}
      ${lin('Benefícios', [b.insufEcon?'insuficiência económica':'', b.isencao?'isenção de taxas':'', b.recm?'RECM':'', b.subsistema?'subsistema':''].filter(Boolean).join(' · ')||'—')}
      ${String(b.enfFam)==='-1'?lin('Enfermeiro de família','<span style="color:var(--late)">sem atribuição</span>'):''}
    </tbody></table></div>
    <div class="hint">Da ficha de utentes do BI-CSP importada (Utentes → Importar lista de Excel). Cada importação substitui estes valores.</div></div>`;

}
