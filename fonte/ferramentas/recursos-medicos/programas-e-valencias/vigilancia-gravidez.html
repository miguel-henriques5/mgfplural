function buildRecord(){
  const c=consDef(); const st=cst(); const d=igDays(); const pp=postpartum(); const dt=dating(); const out={};
  let s=[]; let l1='Consulta de '+(c.id==='pre'?'pré-conceção':c.id==='pp'?'revisão do puerpério':'vigilância da gravidez — '+c.lab)+'.';
  const idn=[]; if(S.idade) idn.push(S.idade+' anos'); if(S.G!=null) idn.push('G'+S.G+'P'+(S.P!=null?S.P:'?')); if(S.rh) idn.push('Rh '+(S.rh==='neg'?'negativo':'positivo'));
  if(idn.length) l1+=' '+idn.join(', ')+'.';
  if(pp!=null) l1+=' Parto a '+fmtD(S.parto)+' ('+pp+' dias pós-parto).';
  else if(d!=null && c.id!=='pre') l1+=' IG '+igT(d)+' (por '+dt.by+'); DPP '+fmtD(dpp())+'.';
  s.push(l1);
  [S_FIXED].concat(st.first?[S_FIRST]:[]).concat(c.S).forEach(g=>{ const lines=[]; g.k.forEach(k=>{ const sel=(st.s[k]||[]).map(x=>x.replace(' (!)','')); const n=st.sn[k]; if(sel.length||n) lines.push('• '+SI[k].l+': '+sel.join(', ')+(sel.length&&n?'; ':'')+(n||'')); }); if(lines.length) s.push(g.g+':\n'+lines.join('\n')); });
  if(st.free.S) s.push(st.free.S); out.S=s.join('\n\n');
  let o=[]; const m=[]; const wg=wgEval(S.peso);
  if(S.peso&&c.O.num.includes('peso')){ let t='Peso '+fmt1(S.peso)+' kg'; if(wg.c) t+=' (peso pré-gravidez '+fmt1(S.pre)+' kg; IMC pré '+fmt1(wg.b)+' — '+wg.c.l.toLowerCase()+(wg.g!=null?'; ganho '+(wg.g>=0?'+':'')+fmt1(wg.g)+' kg, esperado até à data '+fmt1(Math.max(0,wg.r[0]))+'–'+fmt1(wg.r[1])+' kg — '+wg.flag:'')+')'; m.push(t); }
  if(S.tas&&S.tad) m.push('TA '+S.tas+'/'+S.tad+' mmHg');
  if(S.au&&c.O.num.includes('au')) m.push('AU '+fmt(S.au,1)+' cm');
  if(S.bcf&&c.O.num.includes('bcf')) m.push('BCF '+S.bcf+' bpm');
  if(m.length) o.push(m.join('; ')+'.');
  const ur=UR.filter(u=>st.ur[u[0]]).map(u=>u[1].toLowerCase()+' '+st.ur[u[0]].replace(' (!)','').toLowerCase()); if(ur.length) o.push('Urina (tira): '+ur.join(', ')+'.');
  const nrm=c.O.ex.filter(k=>st.ex[k]==='n').map(k=>EX[k].l.split(' (')[0].split(' — ')[0]);
  if(nrm.length) o.push('Sem alterações: '+nrm.join(', ').toLowerCase()+'.');
  c.O.ex.filter(k=>st.ex[k]==='a').forEach(k=>o.push('(!) '+EX[k].l+': '+(st.exn[k]||'alterado')+'.'));
  const rs=Object.keys(st.res).filter(k=>st.res[k]); if(rs.length||st.resn) o.push('Resultados: '+rs.join('; ')+(rs.length&&st.resn?'. ':'')+(st.resn||'')+'.');
  if(st.free.O) o.push(st.free.O); out.O=o.join('\n');
  let a=[]; const aa=Object.keys(st.a).filter(k=>st.a[k]); if(aa.length) a.push(aa.join('. ')+'.');
  if(c.id!=='pp'&&(Object.keys(S.gw).length||S.idade||S.P!=null)){ const gt=gwTotal(); a.push('Escala de Goodwin modificada: '+gt+' ('+gwCls(gt)[0].toLowerCase()+').'); }
  const ics=ICPC.filter(x=>st.ic[x[0]]).map(x=>x[0]+' — '+x[1]); if(ics.length) a.push('ICPC-2: '+ics.join('; ')+'.');
  if(st.free.A) a.push(st.free.A); out.A=a.join('\n');
  let p=[]; const rq=c.req.filter(k=>st.req[k]).map(k=>REQ[k].split(':')[0]); if(rq.length) p.push('Requisitado/verificado: '+rq.join('; ')+'.');
  const su=Object.keys(st.su).filter(k=>st.su[k]); if(su.length) p.push('Suplementação: '+su.join('; ')+'.');
  const va=Object.keys(st.va).filter(k=>st.va[k]); if(va.length) p.push('Vacinação/profilaxia: '+va.join('; ')+'.');
  const ca=c.P.filter(k=>st.p[k]).map(k=>CA[k]); if(ca.length) p.push('Validado/informado: '+ca.join('; ')+'.');
  const po=Object.keys(st.po).filter(k=>st.po[k]); if(po.length) p.push(po.join('. ')+'.');
  const nd=nextDate(c); p.push('Próxima: '+c.next+(nd?' (≈ '+fmtD(nd)+')':'')+'.');
  if(st.free.P) p.push(st.free.P); out.P=p.join('\n');
  return out;
}

function suggestA(){
  const st=cst(); const c=consDef(); const wg=wgEval(S.peso); const gt=gwTotal(); const ta=taFlag();
  const alarmS = Object.keys(st.s).some(k=>(st.s[k]||[]).some(v=>/\(!\)/.test(v)));
  if(c.id==='pp'){ if(!alarmS) st.a['Puerpério sem complicações']=true; if((st.s.amam||[]).includes('Aleitamento materno exclusivo')) st.a['Aleitamento materno exclusivo']=true; st.ic.A98=true; return; }
  if(c.id!=='pre'){ st.ic.W78=true; if(gt<=2&&!alarmS&&!(ta&&ta[1]==='alarm')) st.a['Gravidez de baixo risco evolutiva']=true; else if(gt<=6) st.a['Gravidez de médio risco (Goodwin 3–6)']=true; else { st.a['Gravidez de alto risco (Goodwin ≥ 7)']=true; st.ic.W84=true; } }
  if(wg.flag==='adequado') st.a['Progressão ponderal adequada']=true; if(wg.flag==='acima') st.a['Ganho ponderal acima do recomendado']=true; if(wg.flag==='abaixo') st.a['Ganho ponderal abaixo do recomendado']=true;
  if(ta){ if(ta[1]==='ok') st.a['TA normal']=true; else { st.a['Hipertensão na gravidez']=true; st.ic.W81=true; } }
  const bcf=bcfFlag(); if(bcf&&bcf[1]==='ok'&&(!ta||ta[1]==='ok')) st.a['Bem-estar materno-fetal mantido']=true;
  if(S.rh==='neg') st.a['Rh negativo não sensibilizada']=true;
  if(st.res['Rubéola não imune']) st.a['Rubéola não imune']=true; if(st.res['Toxoplasmose não imune']) st.a['Toxoplasmose não imune']=true;
  if(st.res['PTGO alterada (DG)']){ st.a['Diabetes gestacional']=true; st.ic.W85=true; }
  if((st.s.s1||[]).some(v=>/Náuseas|Vómitos/.test(v))){ st.a['Náuseas e vómitos da gravidez']=true; st.ic.W05=true; }
  st.ic.A98=true;
}

const RM={U:[0.95,2.0,0.12],T21:[0.05,3.4,0.15],T18:[0.30,5.5,0.15],T13:[0.15,4.0,0.15]};
const RB={U:[[0,0],[0.25,0.24],0.10],T21:[[Math.log10(2.0),Math.log10(0.45)],[0.27,0.29],0.10],T1318:[[Math.log10(0.375),Math.log10(0.201)],[0.30,0.30],0.40]};
function rAgeTerm(a){ return 1/(1+Math.exp(7.330-4.211/(1+Math.exp(-0.282*(a-37.23))))); }
function rP21(a){ return Math.min(rAgeTerm(a)/0.7,0.5); }
function ntMedL(c){ return Math.log10(1.2)+(c-45)*(Math.log10(1.9)-Math.log10(1.2))/39; }
function ntSd(c){ return 0.148+(c-45)*(0.093-0.148)/39; }
function gpdf(x,m,s){ return Math.exp(-0.5*Math.pow((x-m)/s,2))/(s*Math.sqrt(2*Math.PI)); }

function bvn(x,y,k){ const m=RB[k][0], s=RB[k][1], r=RB[k][2]; const zx=(x-m[0])/s[0], zy=(y-m[1])/s[1]; return Math.exp(-(zx*zx-2*r*zx*zy+zy*zy)/(2*(1-r*r)))/(2*Math.PI*s[0]*s[1]*Math.sqrt(1-r*r)); }
function rastRisk(age,crl,nt,fb,pp,prev){
  const cl=(v,a,b)=>Math.min(Math.max(v,a),b);
  const y=Math.log10(cl(nt,0.5,9)), f=Math.log10(cl(fb,0.1,6)), p=Math.log10(cl(pp,0.05,4));
  const lrNt21=ntPdf(y,crl,'T21')/ntPdf(y,crl,'U'), lrB21=bvn(f,p,'T21')/bvn(f,p,'U');

}

function rastCalc(){
  const o=$('#o-rast'), cd=$('#rast-cond'); if(!o) return; const R=S.rast;
  const age = R.age!=null? R.age : rastAgeDef();
  let res=null, msg='';
  if(age==null||R.crl==null||R.nt==null||R.fb==null||R.pp==null) msg='<p class="muted">Preenche idade, CCC, TN, β-hCG livre e PAPP-A.</p>';
  else if(R.crl<45||R.crl>84) msg='<div class="note warn">CCC fora do intervalo 45–84 mm — o rastreio combinado não é válido (ver Situações especiais).</div>';
  else if(age<15||age>50||R.nt<=0||R.fb<=0||R.pp<=0) msg='<div class="note warn">Valores fora do intervalo plausível.</div>';
  else if(R.fb>8||R.pp>5) msg='<div class="note alarm">Bioquímica fora do intervalo esperado para MoM — o risco não foi calculado. Introduz os MoM do relatório (não UI/L).</div>';
  else res=rastRisk(age,R.crl,R.nt,R.fb,R.pp,R.prev);

  if(R.nt>=3.5) flags.push(['TN ≥ 3,5 mm — referenciar para DPN (invasivo com microarray, ecocardiografia fetal) independentemente do risco','alarm']);
  if(R.pp!=null&&R.pp<0.4) flags.push(['PAPP-A < 0,4 MoM — risco de pré-eclâmpsia/RCF: Doppler uterinas 20–24 s, crescimento seriado, ponderar AAS','warn']);
  if(R.pp!=null&&R.fb!=null&&R.pp<0.3&&R.fb<0.3) flags.push(['β-hCG livre e PAPP-A muito baixas — padrão de T18/T13/triploidia','alarm']);
  if(R.fb!=null&&R.fb>8) flags.push(['β-hCG livre = '+fmt(R.fb,2)+': valor improvável em MoM — confirma que não introduziste a concentração em UI/L','alarm']);
  else if(R.fb!=null&&R.fb>5) flags.push(['β-hCG livre > 5 MoM — considerar triploidia diândrica/mola parcial','warn']);
  if(R.pp!=null&&R.pp>5) flags.push(['PAPP-A = '+fmt(R.pp,2)+': valor improvável em MoM — confirma que não introduziste a concentração em UI/L','alarm']);

    const n21=rN(res.p21), n13=rN(res.p13);
    h+='<p class="muted" style="font-size:.84rem;margin:0 0 6px">IG pelo CCC ≈ '+igT(res.gaD)+' · TN mediana esperada '+fmt(res.ntMed,2)+' mm (TN '+fmt(R.nt/res.ntMed,2)+' MoM) · idade '+fmt(age,1)+' anos</p>';

    h+=table({h:['','T21','T13/18'],r:[['Risco a priori (idade, 12 s)',rTxt(res.a21),rTxt(res.a13)],['× razão de verosimilhança TN',fmt(res.lrNt21,2),fmt(res.lrNt13,2)],['× razão de verosimilhança bioquímica',fmt(res.lrB21,2),fmt(res.lrB13,2)],['<b>Risco estimado</b>','<b>'+rTxt(res.p21)+'</b>','<b>'+rTxt(res.p13)+'</b>']]},'compact');
    h+='<p class="muted" style="font-size:.8rem">Estimativa aproximada — o risco válido para decisão é o do relatório oficial (software certificado).</p>';

      cd.innerHTML='<h3 style="margin-top:0">Conduta para esta grávida <span class="tag '+c.c+'">'+c.t+' · '+c.r+'</span></h3><p class="muted" style="font-size:.84rem">Com base no '+(off!=null?'risco do relatório oficial (1:'+off.toLocaleString('pt-PT')+')':'risco estimado — confirmar com o relatório oficial')+'.</p>'+ul(c.d)+(flags.length?'<p><b>Além disso:</b></p>'+ul(flags.map(f=>f[0])):'')+cpBtn(txt,'Copiar para o registo (O)'); }

function calcAll(){
  const v=id=>{ const e=$('#'+id); return e?num(e.value):null; };

  // glicemia
  const gj=v('c-gj'); S.gl.gj=gj; set('o-gj', gj? '<div class="note '+(gj>=126?'alarm':gj>=92?'warn':'ok')+'">'+(gj>=126?'≥ 126: diabetes prévia provável — confirmar e referenciar com urgência':gj>=92?'92–125: diabetes gestacional — referenciar; não fazer PTGO':'< 92: normal — PTGO às 24–28 s')+'</div>':'');
  const p0=v('c-p0'),p1=v('c-p1'),p2=v('c-p2'); S.gl.p0=p0;S.gl.p1=p1;S.gl.p2=p2;
  if(p0!=null||p1!=null||p2!=null){ const ab=[]; if(p0>=92) ab.push('0 h ≥ 92'); if(p1>=180) ab.push('1 h ≥ 180'); if(p2>=153) ab.push('2 h ≥ 153'); set('o-pt','<div class="note '+(ab.length?'alarm':'ok')+'">'+(ab.length?'Diabetes gestacional ('+ab.join(', ')+')'+(p0>=126||p2>=200?' — valores sugestivos de diabetes prévia':''):'PTGO normal')+'</div>'); } else set('o-pt','');
  const q0=v('c-q0'),q2=v('c-q2'); S.gl.q0=q0;S.gl.q2=q2;
  if(q0!=null&&q2!=null){ let r= (q0>=126||q2>=200)?['Diabetes mellitus','alarm']: q2>=140?['Tolerância diminuída à glicose','warn']: q0>=110?['Anomalia da glicemia de jejum','warn']:['Normal — glicemia em jejum anual','ok']; set('o-pp','<div class="note '+r[1]+'">'+r[0]+'</div>'); } else set('o-pp','');
  // anemia
  const hb=v('c-hb'), fe=v('c-fe'); S.an.hb=hb; S.an.fe=fe; const trs=$('#c-tr'); if(trs&&!trs._set){ const t=tri(igDays()); if(postpartum()!=null) trs.value='4'; else if(t) trs.value=String(t); trs._set=1; }
  if(hb||fe){ const tr=trs?Number(trs.value):1; const cut={1:11,2:10.5,3:11,4:10}[tr]; let out=[];
    if(hb){ if(hb<=7) out.push(['Hb ≤ 7 g/dL — anemia grave: hospital','alarm']); else if(hb<9) out.push(['Anemia moderada (Hb < 9) — considerar ferro EV a partir do 2.º T (hospitalar)','alarm']); else if(hb<cut) out.push(['Anemia (limiar '+fmt1(cut)+' g/dL) — ferro 100–200 mg/dia; reavaliar em 2–4 semanas','warn']); else out.push(['Sem anemia (limiar '+fmt1(cut)+' g/dL)','ok']); }
    if(fe!=null){ if(fe<30) out.push(['Ferritina < 30 µg/L: ferropenia → suplementar (≥ 60 mg/dia; dias alternados se intolerância)','warn']); else if(fe<70) out.push(['Ferritina 30–70 µg/L: ponderar suplementação se grupo de risco; reavaliar no próximo trimestre','']); else out.push(['Ferritina ≥ 70 µg/L: sem indicação para suplementar (se sem fatores de risco)','ok']); }
    if(hb&&hb<cut&&fe!=null&&fe>=30) out.push(['Anemia sem ferropenia: VGM/HGM — hemoglobinopatia? folato/B12? inflamação (PCR)?','warn']);
    set('o-an',out.map(o=>'<div class="note '+o[1]+'">'+o[0]+'</div>').join('')); } else set('o-an','');

function drawWG(){
  const box=$('#wchart'); if(!box) return; const c=bmiCat(bmiPre()); if(!c){ box.innerHTML=''; return; }
  const W=900,H=300,ml=46,mr=20,mt=14,mb=36, pw=W-ml-mr, ph=H-mt-mb; const yMax=Math.max(c.tot[1]+4, 22), yMin=-4;
  const X=w=>ml+w/42*pw, Y=g=>mt+ph-(g-yMin)/(yMax-yMin)*ph;
  let g='';
  for(let v=yMin; v<=yMax; v+=2){ g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(v===0?'#C9B6B2':'#EEE6E4')+'"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="#6E6169">'+v+'</text>'; }
  for(let w=0; w<=42; w+=2){ g+='<line x1="'+X(w)+'" x2="'+X(w)+'" y1="'+mt+'" y2="'+(mt+ph)+'" stroke="#F3ECEA"/>'; if(w%4===0) g+='<text x="'+X(w)+'" y="'+(H-mb+16)+'" font-size="11" text-anchor="middle" fill="#6E6169">'+w+'</text>'; }
  let up='',lo=''; for(let w=0; w<=42; w+=0.5){ const r=gainRange(c,w); up+=(up?'L':'M')+X(w).toFixed(1)+','+Y(r[1]).toFixed(1); lo='L'+X(w).toFixed(1)+','+Y(r[0]).toFixed(1)+lo; }
  g+='<path d="'+up+lo+'Z" fill="#8E3B63" opacity=".14"/><path d="'+up+'" stroke="#8E3B63" fill="none" stroke-width="1.5"/>';
  g+='<text x="'+(ml+pw/2)+'" y="'+(H-4)+'" font-size="12" text-anchor="middle" fill="#4A3E47">Idade gestacional (semanas)</text><text x="14" y="'+(mt+ph/2)+'" font-size="12" text-anchor="middle" fill="#4A3E47" transform="rotate(-90 14 '+(mt+ph/2)+')">Ganho (kg)</text>';
  const pts=S.wm.filter(m=>m.d&&m.p).map(m=>({w:igDays(m.d)/7,g:m.p-S.pre})); if(S.peso&&igDays()!=null) pts.push({w:igDays()/7,g:S.peso-S.pre,cur:1});
  const ps=pts.filter(p=>p.w>=0&&p.w<=42).sort((a,b)=>a.w-b.w);
  if(ps.length>1) g+='<path d="'+ps.map((p,i)=>(i?'L':'M')+X(p.w).toFixed(1)+','+Y(p.g).toFixed(1)).join('')+'" stroke="#2A2128" fill="none" stroke-dasharray="4 3"/>';
  ps.forEach(p=>{ g+='<circle cx="'+X(p.w)+'" cy="'+Y(p.g)+'" r="'+(p.cur?6:5)+'" fill="'+(p.cur?'#8E3B63':'#2A2128')+'" stroke="#fff" stroke-width="2"/>'; });
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ganho ponderal recomendado">'+g+'</svg><p class="muted" style="font-size:.8rem">Faixa: ganho recomendado (IOM 2009) para '+c.l.toLowerCase()+' — 0,5–2 kg no 1.º T e '+fmt(c.r[0],2)+'–'+fmt(c.r[1],2)+' kg/semana depois.</p>';
}

APP.addEventListener('change', e=>{
  let t=e.target;
  if(t.dataset.dt){ const hd=$('#'+t.dataset.dt); if(hd){ hd.value=t.value; t=hd; } }
  const id=t.id;
  if(id==='igW'||id==='igDd'){ S[id]=num(t.value); S.igAt=S.date; onPatientChange(true); return; }
  const dates={dum:'dum',ecoD:'ecoD',parto:'parto',dppc:'dppc'}; if(dates[id]){ S[id]=parseD(t.value); onPatientChange(true); return; }
  if(id==='cdate'){ S.date=parseD(t.value)||TODAY; onPatientChange(true); return; }
  if(['ecoW','ecoDd','idade','G','P'].includes(id)){ S[id]=num(t.value); onPatientChange(id==='ecoW'||id==='ecoDd'); return; }
  if(id==='rh'){ S.rh=t.value; onPatientChange(false); return; }
  if(id==='consSel'){ S.consId=t.value; renderRibbon(); render(); return; }
  const act=t.dataset.act; const st=S.sec==='cons'?cst():null;
  if(act==='req'){ st.req[t.dataset.id]=t.checked; updRecord(); }
  if(act==='va'){ st.va[t.dataset.id]=t.checked; updRecord(); }
  if(act==='pcare'){ st.p[t.dataset.id]=t.checked; updRecord(); }
  if(act==='gw'){ S.gw[t.dataset.k]=Number(t.value); renderPtSum(); render(); }
  if(act==='gwck'){ S.gw[t.dataset.k]= t.checked? Number(t.dataset.v):0; renderPtSum(); render(); }
  if(act==='per'){ S.per[t.dataset.k]=t.checked; if($('#pe-card')) peRefresh(); else render(); }
  if(act==='puqe'){ S.puqe[t.dataset.k]=Number(t.value); render(); }
  if(act==='bish'){ S.bish[t.dataset.k]=Number(t.value); render(); }
  if(act==='calc') calcAll();
  if(act==='pmaD'){ S.pmaD=parseD(t.value); onPatientChange(true); }
  if(act==='pmaE'){ S.pmaE=num(t.value); onPatientChange(true); }
  if(act==='rast'&&t.type==='checkbox'){ S.rast[t.dataset.k]=t.checked; rastCalc(); }
  if(act==='wm'){ const m=S.wm[+t.dataset.i]; if(t.dataset.f==='d') m.d=parseD(t.value); else m.p=num(t.value); render(); }
  if(t.dataset.bind){ renderPtSum(); if(S.sec==='cons'){ refreshMeas(); updRecord(); } if(S.sec==='calc'){ calcAll(); drawWG(); } }
});
APP.addEventListener('input', e=>{
  const t=e.target; const act=t.dataset.act;
  if(t.id==='q'){ doSearch(); return; }
  if(t.id==='nome'){ S.nome=t.value; return; }
  if(act==='rast'){ S.rast[t.dataset.k]= t.type==='checkbox'? t.checked : num(t.value); rastCalc(); return; }
  if(t.dataset.bind){ S[t.dataset.bind]=num(t.value); $$('[data-bind="'+t.dataset.bind+'"]').forEach(x=>{ if(x!==t) x.value=t.value; }); if(S.sec==='cons'){ updRecord(); refreshMeas(); } renderPtSum(); return; }
  const st=S.sec==='cons'?cst():null;
  if(act==='snote'){ st.sn[t.dataset.k]=t.value; updRecord(); }
  if(act==='exnote'){ st.exn[t.dataset.k]=t.value; updRecord(); }
  if(act==='resn'){ st.resn=t.value; updRecord(); }
  if(act==='free'){ st.free[t.dataset.k]=t.value; updRecord(); }
  if(act==='patq'){ S.patQ=t.value; const pos=t.selectionStart; render(); const n=$('[data-act="patq"]'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }
  if(act==='calcin') calcAll();
});
APP.addEventListener('keydown', e=>{
  if(e.target.id==='q'){ const box=$('#qres'); const res=box._res||[]; if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); qSel=(qSel+(e.key==='ArrowDown'?1:-1)+res.length)%Math.max(1,res.length); $$('#qres button').forEach((b,i)=>b.classList.toggle('hl',i===qSel)); } if(e.key==='Enter'&&res[qSel]){ e.preventDefault(); box.classList.remove('on'); e.target.value=''; res[qSel].go(); } if(e.key==='Escape') box.classList.remove('on'); }
  if(e.key==='Escape') $('#lb').classList.remove('on');
});


/* Limpar tudo: em vez da janela do browser, pede um segundo clique no mesmo botão (como no resto do site). */
function confirmReset(btn){
  if(!btn) return true;
  if(btn._armado){ clearTimeout(btn._armado); btn._armado=null; const s=btn.querySelector('span'); if(s&&btn._txt) s.textContent=btn._txt; return true; }
  const s=btn.querySelector('span'); btn._txt=s?s.textContent:''; if(s) s.textContent='Carrega outra vez para limpar';
  btn._armado=setTimeout(()=>{ btn._armado=null; if(s) s.textContent=btn._txt; },4000);
  toast('Carrega outra vez em «'+btn._txt+'» para limpar todos os dados.');
  return false;
}

S.consId='c1'; renderPtSum(); renderRibbon(); render();
}
